      - name: "🧠 MainActivity"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/MainActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.app.AlertDialog
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.disk.DiskCache
          import com.tvplayer.app.databinding.ActivityMainBinding
          import kotlinx.coroutines.launch
          import org.json.JSONObject
          import java.io.File

          class MainActivity : AppCompatActivity(), ImageLoaderFactory {
              private lateinit var b: ActivityMainBinding
              private var allChannels: List<Channel> = emptyList()
              private var showOnlyFavorites = false
              private val prefs by lazy { getSharedPreferences("tvplayer", MODE_PRIVATE) }
              private var backPressedTime: Long = 0

              override fun newImageLoader(): ImageLoader {
                  return ImageLoader.Builder(this)
                      .diskCache { DiskCache.Builder().directory(cacheDir.resolve("image_cache")).maxSizeBytes(10L * 1024L * 1024L).build() }
                      .build()
              }

              override fun onCreate(s: Bundle?) {
                  installSplashScreen()
                  super.onCreate(s)
                  b = ActivityMainBinding.inflate(layoutInflater); setContentView(b.root)
                  b.recycler.layoutManager = LinearLayoutManager(this)
                  autoCleanCache()
                  b.btnRefresh.setOnClickListener { load() }
                  b.btnFavFilter.setOnClickListener { showOnlyFavorites = !showOnlyFavorites; updateView() }
                  b.btnSettings.setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
                  b.btnFavFilter.nextFocusDownId = R.id.recycler
                  b.btnRefresh.nextFocusDownId = R.id.recycler
                  b.btnSettings.nextFocusDownId = R.id.recycler

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (System.currentTimeMillis() - backPressedTime < 2000) {
                              exitApp()
                          } else {
                              Toast.makeText(this@MainActivity, "Нажмите «Назад» ещё раз для выхода", Toast.LENGTH_SHORT).show()
                              backPressedTime = System.currentTimeMillis()
                          }
                      }
                  })

                  load()
                  checkForUpdates()
              }

              private fun autoCleanCache() {
                  var totalSize = 0L
                  cacheDir.walkTopDown().forEach { if (it.isFile) totalSize += it.length() }
                  if (totalSize > 15 * 1024 * 1024) {
                      cacheDir.listFiles()?.forEach { it.deleteRecursively() }
                  }
              }

              private fun exitApp() {
                  finishAffinity()
                  android.os.Process.killProcess(android.os.Process.myPid())
              }

              private fun checkForUpdates() {
                  lifecycleScope.launch {
                      val info = UpdateChecker.checkForUpdate(this@MainActivity) ?: return@launch
                      AlertDialog.Builder(this@MainActivity)
                          .setTitle("Доступно обновление v${info.versionCode}")
                          .setMessage(info.changelog.take(400))
                          .setPositiveButton("Скачать и установить") { _, _ -> startUpdateDownload(info.downloadUrl) }
                          .setNegativeButton("Позже", null)
                          .show()
                  }
              }

              private fun startUpdateDownload(url: String) {
                  Toast.makeText(this, "Загрузка обновления...", Toast.LENGTH_LONG).show()
                  lifecycleScope.launch {
                      val file = UpdateChecker.downloadApk(this@MainActivity, url)
                      if (file == null) {
                          Toast.makeText(this@MainActivity, "Не удалось скачать обновление", Toast.LENGTH_LONG).show()
                          return@launch
                      }
                      installApk(file)
                  }
              }

              private fun installApk(file: File) {
                  if (!packageManager.canRequestPackageInstalls()) {
                      Toast.makeText(this, "Разрешите установку из этого приложения", Toast.LENGTH_LONG).show()
                      try {
                          val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName"))
                          startActivity(intent)
                      } catch (_: Exception) {}
                      return
                  }
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Ошибка установки: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun load() {
                  if (!NetworkUtils.isOnline(this)) {
                      b.progress.visibility = View.GONE; b.recycler.visibility = View.GONE
                      b.error.text = "Нет подключения к интернету."
                      b.error.visibility = View.VISIBLE; return
                  }
                  b.progress.visibility = View.VISIBLE; b.error.visibility = View.GONE; b.recycler.visibility = View.GONE
                  lifecycleScope.launch {
                      val (manual, cat) = readConfig()
                      val manualWithLogos = manual.map { ch ->
                          if (ch.logo.isBlank()) {
                              val thumb = StreamResolver.getThumbnail(ch.url)
                              if (thumb.isNotBlank()) ch.copy(logo = thumb) else ch
                          } else ch
                      }
                      allChannels = loadChannels(cat, manualWithLogos)
                      b.progress.visibility = View.GONE
                      if (allChannels.isEmpty()) {
                          b.error.text = "Не удалось загрузить список."
                          b.error.visibility = View.VISIBLE; return@launch
                      }
                      updateView()
                  }
              }

              private fun updateView() {
                  val favs = prefs.getStringSet("favorites", emptySet()) ?: emptySet()
                  allChannels.forEach { it.isFavorite = favs.contains(it.url) }
                  val sorted = allChannels.sortedByDescending { it.isFavorite }
                  val displayed = if (showOnlyFavorites) sorted.filter { it.isFavorite } else sorted
                  b.txtTitle.text = if (showOnlyFavorites) "Избранное (${displayed.size})" else "Все каналы (${displayed.size})"
                  b.btnFavFilter.setTextColor(if (showOnlyFavorites) android.graphics.Color.WHITE else android.graphics.Color.parseColor("#FFEB3B"))
                  b.recycler.visibility = View.VISIBLE
                  b.recycler.adapter = ChannelAdapter(displayed, { ch ->
                      val intent = Intent(this@MainActivity, PlayerActivity::class.java)
                      intent.putExtra("index", allChannels.indexOfFirst { it.url == ch.url })
                      intent.putStringArrayListExtra("names", ArrayList(allChannels.map { it.name }))
                      intent.putStringArrayListExtra("urls", ArrayList(allChannels.map { it.url }))
                      startActivity(intent)
                  }, { ch ->
                      val currentFavs = prefs.getStringSet("favorites", emptySet())?.toMutableSet() ?: mutableSetOf()
                      if (currentFavs.contains(ch.url)) currentFavs.remove(ch.url) else currentFavs.add(ch.url)
                      prefs.edit().putStringSet("favorites", currentFavs).apply()
                      updateView()
                  })
                  b.recycler.post { b.recycler.getChildAt(0)?.requestFocus() }
              }

              private fun readConfig(): Pair<List<Channel>, String> {
                  val json = assets.open("vk_config.json").bufferedReader().use { it.readText() }
                  val o = JSONObject(json); val manual = mutableListOf<Channel>()
                  o.optJSONArray("channels")?.let { arr -> for (i in 0 until arr.length()) { val c = arr.getJSONObject(i); manual.add(Channel(c.optString("name"), c.optString("url"), c.optString("logo"), c.optString("group", "VK Video"))) } }
                  val cats = o.optJSONArray("categories")
                  return manual to (if (cats != null && cats.length() > 0) cats.getString(0) else "")
              }
          }
          EOF

      # ═══════════════════════════════════════════════════
      # ШАГ 5: SettingsActivity
      # ═══════════════════════════════════════════════════
      - name: "⚙ SettingsActivity"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/SettingsActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import androidx.lifecycle.lifecycleScope
          import coil.Coil
          import com.tvplayer.app.databinding.ActivitySettingsBinding
          import kotlinx.coroutines.launch
          import java.io.File

          class SettingsActivity : AppCompatActivity() {
              private lateinit var b: ActivitySettingsBinding

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivitySettingsBinding.inflate(layoutInflater); setContentView(b.root)

                  b.txtVersion.text = "TV Player v${BuildConfig.VERSION_CODE}"
                  b.txtAbout.text = """
                      Лёгкое и быстрое приложение для просмотра телеканалов VK Live на телефоне и ТВ-приставке.
                      
                      🎯 ВОЗМОЖНОСТИ:
                      • Просмотр каналов VK Live в высоком качестве
                      • Автоматическая подгрузка списка каналов
                      • Выбор качества видео и формата экрана
                      • Избранное (долгое нажатие ОК)
                      • Переключение каналов пультом вверх/вниз
                      • Панель каналов прямо в плеере (нажатие ОК)
                      • Таймер сна (от 5 минут до 5 часов)
                      • Авто-обновление приложения
                      • Умное кэширование ссылок и очистка кэша
                      
                      ⚙️ ТЕХНОЛОГИИ:
                      • Резолвер: yt-dlp (Python + Chaquopy)
                      • Плеер: AndroidX Media3 (ExoPlayer)
                      • Сборка: GitHub Actions (CI/CD)
                      
                      🔄 Обновления выходят автоматически. При запуске приложение само проверяет наличие новой версии и предлагает обновиться.
                      
                      ❤️ Сделано с любовью для семьи и друзей.
                  """.trimIndent()

                  updateCacheInfo()

                  b.btnBack.setOnClickListener { finish() }
                  checkUpdate(silent = true)
                  b.btnCheckUpdate.setOnClickListener { checkUpdate(silent = false) }

                  b.btnClearCache.setOnClickListener {
                      val imageLoader = Coil.imageLoader(this)
                      imageLoader.diskCache?.clear()
                      imageLoader.memoryCache?.clear()
                      StreamCache.clearAll(this)
                      cacheDir.listFiles()?.forEach { it.deleteRecursively() }
                      Toast.makeText(this, "Кэш очищен", Toast.LENGTH_SHORT).show()
                      updateCacheInfo()
                  }

                  b.btnExitApp.setOnClickListener {
                      finishAffinity()
                      android.os.Process.killProcess(android.os.Process.myPid())
                  }
              }

              private fun checkUpdate(silent: Boolean) {
                  b.txtStatus.text = "⏳ Проверка обновлений..."
                  b.txtStatus.setTextColor(Color.parseColor("#FF8A8D93"))
                  lifecycleScope.launch {
                      val info = UpdateChecker.checkForUpdate(this@SettingsActivity)
                      if (info == null) {
                          b.txtStatus.text = "✅ У вас актуальная версия"
                          b.txtStatus.setTextColor(Color.parseColor("#FF4ADE80"))
                          if (!silent) Toast.makeText(this@SettingsActivity, "Обновлений нет", Toast.LENGTH_SHORT).show()
                      } else {
                          b.txtStatus.text = "🎉 Доступно обновление v${info.versionCode}!"
                          b.txtStatus.setTextColor(Color.parseColor("#FFFACC15"))
                          AlertDialog.Builder(this@SettingsActivity)
                              .setTitle("Доступно обновление v${info.versionCode}")
                              .setMessage(info.changelog.take(400))
                              .setPositiveButton("Скачать и установить") { _, _ -> startUpdateDownload(info.downloadUrl) }
                              .setNegativeButton("Позже", null)
                              .show()
                      }
                  }
              }

              private fun updateCacheInfo() {
                  var totalSize = 0L
                  cacheDir.walkTopDown().forEach { if (it.isFile) totalSize += it.length() }
                  val sizeMb = totalSize / 1024f / 1024f
                  b.btnClearCache.text = String.format("🗑 Очистить кэш (%.1f МБ)", sizeMb)
              }

              private fun startUpdateDownload(url: String) {
                  Toast.makeText(this, "Загрузка обновления...", Toast.LENGTH_LONG).show()
                  lifecycleScope.launch {
                      val file = UpdateChecker.downloadApk(this@SettingsActivity, url)
                      if (file == null) {
                          Toast.makeText(this@SettingsActivity, "Не удалось скачать", Toast.LENGTH_LONG).show()
                          return@launch
                      }
                      installApk(file)
                  }
              }

              private fun installApk(file: File) {
                  if (!packageManager.canRequestPackageInstalls()) {
                      Toast.makeText(this, "Разрешите установку из этого приложения", Toast.LENGTH_LONG).show()
                      try {
                          val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName"))
                          startActivity(intent)
                      } catch (_: Exception) {}
                      return
                  }
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Ошибка установки: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

      # ═══════════════════════════════════════════════════
      # ШАГ 6: PlayerActivity (ручная навигация + подсветка) + коммит
      # ═══════════════════════════════════════════════════
      - name: "🎬 PlayerActivity (навигация + подсветка) + коммит"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/PlayerActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.app.AlertDialog
          import android.graphics.Color
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          import android.view.View
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.common.Tracks
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.hls.HlsMediaSource
          import androidx.media3.exoplayer.trackselection.DefaultTrackSelector
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.tvplayer.app.databinding.ActivityPlayerBinding
          import kotlinx.coroutines.launch

          class PlayerActivity : AppCompatActivity() {
              private lateinit var b: ActivityPlayerBinding
              private var player: ExoPlayer? = null
              private lateinit var trackSelector: DefaultTrackSelector
              private var sleepTimer: CountDownTimer? = null
              private var names: List<String> = emptyList()
              private var urls: List<String> = emptyList()
              private var currentIndex: Int = 0
              private var retryCount = 0
              private val MAX_RETRIES = 5
              private val RETRY_DELAY = 2000L
              private var currentResizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
              private val handler = Handler(Looper.getMainLooper())
              private val hideControlsRunnable = Runnable {
                  b.controlsOverlay.visibility = View.GONE
                  b.rightControls.visibility = View.GONE
                  b.btnSleepTimer.visibility = View.GONE
                  b.leftControls.visibility = View.GONE
              }
              private val hideChannelOverlayRunnable = Runnable { b.channelNameOverlay.visibility = View.GONE }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivityPlayerBinding.inflate(layoutInflater); setContentView(b.root)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.hide(WindowInsetsCompat.Type.systemBars())
                  controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE

                  b.touchArea.isFocusable = false
                  b.touchArea.isFocusableInTouchMode = false

                  setupFocusHighlight()

                  names = intent.getStringArrayListExtra("names") ?: emptyList()
                  urls = intent.getStringArrayListExtra("urls") ?: emptyList()
                  currentIndex = intent.getIntExtra("index", 0)
                  startPlayback()

                  b.btnBack.setOnClickListener { finish() }
                  b.btnExitApp.setOnClickListener { exitApp() }
                  b.btnRetry.setOnClickListener { b.errorLayout.visibility = View.GONE; retryCount = 0; startPlayback() }
                  b.btnAspect.setOnClickListener { toggleAspect(); resetHideTimeout() }
              }

              // ═══════════ ПОДСВЕТКА ФОКУСА ═══════════
              // Фон кнопок меняется через селектор (button_focus_bg.xml).
              // Здесь мы меняем ЦВЕТ ТЕКСТА, чтобы он читался на белом фоне при фокусе.
              private fun setupFocusHighlight() {
                  listOf(
                      b.btnQuality,
                      b.btnSleepTimer,
                      b.btnAspect,
                      b.btnBack,
                      b.btnExitApp
                  ).forEach { tv ->
                      tv.setOnFocusChangeListener { _, hasFocus ->
                          tv.setTextColor(if (hasFocus) Color.BLACK else Color.WHITE)
                      }
                  }
                  // Для Play/Pause (ImageView) фон меняется сам через btn_play_pause_focus.xml,
                  // цвет иконки белый остаётся читаемым на синем и прозрачном фоне.
              }

              private fun toggleAspect() {
                  currentResizeMode = if (currentResizeMode == AspectRatioFrameLayout.RESIZE_MODE_ZOOM) {
                      AspectRatioFrameLayout.RESIZE_MODE_FIT
                  } else {
                      AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                  }
                  b.playerView.resizeMode = currentResizeMode
                  b.btnAspect.text = if (currentResizeMode == AspectRatioFrameLayout.RESIZE_MODE_ZOOM) "Заполнить" else "Вписать"
              }

              private fun exitApp() {
                  handler.removeCallbacksAndMessages(null); sleepTimer?.cancel(); player?.release(); player = null
                  finishAffinity()
                  android.os.Process.killProcess(android.os.Process.myPid())
              }

              // ═══════════ РУЧНАЯ НАВИГАЦИЯ ═══════════
              private fun handleMenuNavigation(keyCode: Int): Boolean {
                  val cur = currentFocus ?: run {
                      b.btnPlayPause.requestFocus()
                      return true
                  }
                  val nextId: Int? = when (cur.id) {
                      R.id.btnPlayPause -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> R.id.btnSleepTimer
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnBack
                          KeyEvent.KEYCODE_DPAD_RIGHT -> R.id.btnQuality
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnQuality
                          else -> null
                      }
                      R.id.btnSleepTimer -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnPlayPause
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnExitApp
                          KeyEvent.KEYCODE_DPAD_RIGHT -> R.id.btnQuality
                          else -> null
                      }
                      R.id.btnBack -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_RIGHT -> R.id.btnExitApp
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnPlayPause
                          else -> null
                      }
                      R.id.btnExitApp -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnBack
                          KeyEvent.KEYCODE_DPAD_RIGHT -> R.id.btnSleepTimer
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnPlayPause
                          else -> null
                      }
                      R.id.btnQuality -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> R.id.btnSleepTimer
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnAspect
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnPlayPause
                          else -> null
                      }
                      R.id.btnAspect -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> R.id.btnQuality
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnPlayPause
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnPlayPause
                          else -> null
                      }
                      else -> null
                  }
                  if (nextId != null) {
                      findViewById<View>(nextId)?.requestFocus()
                      return true
                  }
                  return false
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (b.channelListPanel.visibility == View.VISIBLE) {
                      if (event.keyCode == KeyEvent.KEYCODE_BACK && event.action == KeyEvent.ACTION_DOWN) {
                          b.channelListPanel.visibility = View.GONE
                          showControls()
                          return true
                      }
                      return super.dispatchKeyEvent(event)
                  }

                  if (b.controlsOverlay.visibility == View.VISIBLE) {
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          when (event.keyCode) {
                              KeyEvent.KEYCODE_BACK -> {
                                  hideControlsRunnable.run()
                                  return true
                              }
                              KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                                  (currentFocus as? View)?.performClick()
                                  resetHideTimeout()
                                  return true
                              }
                              KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN,
                              KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT -> {
                                  val handled = handleMenuNavigation(event.keyCode)
                                  if (handled) { resetHideTimeout(); return true }
                                  return true
                              }
                          }
                      }
                      return true
                  }

                  if (event.action == KeyEvent.ACTION_DOWN) {
                      when (event.keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_CHANNEL_UP -> { switchChannel(-1); return true }
                          KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_CHANNEL_DOWN -> { switchChannel(1); return true }
                          KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_MENU -> { showChannelList(); return true }
                          KeyEvent.KEYCODE_BACK -> { exitApp(); return true }
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun resetHideTimeout() {
                  handler.removeCallbacks(hideControlsRunnable)
                  handler.postDelayed(hideControlsRunnable, 5000)
              }

              private fun showChannelList() {
                  val channels = names.mapIndexed { i, n -> Channel(n, urls.getOrNull(i) ?: "", "") }
                  b.channelListPanel.visibility = View.VISIBLE
                  b.controlsOverlay.visibility = View.GONE
                  b.rightControls.visibility = View.GONE
                  b.btnSleepTimer.visibility = View.GONE
                  b.leftControls.visibility = View.GONE
                  b.channelListRecycler.layoutManager = LinearLayoutManager(this)
                  b.channelListRecycler.adapter = ChannelListAdapter(channels) { ch ->
                      val idx = urls.indexOf(ch.url)
                      if (idx >= 0) { currentIndex = idx; startPlayback() }
                      b.channelListPanel.visibility = View.GONE
                  }
                  b.channelListRecycler.scrollToPosition(currentIndex)
                  b.channelListRecycler.post { b.channelListRecycler.findViewHolderForAdapterPosition(currentIndex)?.itemView?.requestFocus() }
              }

              private fun switchChannel(direction: Int) {
                  val newIndex = currentIndex + direction
                  if (newIndex in urls.indices) { currentIndex = newIndex; startPlayback() }
              }

              private fun startPlayback() {
                  getSharedPreferences("tvplayer", MODE_PRIVATE).edit().putInt("last_channel", currentIndex).apply()
                  val chNum = currentIndex + 1
                  val chName = names.getOrNull(currentIndex) ?: "Канал"
                  b.channelNameOverlay.text = "$chNum. $chName"
                  b.channelNameOverlay.visibility = View.VISIBLE
                  handler.removeCallbacks(hideChannelOverlayRunnable)
                  handler.postDelayed(hideChannelOverlayRunnable, 3000)
                  b.errorLayout.visibility = View.GONE
                  retryCount = 0
                  val channelUrl = urls.getOrNull(currentIndex) ?: return
                  val cached = StreamCache.get(this, channelUrl)
                  if (cached != null) { play(cached); return }
                  if (!NetworkUtils.isOnline(this)) {
                      b.progress.visibility = View.GONE
                      b.errorText.text = "Нет подключения к интернету."
                      b.errorLayout.visibility = View.VISIBLE; return
                  }
                  b.progress.visibility = View.VISIBLE
                  lifecycleScope.launch {
                      val direct = StreamResolver.resolve(channelUrl)
                      if (direct.startsWith("ERROR:")) { handleError(); return@launch }
                      StreamCache.put(this@PlayerActivity, channelUrl, direct)
                      play(direct)
                  }
              }

              private fun play(m3u8: String) {
                  player?.release()
                  val http = DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
                      .setDefaultRequestProperties(mapOf("Referer" to "https://vk.com/", "Origin" to "https://vk.com"))
                  val loadControl = DefaultLoadControl.Builder().setBufferDurationsMs(10000, 30000, 1500, 3000).build()
                  trackSelector = DefaultTrackSelector(this)
                  player = ExoPlayer.Builder(this).setTrackSelector(trackSelector).setLoadControl(loadControl).build().apply {
                      setMediaSource(HlsMediaSource.Factory(http).createMediaSource(MediaItem.fromUri(m3u8)))
                      playWhenReady = true; prepare()
                      addListener(object : Player.Listener {
                          override fun onTracksChanged(tracks: Tracks) { updateQualityButton(tracks); retryCount = 0; b.progress.visibility = View.GONE }
                          override fun onPlayerError(error: PlaybackException) {
                              super.onPlayerError(error)
                              urls.getOrNull(currentIndex)?.let { StreamCache.invalidate(this@PlayerActivity, it) }
                              handleError()
                          }
                      })
                  }
                  b.playerView.player = player
                  b.progress.visibility = View.GONE
                  b.btnPlayPause.setImageResource(android.R.drawable.ic_media_pause)
                  showControls()
                  b.btnQuality.setOnClickListener { showQualityDialog(); resetHideTimeout() }
                  b.btnSleepTimer.setOnClickListener { showSleepTimerDialog(); resetHideTimeout() }
                  b.btnPlayPause.setOnClickListener {
                      player?.let { p ->
                          if (p.isPlaying) {
                              p.pause()
                              b.btnPlayPause.setImageResource(android.R.drawable.ic_media_play)
                          } else {
                              p.play()
                              b.btnPlayPause.setImageResource(android.R.drawable.ic_media_pause)
                          }
                      }
                      resetHideTimeout()
                  }
                  b.touchArea.setOnClickListener {
                      if (b.controlsOverlay.visibility == View.VISIBLE) hideControlsRunnable.run() else showControls()
                  }
              }

              private fun updateQualityButton(tracks: Tracks) {
                  val videoGroup = tracks.groups.firstOrNull { it.type == C.TRACK_TYPE_VIDEO } ?: return
                  val selectedIndex = (0 until videoGroup.length).firstOrNull { videoGroup.isTrackSelected(it) } ?: return
                  val format = videoGroup.getTrackFormat(selectedIndex)
                  val height = if (format.height > 0) "${format.height}p" else "Auto"
                  val bitrate = if (format.bitrate > 0) " ${format.bitrate / 1000}k" else ""
                  b.btnQuality.text = height + bitrate
              }

              private fun showQualityDialog() {
                  val p = player ?: return
                  val tracks = p.currentTracks
                  val videoGroup = tracks.groups.firstOrNull { it.type == C.TRACK_TYPE_VIDEO } ?: return
                  val qualities = mutableListOf<String>(); qualities.add("Авто (Auto)")
                  val formats = mutableListOf<androidx.media3.common.Format>()
                  var selectedTrackIndex = -1
                  for (i in 0 until videoGroup.length) { if (videoGroup.isTrackSelected(i)) { selectedTrackIndex = i; break } }
                  for (i in 0 until videoGroup.length) {
                      val format = videoGroup.getTrackFormat(i)
                      val prefix = if (i == selectedTrackIndex) "▶ " else "   "
                      val text = if (format.height > 0) "${prefix}${format.height}p (${format.bitrate / 1000} kbps)" else "${prefix}Track $i"
                      qualities.add(text); formats.add(format)
                  }
                  AlertDialog.Builder(this).setTitle("Качество видео").setItems(qualities.toTypedArray()) { _, which ->
                      if (which == 0) trackSelector.parameters = trackSelector.buildUponParameters().clearOverridesOfType(C.TRACK_TYPE_VIDEO).setAllowVideoMixedMimeTypeAdaptiveness(true).build()
                      else trackSelector.parameters = trackSelector.buildUponParameters().setOverrideForType(TrackSelectionOverride(videoGroup.getMediaTrackGroup(), which - 1)).build()
                  }.show()
              }

              private fun handleError() {
                  if (retryCount < MAX_RETRIES) {
                      retryCount++; b.progress.visibility = View.VISIBLE; handler.postDelayed({ startPlayback() }, RETRY_DELAY)
                  } else {
                      b.progress.visibility = View.GONE
                      b.errorText.text = "Не удалось подключиться к потоку.\nСделано попыток: $MAX_RETRIES"
                      b.errorLayout.visibility = View.VISIBLE; b.controlsOverlay.visibility = View.GONE
                      b.rightControls.visibility = View.GONE; b.btnSleepTimer.visibility = View.GONE; b.leftControls.visibility = View.GONE
                  }
              }

              private fun showSleepTimerDialog() {
                  val options = arrayOf("Выключить", "5 минут", "10 минут", "15 минут", "30 минут", "45 минут", "1 час", "2 часа", "3 часа", "4 часа", "5 часов")
                  val minutes = intArrayOf(0, 5, 10, 15, 30, 45, 60, 120, 180, 240, 300)
                  AlertDialog.Builder(this).setTitle("Таймер сна").setItems(options) { _, which -> val mins = minutes[which]; if (mins == 0) cancelSleepTimer() else startSleepTimer(mins) }.show()
              }

              private fun startSleepTimer(minutes: Int) {
                  sleepTimer?.cancel()
                  val millis = minutes * 60 * 1000L
                  sleepTimer = object : CountDownTimer(millis, 1000) {
                      override fun onTick(millisUntilFinished: Long) {
                          val m = millisUntilFinished / 1000 / 60; val s = (millisUntilFinished / 1000) % 60
                          b.btnSleepTimer.text = String.format("Сон: %02d:%02d", m, s); b.btnSleepTimer.setTextColor(Color.parseColor("#FFEB3B"))
                      }
                      override fun onFinish() { exitApp() }
                  }.start()
                  resetHideTimeout()
              }

              private fun cancelSleepTimer() { sleepTimer?.cancel(); sleepTimer = null; b.btnSleepTimer.text = "Сон: Выкл"; b.btnSleepTimer.setTextColor(Color.WHITE) }

              private fun showControls() {
                  b.controlsOverlay.visibility = View.VISIBLE
                  b.rightControls.visibility = View.VISIBLE
                  b.btnSleepTimer.visibility = View.VISIBLE
                  b.leftControls.visibility = View.VISIBLE
                  b.btnPlayPause.post { b.btnPlayPause.requestFocus() }
                  resetHideTimeout()
              }

              override fun onDestroy() {
                  super.onDestroy(); handler.removeCallbacksAndMessages(null); sleepTimer?.cancel(); player?.release(); player = null
              }
          }
          EOF

          RUN_NUMBER="${{ github.run_number }}"
          sed -i "s/versionCode = [0-9]*/versionCode = $RUN_NUMBER/" app/build.gradle
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "feat: focus highlight for player buttons" || echo "no changes"
          git push || echo "push failed"

      # ═══════════════════════════════════════════════════
      # СБОРКА И РЕЛИЗ
      # ═══════════════════════════════════════════════════
      - name: "🔨 Build APK"
        if: steps.checkytdlp.outputs.skip != 'true'
        id: build
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "─── Что упало ───"; grep -A 20 "What went wrong" /tmp/gradle_build.log | head -25; tail -50 /tmp/gradle_build.log; exit 1
          fi
          echo "✅ Gradle OK"

      - name: "📦 Prepare APK"
        if: steps.checkytdlp.outputs.skip != 'true'
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          RUN_NUMBER="${{ github.run_number }}"
          TAG="v${RUN_NUMBER}"
          FILE="TVPlayer_v${RUN_NUMBER}.apk"
          cp "$SRC" "$FILE"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: "🚀 Release"
        if: steps.checkytdlp.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: TV Player v${{ github.run_number }}
          body: |
            ## Сборка #${{ github.run_number }}

            🎨 **Добавлена визуальная подсветка кнопок в плеере:**
            - При перемещении фокуса кнопка становится **белой** с синей обводкой, а текст — чёрным.
            - **Play/Pause** — при фокусе становится синим кругом с белой иконкой.
            - Раньше кнопки нажимались «наугад» — теперь видно, где фокус.

            📦 Скачайте APK ниже и установите поверх старой версии.
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
