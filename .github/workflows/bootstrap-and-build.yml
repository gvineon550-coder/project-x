          cat > $D/CrashLogger.kt << 'EOF'
          package com.tvplayer.app

          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.content.FileProvider
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object CrashLogger {
              private const val LOG_FILE = "app.log"
              private const val MAX_SIZE = 400 * 1024
              private var appContext: Context? = null
              private val dateFormat = SimpleDateFormat("yyyy-MM-dd HH:mm:ss.SSS", Locale.US)
              private val lock = Any()

              fun init(context: Context) {
                  synchronized(lock) {
                      if (appContext != null) return
                      appContext = context.applicationContext
                  }
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      log("CRASH", "Uncaught in ${thread.name}: ${throwable.javaClass.simpleName}")
                      log("CRASH", throwable.stackTraceToString())
                      defaultHandler?.uncaughtException(thread, throwable)
                  }
                  val v = try { BuildConfig.VERSION_CODE.toString() } catch (_: Exception) { "?" }
                  log("INIT", "═══ App started v$v ═══")
                  log("INIT", "Device: ${Build.MANUFACTURER} ${Build.MODEL}, Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})")
              }

              fun log(tag: String, message: String) {
                  val ctx = appContext ?: return
                  synchronized(lock) {
                      try {
                          val file = File(ctx.filesDir, LOG_FILE)
                          if (file.exists() && file.length() > MAX_SIZE) {
                              val content = file.readText()
                              val cut = content.length / 2
                              val nl = content.indexOf('\n', cut)
                              file.writeText(if (nl > 0) content.substring(nl + 1) else content)
                          }
                          file.appendText("[${dateFormat.format(Date())}] [$tag] $message\n")
                      } catch (_: Exception) {}
                  }
              }

              fun info(tag: String, message: String) = log(tag, message)

              fun error(tag: String, message: String, t: Throwable? = null) {
                  log(tag, "❌ $message")
                  t?.let { log(tag, it.stackTraceToString()) }
              }

              fun readAll(context: Context): String = try {
                  val f = File(context.filesDir, LOG_FILE)
                  if (f.exists()) f.readText() else "Лог пуст"
              } catch (e: Exception) { "Не удалось прочитать лог: ${e.message}" }

              fun clear(context: Context) {
                  synchronized(lock) {
                      try { File(context.filesDir, LOG_FILE).delete() } catch (_: Exception) {}
                  }
              }

              fun share(context: Context) {
                  try {
                      val file = File(context.filesDir, LOG_FILE)
                      if (!file.exists()) return
                      val uri = FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)
                      val intent = Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_STREAM, uri)
                          putExtra(Intent.EXTRA_SUBJECT, "TV Player — лог")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      context.startActivity(Intent.createChooser(intent, "Отправить лог"))
                  } catch (e: Exception) { log("SHARE", "Не удалось отправить лог: ${e.message}") }
              }
          }
          EOF

