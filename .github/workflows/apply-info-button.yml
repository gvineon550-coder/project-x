name: Apply Info Button

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Патч"
        run: |
          python3 << 'PYEOF'
          import pathlib, sys
          p = pathlib.Path(".github/workflows/bootstrap-and-build.yml")
          if not p.exists():
              print("❌ bootstrap-and-build.yml не найден"); sys.exit(1)
          t = p.read_text(encoding="utf-8")
          ok, miss = 0, []

          def rep(old, new, label):
              global t
              if old in t:
                  t = t.replace(old, new, 1); return True
              miss.append(label); return False

          def ins_before(anchor, block, label):
              global t
              i = t.find(anchor)
              if i < 0:
                  miss.append(label); return False
              ls = t.rfind("\n", 0, i) + 1
              sp = " " * (len(t[ls:]) - len(t[ls:].lstrip()))
              t = t[:ls] + "".join(sp + ln + "\n" for ln in block.split("\n")) + t[ls:]
              return True

          def ins_after(anchor, block, label):
              global t
              i = t.find(anchor)
              if i < 0:
                  miss.append(label); return False
              le = t.find("\n", i)
              sp = " " * (len(t[t.rfind(chr(10), 0, i)+1:le]) - len(t[t.rfind(chr(10), 0, i)+1:le].lstrip()))
              t = t[:le+1] + "".join(sp + ln + "\n" for ln in block.split("\n")) + t[le+1:]
              return True

          # 1-2. Кэш
          ok += rep("maxSizeBytes(10L * 1024L * 1024L)", "maxSizeBytes(5L * 1024L * 1024L)", "coil-cache")
          ok += rep("size(120, 120)", "size(100, 100)", "thumb-size")

          # 3. infoPanel в layout (перед </FrameLayout>)
          ok += ins_before("</FrameLayout>",
              '<LinearLayout\n'
              'android:id="@+id/infoPanel"\n'
              'android:layout_width="wrap_content"\n'
              'android:layout_height="wrap_content"\n'
              'android:layout_gravity="bottom|end"\n'
              'android:layout_margin="32dp"\n'
              'android:orientation="vertical"\n'
              'android:background="#AA000000"\n'
              'android:padding="14dp"\n'
              'android:minWidth="220dp"\n'
              'android:visibility="gone">\n'
              '<TextView\n'
              'android:id="@+id/txtInfoMain"\n'
              'android:layout_width="wrap_content"\n'
              'android:layout_height="wrap_content"\n'
              'android:textColor="#FFFFFFFF"\n'
              'android:textSize="15sp"\n'
              'android:textStyle="bold"\n'
              'android:lineSpacingExtra="3dp" />\n'
              '<TextView\n'
              'android:id="@+id/txtInfoExtra"\n'
              'android:layout_width="wrap_content"\n'
              'android:layout_height="wrap_content"\n'
              'android:paddingTop="8dp"\n'
              'android:textColor="#FFBFC5CE"\n'
              'android:textSize="13sp"\n'
              'android:fontFamily="monospace"\n'
              'android:lineSpacingExtra="3dp"\n'
              'android:visibility="gone" />\n'
              '</LinearLayout>', "layout-infoPanel")

          # 4. Кнопка 🐞 в rightControls (после btnAspect)
          ok += ins_after(
              'android:id="@+id/btnAspect"',
              '<TextView\n'
              'android:id="@+id/btnInfo"\n'
              'android:layout_width="wrap_content"\n'
              'android:layout_height="wrap_content"\n'
              'android:layout_marginTop="8dp"\n'
              'android:background="@drawable/button_focus_bg"\n'
              'android:paddingHorizontal="16dp"\n'
              'android:paddingVertical="8dp"\n'
              'android:text="🐞 Инфо"\n'
              'android:textColor="#FFFFFF"\n'
              'android:textSize="16sp"\n'
              'android:textStyle="bold"\n'
              'android:clickable="true"\n'
              'android:focusable="true" />', "btnInfo-layout")

          # 5. Поля в PlayerActivity (после hideChannelOverlayRunnable)
          ok += ins_after(
              'private val hideChannelOverlayRunnable = Runnable { b.channelNameOverlay.visibility = View.GONE }',
              'private var infoExtended = false\n'
              'private var lastRxBytes = -1L\n'
              'private var netKbps = 0L\n'
              'private val hideInfo = Runnable { if (!infoExtended) b.infoPanel.visibility = View.GONE }\n'
              'private val infoTick = object : Runnable {\n'
              '    override fun run() {\n'
              '        if (infoExtended) { updateNetSpeed(); updateInfoPanel(); handler.postDelayed(this, 1000) }\n'
              '    }\n'
              '}', "player-fields")

          # 6. Методы (перед updateQualityButton)
          ok += ins_before('private fun updateQualityButton(tracks: Tracks) {',
              'private fun toggleInfo() {\n'
              '    infoExtended = !infoExtended\n'
              '    handler.removeCallbacks(infoTick); handler.removeCallbacks(hideInfo)\n'
              '    b.infoPanel.visibility = View.VISIBLE\n'
              '    if (infoExtended) { lastRxBytes = -1; handler.post(infoTick) }\n'
              '    else { updateInfoPanel(); handler.postDelayed(hideInfo, 3000) }\n'
              '}\n'
              'private fun updateNetSpeed() {\n'
              '    val rx = android.net.TrafficStats.getUidRxBytes(android.os.Process.myUid())\n'
              '    if (rx == android.net.TrafficStats.UNSUPPORTED.toLong()) { netKbps = -1; return }\n'
              '    if (lastRxBytes >= 0) netKbps = (rx - lastRxBytes) * 8 / 1024\n'
              '    lastRxBytes = rx\n'
              '}\n'
              'private fun updateInfoPanel() {\n'
              '    val name = names.getOrNull(currentIndex) ?: "Канал"\n'
              '    b.txtInfoMain.text = "${currentIndex + 1}. $name\\n🔴 LIVE · ${b.btnQuality.text}"\n'
              '    if (!infoExtended) { b.txtInfoExtra.visibility = View.GONE; return }\n'
              '    val buf = (player?.totalBufferedDuration ?: 0L) / 1000.0\n'
              '    val net = if (netKbps < 0) "—" else "$netKbps кбит/с"\n'
              '    b.txtInfoExtra.text = buildString {\n'
              '        appendLine("Буфер: ${String.format(java.util.Locale.US, "%.1f", buf)} с")\n'
              '        appendLine("Сеть:  $net")\n'
              '        appendLine("DNS:   ${if (DohSettings.isEnabled(this@PlayerActivity)) "AdGuard DoH" else "системный"}")\n'
              '    }.trimEnd()\n'
              '    b.txtInfoExtra.visibility = View.VISIBLE\n'
              '}', "player-methods")

          # 7. Обработчик клика кнопки (после btnAspect.setOnClickListener)
          ok += ins_after(
              'b.btnAspect.setOnClickListener { toggleAspect(); resetHideTimeout() }',
              'b.btnInfo.setOnClickListener { toggleInfo(); resetHideTimeout() }',
              "btnInfo-click")

          # 8. Фокус на кнопке (в setupFocusHighlight, добавить btnInfo)
          ok += rep(
              'listOf(b.btnQuality, b.btnSleepTimer, b.btnAspect, b.btnBack, b.btnExitApp).forEach { tv ->',
              'listOf(b.btnQuality, b.btnSleepTimer, b.btnAspect, b.btnInfo, b.btnBack, b.btnExitApp).forEach { tv ->',
              "focus-highlight")

          # 9. Показать инфо при старте (перед stallChecker)
          ok += ins_before('handler.postDelayed(stallChecker, 30_000)',
              'b.infoPanel.visibility = View.VISIBLE\n'
              'handler.removeCallbacks(hideInfo)\n'
              'handler.postDelayed(hideInfo, 4000)\n'
              'updateInfoPanel()', "play-showinfo")

          # 10. Обновлять инфо при смене дорожек
          ok += ins_after(
              'updateQualityButton(tracks); retryCount = 0; b.progress.visibility = View.GONE',
              'updateInfoPanel()', "tracks-info")

          # 11. Очистка в onDestroy
          ok += rep(
              'handler.removeCallbacksAndMessages(null); sleepTimer?.cancel(); player?.release(); player = null',
              'handler.removeCallbacks(infoTick); handler.removeCallbacksAndMessages(null); sleepTimer?.cancel(); player?.release(); player = null',
              "ondestroy-info")

          print(f"✅ Применено правок: {ok}/11")
          if miss:
              print("⚠️ Не найдено:", ", ".join(miss))
          if ok < 8:
              print("❌ Слишком много пропусков — файл НЕ изменён"); sys.exit(1)
          p.write_text(t, encoding="utf-8")
          print("📄 bootstrap-and-build.yml обновлён")
          PYEOF

      - name: "💾 Коммит"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/workflows/bootstrap-and-build.yml
          if git diff --staged --quiet; then
            echo "Изменений нет"; exit 0
          fi
          git commit -m "feat: info button 🐞 + cache 5MB + thumb 100px"
          git push
