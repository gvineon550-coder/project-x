                      AspectRatioFrameLayout.RESIZE_MODE_FIT else AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                  b.playerView.resizeMode = currentResizeMode
                  b.btnAspect.text = if (currentResizeMode == AspectRatioFrameLayout.RESIZE_MODE_ZOOM) "Заполнить" else "Вписать"
              }

              private fun togglePlayPause() {
                  val p = player ?: return
                  if (p.isPlaying) { p.pause(); b.btnPlayPause.setImageResource(android.R.drawable.ic_media_play) }
                  else { p.play(); b.btnPlayPause.setImageResource(android.R.drawable.ic_media_pause) }
              }

              private fun exitApp() {
                  handler.removeCallbacksAndMessages(null)
                  sleepTimer?.cancel()
                  player?.release(); player = null
                  PlaybackQueue.clear()
                  finishAffinity()
              }

              private fun handleMenuNav(keyCode: Int): Boolean {
                  val cur = currentFocus ?: run { b.btnPlayPause.requestFocus(); return true }
                  val next: Int? = when (cur.id) {
                      R.id.btnPlayPause -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> R.id.btnSleepTimer
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnBack
                          KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnQuality
                          else -> null
                      }
                      R.id.btnSleepTimer -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnPlayPause
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnExitApp
                          KeyEvent.KEYCODE_DPAD_RIGHT -> R.id.btnQuality
                          else -> null
                      }
                      R.id.btnBack -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_RIGHT -> R.id.btnExitApp
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnPlayPause
                          else -> null
                      }
                      R.id.btnExitApp -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnBack
                          KeyEvent.KEYCODE_DPAD_RIGHT -> R.id.btnSleepTimer
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnPlayPause
                          else -> null
                      }
                      R.id.btnQuality -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> R.id.btnSleepTimer
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnAudio
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnPlayPause
                          else -> null
                      }
                      R.id.btnAudio -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> R.id.btnQuality
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnAspect
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnPlayPause
                          else -> null
                      }
                      R.id.btnAspect -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> R.id.btnAudio
                          KeyEvent.KEYCODE_DPAD_DOWN -> R.id.btnFavorite
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnPlayPause
                          else -> null
                      }
                      R.id.btnFavorite -> when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> R.id.btnAspect
                          KeyEvent.KEYCODE_DPAD_LEFT -> R.id.btnPlayPause
                          else -> null
                      }
                      else -> null
                  }
                  if (next != null) { findViewById<View>(next)?.requestFocus(); return true }
                  return false
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (b.channelListPanel.visibility == View.VISIBLE) {
                      if (event.keyCode == KeyEvent.KEYCODE_BACK && event.action == KeyEvent.ACTION_DOWN) {
                          b.channelListPanel.visibility = View.GONE
                          showControls()
                          return true
                      }
                      return super.dispatchKeyEvent(event)
                  }

                  if (event.action == KeyEvent.ACTION_DOWN) {
                      when (event.keyCode) {
                          KeyEvent.KEYCODE_INFO, KeyEvent.KEYCODE_I -> { toggleInfo(); return true }
                          KeyEvent.KEYCODE_M, KeyEvent.KEYCODE_VOLUME_MUTE -> { toggleMute(); return true }
                          KeyEvent.KEYCODE_Q -> { showQualityDialog(); return true }
                          KeyEvent.KEYCODE_F -> { toggleFavorite(); return true }
                          KeyEvent.KEYCODE_A -> { showAudioDialog(); return true }
                      }
                  }

                  if (b.controlsOverlay.visibility == View.VISIBLE) {
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          when (event.keyCode) {
                              KeyEvent.KEYCODE_BACK -> { hideControls.run(); return true }
                              KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                                  (currentFocus as? View)?.performClick(); resetHideTimeout(); return true
                              }
                              KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN,
                              KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT -> {
                                  handleMenuNav(event.keyCode); resetHideTimeout(); return true
                              }
                          }
                      }
                      return true
                  }

                  if (event.action == KeyEvent.ACTION_DOWN) {
                      when (event.keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_CHANNEL_UP -> { switchChannel(-1); return true }
                          KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_CHANNEL_DOWN -> { switchChannel(1); return true }
                          KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_MENU -> {
                              showChannelList(); return true
                          }
                          KeyEvent.KEYCODE_BACK -> { finish(); return true }
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun resetHideTimeout() {
                  handler.removeCallbacks(hideControls)
                  handler.postDelayed(hideControls, 5000)
              }

              private fun showControls() {
                  b.controlsOverlay.visibility = View.VISIBLE
                  b.rightControls.visibility = View.VISIBLE
                  b.btnSleepTimer.visibility = View.VISIBLE
                  b.leftControls.visibility = View.VISIBLE
                  b.btnPlayPause.post { b.btnPlayPause.requestFocus() }
                  resetHideTimeout()
              }

              private fun showChannelList() {
                  val ch = current() ?: return
                  val ordered = channels.sortedByDescending { it.isFavorite }
                  b.panelTitle.text = "Каналы (${channels.size})"
                  b.channelListPanel.visibility = View.VISIBLE
                  b.controlsOverlay.visibility = View.GONE
                  b.rightControls.visibility = View.GONE
                  b.btnSleepTimer.visibility = View.GONE
                  b.leftControls.visibility = View.GONE
                  b.channelListRecycler.layoutManager = LinearLayoutManager(this)
                  b.channelListRecycler.adapter = ChannelListAdapter(ordered, ch.url,
                      { c -> channels.indexOfFirst { it.url == c.url } + 1 },
                      { c ->
                          val idx = channels.indexOfFirst { it.url == c.url }
                          if (idx >= 0) { currentIndex = idx; b.channelListPanel.visibility = View.GONE; startPlayback() }
                      },
                      { c -> toggleFavorite(c); showChannelList() })
                  val pos = ordered.indexOfFirst { it.url == ch.url }.coerceAtLeast(0)
                  b.channelListRecycler.scrollToPosition(pos)
                  b.channelListRecycler.post {
                      b.channelListRecycler.findViewHolderForAdapterPosition(pos)?.itemView?.requestFocus()
                  }
              }

              private fun switchChannel(direction: Int) {
                  if (channels.isEmpty()) return
                  val newIndex = currentIndex + direction
                  if (newIndex in channels.indices) { currentIndex = newIndex; startPlayback() }
              }

              private fun startPlayback(resetRetry: Boolean = true) {
                  val ch = current() ?: return
                  playbackToken++
                  val token = playbackToken
                  resolveJob?.cancel()
                  if (resetRetry) retryCount = 0
                  handler.removeCallbacks(hideName)
                  handler.removeCallbacks(hideInfo)

                  prefs.edit().putString("last_channel_url", ch.url).apply()
                  b.channelNameOverlay.text = "${currentIndex + 1}. ${ch.name}"
                  b.channelNameOverlay.visibility = View.VISIBLE
                  handler.postDelayed(hideName, 3000)
                  b.errorLayout.visibility = View.GONE
                  b.infoPanel.visibility = View.VISIBLE
                  handler.postDelayed(hideInfo, 4000)

                  qualityApplied = false
                  triedAlternative = false
                  qualityText = "Auto"
                  audioText = "авто"
                  epgNow = null; epgNext = null
                  updateFavButton()
                  updateInfoPanel()
                  loadEpg(ch)

                  CrashLogger.info("Player", "Открытие #${currentIndex + 1}: ${ch.name} (${ch.source})")

                  val cached = if (UrlUtils.isVk(ch.url)) StreamCache.get(this, ch.url) else null
                  if (cached != null) { play(cached); return }

                  if (!NetworkUtils.isOnline(this)) {
                      b.progress.visibility = View.GONE
                      showError("Нет подключения к интернету.\nНажмите «Повторить».")
                      return
                  }

                  b.progress.visibility = View.VISIBLE
                  resolveJob = lifecycleScope.launch {
                      val url = StreamResolver.resolve(ch.url)
                      if (token != playbackToken) return@launch
                      if (url.startsWith("ERROR")) { handleError(url); return@launch }
                      if (UrlUtils.isVk(ch.url)) StreamCache.put(this@PlayerActivity, ch.url, url)
                      play(url)
                  }
              }

              private fun loadEpg(ch: Channel) {
                  if (ch.source != Channel.SOURCE_M3U || ch.playlistId.isBlank()) return
                  lifecycleScope.launch {
                      EpgStore.ensureLoaded(this@PlayerActivity, ch.playlistId)
                      val (n, nx) = EpgStore.nowNext(ch.playlistId, ch.tvgId, ch.name)
                      if (ch.url == current()?.url) { epgNow = n; epgNext = nx; updateInfoPanel() }
                  }
              }

              private fun play(url: String) {
                  currentStreamUrl = url
                  player?.release()
                  useHls = UrlUtils.isHls(url)
                  val ch = current()

                  val headers = if (ch != null && UrlUtils.isVk(ch.url))
                      mapOf("Referer" to "https://vk.com/", "Origin" to "https://vk.com")
                  else emptyMap()

                  val factory = OkHttpDataSource.Factory(http)
                      .setUserAgent(HttpClientProvider.UA)
                      .setDefaultRequestProperties(headers)

                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(5000, 15000, 1000, 2000)
                      .setTargetBufferBytes(12 * 1024 * 1024)
                      .setPrioritizeTimeOverSizeThresholds(true)
                      .build()

                  trackSelector = DefaultTrackSelector(this)
                  val item = MediaItem.fromUri(url)
                  val source = if (useHls)
                      HlsMediaSource.Factory(factory).setAllowChunklessPreparation(true).createMediaSource(item)
                  else ProgressiveMediaSource.Factory(factory).createMediaSource(item)

                  player = ExoPlayer.Builder(this)
                      .setTrackSelector(trackSelector)
                      .setLoadControl(loadControl)
                      .build().apply {
                          setMediaSource(source)
                          playWhenReady = true
                          volume = if (muted) 0f else 1f
                          prepare()
                          addListener(object : Player.Listener {
                              override fun onTracksChanged(tracks: Tracks) {
                                  updateQualityButton(tracks)
                                  applyRememberedQuality(tracks)
                                  updateAudioLabel(tracks)
                                  updateInfoPanel()
                              }

                              override fun onPlaybackStateChanged(state: Int) {
                                  when (state) {
                                      Player.STATE_BUFFERING -> b.progress.visibility = View.VISIBLE
                                      Player.STATE_READY -> {
                                          b.progress.visibility = View.GONE
                                          retryCount = 0
                                      }
                                      else -> {}
                                  }
                              }

                              override fun onPlayerError(error: PlaybackException) {
                                  CrashLogger.error("Player", "Ошибка ${error.errorCodeName} (${error.errorCode}) HLS=$useHls")
                                  current()?.let { StreamCache.invalidate(this@PlayerActivity, it.url) }
                                  val c = current()
                                  if (!triedAlternative && c != null && !UrlUtils.isVk(c.url)) {
                                      triedAlternative = true
                                      useHls = !useHls
                                      CrashLogger.info("Player", "Пробую другой тип потока (HLS=$useHls)")
                                      play(currentStreamUrl)
                                      return
                                  }
                                  handleError("Ошибка плеера: ${error.errorCodeName}")
                              }
                          })
                      }

                  b.playerView.player = player
                  b.playerView.resizeMode = currentResizeMode
                  b.progress.visibility = View.VISIBLE
                  b.btnPlayPause.setImageResource(android.R.drawable.ic_media_pause)
                  updateInfoPanel()
              }

              private fun updateNetSpeed() {
                  val rx = TrafficStats.getUidRxBytes(Process.myUid())
                  if (rx == TrafficStats.UNSUPPORTED.toLong()) { netKbps = -1; return }
                  if (lastRxBytes >= 0) netKbps = (rx - lastRxBytes) * 8 / 1024
                  lastRxBytes = rx
              }

              private fun toggleInfo() {
                  infoExtended = !infoExtended
                  handler.removeCallbacks(infoTick)
                  handler.removeCallbacks(hideInfo)
                  b.infoPanel.visibility = View.VISIBLE
                  if (infoExtended) {
                      lastRxBytes = -1
                      handler.post(infoTick)
                  } else {
                      updateInfoPanel()
                      handler.postDelayed(hideInfo, 3000)
                  }
              }

              private fun updateInfoPanel() {
                  val ch = current() ?: return
                  val kind = if (ch.source == Channel.SOURCE_VK) "🔴 LIVE" else "📺 IPTV"
                  b.txtInfoMain.text = "${ch.name}\n$kind · $qualityText"
                  if (!infoExtended) { b.txtInfoExtra.visibility = View.GONE; return }
                  val buf = (player?.totalBufferedDuration ?: 0L) / 1000.0
                  val net = if (netKbps < 0) "—" else "$netKbps кбит/с"
                  b.txtInfoExtra.text = buildString {
                      appendLine("Буфер: ${String.format(Locale.US, "%.1f", buf)} с")
                      appendLine("Сеть:  $net")
                      appendLine("Звук:  ${if (muted) "выключен" else audioText}")
                      appendLine("DNS:   ${if (DohSettings.isEnabled(this@PlayerActivity)) "AdGuard DoH" else "системный"}")
                      appendLine("Тип:   ${if (useHls) "HLS" else "progressive"}")
                      epgNow?.let { appendLine("Сейчас: ${it.title}") }
                      epgNext?.let { appendLine("Далее:  ${it.title}") }
                  }.trimEnd()
                  b.txtInfoExtra.visibility = View.VISIBLE
              }

              private fun toggleMute() {
                  muted = !muted
                  player?.volume = if (muted) 0f else 1f
                  Toast.makeText(this, if (muted) "🔇 Звук выключен" else "🔊 Звук включён", Toast.LENGTH_SHORT).show()
                  updateInfoPanel()
              }

              private fun toggleFavorite(target: Channel? = current()) {
                  val ch = target ?: return
                  val favs = prefs.getStringSet("favorites", emptySet())?.toMutableSet() ?: mutableSetOf()
                  val added = !favs.contains(ch.url)
                  if (added) favs.add(ch.url) else favs.remove(ch.url)
                  prefs.edit().putStringSet("favorites", favs).apply()
                  applyFavorites()
                  updateFavButton()
                  Toast.makeText(this, if (added) "★ Добавлено в избранное" else "☆ Убрано из избранного", Toast.LENGTH_SHORT).show()
              }

              private fun updateFavButton() {
                  val ch = current() ?: return
                  b.btnFavorite.text = if (ch.isFavorite) "★ В избранном" else "☆ В избранное"
              }

              private fun updateQualityButton(tracks: Tracks) {
                  val g = tracks.groups.firstOrNull { it.type == C.TRACK_TYPE_VIDEO } ?: return
                  val i = (0 until g.length).firstOrNull { g.isTrackSelected(it) } ?: return
                  val f = g.getTrackFormat(i)
                  val h = if (f.height > 0) "${f.height}p" else "Auto"
                  val br = if (f.bitrate > 0) " ${f.bitrate / 1000}k" else ""
                  qualityText = h + br
                  b.btnQuality.text = qualityText
              }

              private fun updateAudioLabel(tracks: Tracks) {
                  val g = tracks.groups.firstOrNull { it.type == C.TRACK_TYPE_AUDIO } ?: return
                  val i = (0 until g.length).firstOrNull { g.isTrackSelected(it) } ?: return
                  val f = g.getTrackFormat(i)
                  audioText = f.language ?: f.label ?: "дорожка ${i + 1}"
                  b.btnAudio.text = "Звук: $audioText"
              }

              private fun applyRememberedQuality(tracks: Tracks) {
                  if (qualityApplied) return
                  qualityApplied = true
                  val ch = current() ?: return
                  val h = qualityPrefs.getInt(ch.url, 0)
                  if (h <= 0) return
                  val g = tracks.groups.firstOrNull { it.type == C.TRACK_TYPE_VIDEO } ?: return
                  for (i in 0 until g.length) {
                      if (g.getTrackFormat(i).height == h) {
                          trackSelector.parameters = trackSelector.buildUponParameters()
                              .setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, i)).build()
                          CrashLogger.info("Player", "Качество из памяти: ${h}p")
                          break
                      }
                  }
              }

              private fun showQualityDialog() {
                  val p = player ?: return
                  val g = p.currentTracks.groups.firstOrNull { it.type == C.TRACK_TYPE_VIDEO } ?: return
                  val sel = (0 until g.length).firstOrNull { g.isTrackSelected(it) } ?: -1
                  val items = mutableListOf("Авто (Auto)")
                  for (i in 0 until g.length) {
                      val f = g.getTrackFormat(i)
                      val prefix = if (i == sel) "▶ " else "   "
                      items.add(if (f.height > 0) "$prefix${f.height}p (${f.bitrate / 1000} kbps)" else "${prefix}Track $i")
                  }
                  AlertDialog.Builder(this).setTitle("Качество видео").setItems(items.toTypedArray()) { _, w ->
                      val ch = current()
                      if (w == 0) {
                          trackSelector.parameters = trackSelector.buildUponParameters()
                              .clearOverridesOfType(C.TRACK_TYPE_VIDEO).build()
                          ch?.let { qualityPrefs.edit().putInt(it.url, 0).apply() }
                      } else {
                          val idx = w - 1
                          trackSelector.parameters = trackSelector.buildUponParameters()
                              .setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, idx)).build()
                          ch?.let { qualityPrefs.edit().putInt(it.url, g.getTrackFormat(idx).height).apply() }
                      }
                  }.show()
              }

              private fun showAudioDialog() {
                  val p = player ?: return
                  val g = p.currentTracks.groups.firstOrNull { it.type == C.TRACK_TYPE_AUDIO }
                  if (g == null || g.length == 0) {
                      Toast.makeText(this, "Альтернативных аудиодорожек нет", Toast.LENGTH_SHORT).show(); return
                  }
                  val sel = (0 until g.length).firstOrNull { g.isTrackSelected(it) } ?: -1
                  val items = mutableListOf("Авто")
                  for (i in 0 until g.length) {
                      val f = g.getTrackFormat(i)
                      val prefix = if (i == sel) "▶ " else "   "
                      val lang = f.language ?: f.label ?: "дорожка ${i + 1}"
                      val extra = if (f.channelCount > 0) " · ${f.channelCount}ch" else ""
                      items.add("$prefix$lang$extra")
                  }
                  AlertDialog.Builder(this).setTitle("Аудиодорожка").setItems(items.toTypedArray()) { _, w ->
                      trackSelector.parameters = if (w == 0)
                          trackSelector.buildUponParameters().clearOverridesOfType(C.TRACK_TYPE_AUDIO).build()
                      else trackSelector.buildUponParameters()
                          .setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, w - 1)).build()
                  }.show()
              }

              private fun handleError(details: String?) {
                  if (retryCount < maxRetries) {
                      retryCount++
                      b.progress.visibility = View.VISIBLE
                      CrashLogger.info("Player", "Ретрай $retryCount/$maxRetries")
                      handler.postDelayed({ startPlayback(resetRetry = false) }, retryDelay)
                  } else {
                      showError("Не удалось воспроизвести канал\n${details ?: "Неизвестная ошибка"}\nПопыток: $maxRetries")
                      CrashLogger.error("Player", "Все попытки исчерпаны")
                  }
              }

              private fun showError(text: String) {
                  b.progress.visibility = View.GONE
                  b.errorText.text = text
                  b.errorLayout.visibility = View.VISIBLE
                  b.controlsOverlay.visibility = View.GONE
                  b.rightControls.visibility = View.GONE
                  b.btnSleepTimer.visibility = View.GONE
                  b.leftControls.visibility = View.GONE
              }

              private fun showSleepTimerDialog() {
                  val options = arrayOf("Выключить", "5 минут", "10 минут", "15 минут", "30 минут",
                      "45 минут", "1 час", "2 часа", "3 часа", "4 часа", "5 часов")
                  val minutes = intArrayOf(0, 5, 10, 15, 30, 45, 60, 120, 180, 240, 300)
                  AlertDialog.Builder(this).setTitle("Таймер сна").setItems(options) { _, w ->
                      if (minutes[w] == 0) cancelSleepTimer() else startSleepTimer(minutes[w])
                  }.show()
              }

              private fun startSleepTimer(minutes: Int) {
                  sleepTimer?.cancel()
                  sleepTimer = object : CountDownTimer(minutes * 60 * 1000L, 1000) {
                      override fun onTick(ms: Long) {
                          val m = ms / 1000 / 60; val s = (ms / 1000) % 60
                          b.btnSleepTimer.text = String.format(Locale.US, "Сон: %02d:%02d", m, s)
                          b.btnSleepTimer.setTextColor(Color.parseColor("#FFEB3B"))
                      }
                      override fun onFinish() {
                          CrashLogger.info("Player", "Таймер сна сработал")
                          exitApp()
                      }
                  }.start()
                  resetHideTimeout()
              }

              private fun cancelSleepTimer() {
                  sleepTimer?.cancel(); sleepTimer = null
                  b.btnSleepTimer.text = "Сон: Выкл"
                  b.btnSleepTimer.setTextColor(Color.WHITE)
              }

              private fun showLogDialog() {
                  val log = CrashLogger.readAll(this)
                  AlertDialog.Builder(this).setTitle("Лог приложения").setMessage(log.takeLast(3000))
                      .setPositiveButton("Скопировать") { _, _ ->
                          (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager)
                              .setPrimaryClip(ClipData.newPlainText("log", log))
                          Toast.makeText(this, "Лог скопирован", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Закрыть", null).show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null)
                  resolveJob?.cancel()
                  sleepTimer?.cancel()
                  player?.release(); player = null
                  CrashLogger.info("Player", "Закрытие")
              }
          }
          EOF

      - name: "💾 Коммит + сборка + релиз"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          RUN_NUMBER="${{ github.run_number }}"
          sed -i "s/versionCode = [0-9]*/versionCode = $RUN_NUMBER/" app/build.gradle
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: M3U/EPG + retry/timeout + memory & stealth + player overlay [skip ci]" || echo "no changes"
          git push || echo "push skipped"

      - name: "🔨 Build APK"
        if: steps.checkytdlp.outputs.skip != 'true'
        id: build
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "─── Что упало ───"
            grep -A 25 "What went wrong" /tmp/gradle_build.log | head -40
            grep -E "^e: |error:" /tmp/gradle_build.log | head -40
            tail -60 /tmp/gradle_build.log
            exit 1
          fi
          echo "✅ Gradle OK"

      - name: "📦 Prepare APK"
        if: steps.checkytdlp.outputs.skip != 'true'
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          RUN_NUMBER="${{ github.run_number }}"
          FILE="TVPlayer_v${RUN_NUMBER}.apk"
          cp "$SRC" "$FILE"
          ls -lh "$FILE"
          echo "tag=v${RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: "🚀 Release"
        if: steps.checkytdlp.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: TV Player v${{ github.run_number }}
          body: |
            ## Сборка #${{ github.run_number }}

            ### 🐛 Исправленные баги
            - Cooldown DoH теперь сбрасывается при переключении тумблера в обе стороны
            - `OkHttpClient` — единый пул на всё приложение (VK, OTA, M3U, EPG, Coil, плеер)
            - **Бесконечный ретрай**: счётчик попыток больше не сбрасывается при повторе (лимит 5 работает)
            - `vk_config.json` больше не роняет приложение, если его нет
            - Последний канал хранится по URL, а не по индексу
            - `Python.isStarted()` перед синхронизацией DoH
            - Убран жёсткий `killProcess()` — корректное завершение
            - Проверка пустого списка при переключении каналов

            ### 🔁 Надёжность
            - Ретрай резолва ×2 (пауза 1 с), ретрай VK API ×2 (пауза 2 с)
            - Таймаут Python 30 с, **Mutex** — yt-dlp не работает в два потока
            - Авто-определение типа потока: HLS ↔ progressive при ошибке
            - Проверка сети перед резолвом, индикатор 📴 Офлайн

            ### 💾 Лёгкость
            - Кэш картинок 5 МБ, буфер плеера 5/15/1/2 с (лимит 12 МБ)
            - `onTrimMemory` / `onLowMemory` — очистка кэшей
            - Эвикция 20% старых записей в кэше ссылок и превью
            - EPG хранится урезанным: до 6 передач на канал

            ### 🕵️ Стелс
            - Кэш превью 24 ч (и 6 ч для «не найдено»)
            - Случайная пауза 200–500 мс перед yt-dlp
            - Не-VK ссылки вообще не идут в yt-dlp

            ### 📺 M3U/M3U8 + EPG
            - Две независимые вкладки: **VK Live** и **Плейлисты** (не смешиваются)
            - Источники: 📁 файл, 🔗 ссылка (автообновление 6 ч), ✏️ канал вручную
            - Парсер: `tvg-id`, `tvg-logo`, `group-title`, `#EXTGRP`, `x-tvg-url`, cp1251
            - Группы каналов и фильтр по группам
            - EPG **только для плейлистов**: XMLTV и `.gz`, привязка по `tvg-id` и по имени
            - Прямые потоки играют мимо yt-dlp

            ### 🎬 Плеер
            - Инфо-оверлей: **I / INFO** (буфер, скорость, звук, DNS, тип потока, EPG)
            - Выбор аудиодорожки, **M** — mute, **Q** — качество (запоминается для канала)
            - **F** или ★ в меню — избранное прямо из плеера
            - Панель каналов: избранное сверху, текущий подсвечен, долгое ОК — ★

            ### ❌ Осознанно не делали
            PiP, история просмотров, скриншоты, поиск, цифры 0–9, EPG для VK, R8 (отдельное репо).
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
