          cat > $D/DohProvider.kt << 'EOF'
          package com.tvplayer.app

          import android.content.Context
          import okhttp3.Cache
          import okhttp3.Dns
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.dnsoverhttps.DnsOverHttps
          import java.io.File
          import java.net.InetAddress
          import java.net.UnknownHostException

          object DohProvider {
              private const val DOH_URL = "https://dns.adguard-dns.com/dns-query"
              private const val TEST_DOMAIN = "wikipedia.org"

              @Volatile private var cached: Dns? = null
              @Volatile private var diagClient: OkHttpClient? = null

              fun createWithFallback(context: Context): Dns {
                  cached?.let { return it }
                  return synchronized(this) { cached ?: build(context.applicationContext).also { cached = it } }
              }

              fun invalidate() = synchronized(this) { cached = null; diagClient = null }

              private fun diag(context: Context): OkHttpClient {
                  diagClient?.let { return it }
                  return synchronized(this) {
                      diagClient ?: OkHttpClient.Builder()
                          .cache(Cache(File(context.cacheDir, "doh_cache"), 5L * 1024 * 1024))
                          .build().also { diagClient = it }
                  }
              }

              private fun doh(context: Context): DnsOverHttps? = try {
                  DnsOverHttps.Builder()
                      .client(diag(context))
                      .url(DOH_URL.toHttpUrl())
                      .includeIPv6(false)
                      .build()
              } catch (e: Exception) {
                  CrashLogger.error("DoH", "Не удалось создать DoH", e); null
              }

              private fun build(context: Context): Dns {
                  val resolver = doh(context)
                  return object : Dns {
                      override fun lookup(hostname: String): List<InetAddress> {
                          if (!DohSettings.isEnabled(context) || resolver == null) return Dns.SYSTEM.lookup(hostname)
                          try {
                              val r = resolver.lookup(hostname)
                              if (r.isNotEmpty()) return r
                          } catch (e: Exception) {
                              CrashLogger.info("DoH", "$hostname: ${e.message} — фолбэк")
                          }
                          return try { Dns.SYSTEM.lookup(hostname) } catch (e: UnknownHostException) {
                              CrashLogger.error("DoH", "Системный DNS не смог: $hostname", e); throw e
                          }
                      }
                  }
              }

              fun testDoh(context: Context): Boolean {
                  if (!DohSettings.isEnabled(context)) return false
                  return try {
                      val r = doh(context)?.lookup(TEST_DOMAIN)
                      !r.isNullOrEmpty()
                  } catch (e: Exception) {
                      CrashLogger.error("DoH", "Pre-flight провален", e); false
                  }
              }

              data class TestResult(val name: String, val ok: Boolean, val detail: String,
                                    val latencyMs: Long = 0L, val error: String? = null)

              private fun suspicious(ip: String): String? = when {
                  ip == "0.0.0.0" || ip == "127.0.0.1" -> "AdGuard заблокировал (блок-страница)"
                  ip.startsWith("8.6.") -> "AdGuard перенаправил на блок-страницу"
                  else -> null
              }

              private fun tryDoH(context: Context, host: String): TestResult {
                  val t = System.currentTimeMillis()
                  return try {
                      val r = doh(context)?.lookup(host).orEmpty()
                      val el = System.currentTimeMillis() - t
                      if (r.isEmpty()) TestResult(host, false, "пустой ответ", el, "NXDOMAIN или блокировка")
                      else {
                          val ip = r.first().hostAddress
                          val s = suspicious(ip)
                          if (s != null) TestResult(host, false, "$host → $ip", el, s)
                          else TestResult(host, true, "$host → $ip", el)
                      }
                  } catch (e: Exception) {
                      TestResult(host, false, "ошибка", System.currentTimeMillis() - t,
                          "${e.javaClass.simpleName}: ${e.message}")
                  }
              }

              private fun trySystem(host: String): TestResult {
                  val t = System.currentTimeMillis()
                  return try {
                      val r = Dns.SYSTEM.lookup(host)
                      TestResult(host, r.isNotEmpty(), "$host → ${r.firstOrNull()?.hostAddress}", System.currentTimeMillis() - t)
                  } catch (e: Exception) {
                      TestResult(host, false, "ошибка", System.currentTimeMillis() - t, e.message)
                  }
              }

              private fun tryPython(): TestResult {
                  val t = System.currentTimeMillis()
                  return try {
                      if (!com.chaquo.python.Python.isStarted())
                          return TestResult("Python DoH", false, "интерпретатор не запущен", 0)
                      val h = com.chaquo.python.Python.getInstance().getModule("resolver").callAttr("doh_health").toString()
                      fun flag(k: String) = Regex("'$k':\\s*(True|False)").find(h)?.groupValues?.get(1) == "True"
                      fun num(k: String) = Regex("'$k':\\s*(\\d+)").find(h)?.groupValues?.get(1) ?: "0"
                      val el = System.currentTimeMillis() - t
                      when {
                          !flag("enabled") -> TestResult("Python DoH", false, "выключен переключателем", el)
                          !flag("available") -> TestResult("Python DoH", false, "dnspython не загружен", el)
                          flag("cooldown_active") -> TestResult("Python DoH", false, "circuit breaker активен", el,
                              "ошибок: ${num("consecutive_fails")}, медленных: ${num("slow_count")}")
                          else -> TestResult("Python DoH", true,
                              "DoH: ${num("doh_resolved")} · фолбэк: ${num("system_fallback")} · кэш: ${num("cache_size")}", el)
                      }
                  } catch (e: Exception) {
                      TestResult("Python DoH", false, "нет статуса", System.currentTimeMillis() - t, e.message)
                  }
              }

              private fun fmt(title: String, r: TestResult): String = buildString {
                  append(if (r.ok) "✅ " else "❌ ").append(title)
                  if (r.ok && r.latencyMs > 0) append(" — ${r.latencyMs} мс")
                  append("\n   ").append(r.detail)
                  r.error?.let { append("\n   ⚠ ").append(it) }
                  append("\n")
              }

              fun runFullDiagnostics(context: Context): String {
                  if (!DohSettings.isEnabled(context))
                      return "🔴 AdGuard DoH: ВЫКЛ\nВсе запросы идут через системный DNS.\n"
                  val sb = StringBuilder("🟢 AdGuard DoH: ВКЛ\n")
                  var ok = 0
                  val tests = listOf(
                      "AdGuard DoH (Kotlin)" to tryDoH(context, TEST_DOMAIN),
                      "AdGuard DoH (Python)" to tryPython(),
                      "Системный DNS (фолбэк)" to trySystem(TEST_DOMAIN),
                      "VK API через DoH" to tryDoH(context, "api.live.vkvideo.ru"),
                      "GitHub через DoH" to tryDoH(context, "api.github.com")
                  )
                  tests.forEach { (n, r) -> if (r.ok) ok++; sb.append(fmt(n, r)) }
                  sb.append("━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nИтог: $ok/${tests.size} ")
                  sb.append(if (ok == tests.size) "✅\n🎉 Всё через защищённый DNS!")
                            else if (ok > 0) "⚠️\nЧасть запросов через фолбэк."
                            else "❌\nDoH не работает.")
                  CrashLogger.info("DoH", "Диагностика $ok/${tests.size}")
                  return sb.toString()
              }
          }
