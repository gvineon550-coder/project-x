          cat > app/src/main/java/com/tvplayer/app/VkApi.kt << 'EOF'
          package com.tvplayer.app
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.util.UUID
          import java.util.concurrent.TimeUnit
          data class Channel(val name: String, val url: String, val logo: String, val group: String = "VK Live")
          private val client = OkHttpClient.Builder()
              .connectTimeout(10, TimeUnit.SECONDS).readTimeout(20, TimeUnit.SECONDS).build()
          private val UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                  "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          suspend fun loadChannels(categoryId: String, manual: List<Channel>): List<Channel> =
              withContext(Dispatchers.IO) {
                  val result = mutableListOf<Channel>()
                  try {
                      val url = "https://api.live.vkvideo.ru/v1/catalog/public_video_streams/" +
                              "category/$categoryId/stream/?limit=100"
                      val req = Request.Builder().url(url)
                          .header("User-Agent", UA)
                          .header("Accept", "application/json, text/plain, */*")
                          .header("Origin", "https://live.vkvideo.ru")
                          .header("Referer", "https://live.vkvideo.ru/")
                          .header("X-App", "streams_web")
                          .header("X-From-Id", UUID.randomUUID().toString()).build()
                      client.newCall(req).execute().use { resp ->
                          val body = resp.body?.string().orEmpty()
                          if (resp.isSuccessful && body.isNotBlank()) {
                              val streams = JSONObject(body).optJSONObject("data")?.optJSONArray("streamBlogs")
                              if (streams != null) for (i in 0 until streams.length()) {
                                  val blog = streams.optJSONObject(i)?.optJSONObject("blog") ?: continue
                                  val blogUrl = blog.optString("blogUrl"); if (blogUrl.isBlank()) continue
                                  val raw = blog.optString("title").ifBlank {
                                      blog.optJSONObject("owner")?.optString("displayName").orEmpty()
                                  }.ifBlank { blogUrl }
                                  val name = if (raw.length > 60) raw.take(60) + "…" else raw
                                  val logo = blog.optJSONObject("owner")?.optString("avatarUrl")?.ifBlank { null }
                                      ?: blog.optString("coverUrl")
                                  result.add(Channel(name, "https://live.vkvideo.ru/$blogUrl", logo))
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  result + manual
              }
          EOF

          cat > app/src/main/java/com/tvplayer/app/StreamResolver.kt << 'EOF'
          package com.tvplayer.app
          import com.chaquo.python.Python
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          object StreamResolver {
              suspend fun resolve(url: String): String? = withContext(Dispatchers.IO) {
                  try {
                      val m = Python.getInstance().getModule("resolver")
                      val r = m.callAttr("resolve", url).toString()
                      if (r.startsWith("ERROR:")) null else r
                  } catch (_: Exception) { null }
              }
          }
          EOF

          cat > app/src/main/java/com/tvplayer/app/PlaybackService.kt << 'EOF'
          package com.tvplayer.app
          import android.app.*
          import android.content.Intent
          import android.os.IBinder
          class PlaybackService : Service() {
              override fun onCreate() {
                  super.onCreate()
                  val ch = NotificationChannel("playback", "Playback", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  val n = Notification.Builder(this, "playback")
                      .setContentTitle("TV Player").setContentText("Идёт воспроизведение")
                      .setSmallIcon(android.R.drawable.ic_media_play).build()
                  startForeground(1, n)
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_NOT_STICKY
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat > app/src/main/java/com/tvplayer/app/ChannelAdapter.kt << 'EOF'
          package com.tvplayer.app
          import android.view.*
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import coil.load
          class ChannelAdapter(private val items: List<Channel>, private val onClick: (Channel) -> Unit)
              : RecyclerView.Adapter<ChannelAdapter.VH>() {
              class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val logo: ImageView = v.findViewById(R.id.logo)
                  val name: TextView = v.findViewById(R.id.name)
              }
              override fun onCreateViewHolder(p: ViewGroup, t: Int): VH =
                  VH(LayoutInflater.from(p.context).inflate(R.layout.item_channel, p, false))
              override fun onBindViewHolder(h: VH, pos: Int) {
                  val ch = items[pos]
                  h.name.text = ch.name
                  if (ch.logo.isNotBlank()) h.logo.load(ch.logo) else h.logo.setImageDrawable(null)
                  h.itemView.setOnClickListener { onClick(ch) }
              }
              override fun getItemCount() = items.size
          }
          EOF

          cat > app/src/main/java/com/tvplayer/app/MainActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.content.Intent
          import android.os.Bundle
          import android.view.View
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.GridLayoutManager
          import com.tvplayer.app.databinding.ActivityMainBinding
          import kotlinx.coroutines.launch
          import org.json.JSONObject
          class MainActivity : AppCompatActivity() {
              private lateinit var b: ActivityMainBinding
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivityMainBinding.inflate(layoutInflater); setContentView(b.root)
                  b.recycler.layoutManager = GridLayoutManager(this, 3)
                  b.btnRefresh.setOnClickListener { load() }
                  b.btnExit.setOnClickListener { exitApp() }
                  load()
              }
              private fun exitApp() {
                  finishAndRemoveTask()
                  android.os.Process.killProcess(android.os.Process.myPid())
              }
              private fun load() {
                  b.progress.visibility = View.VISIBLE
                  b.error.visibility = View.GONE
                  b.recycler.visibility = View.GONE
                  lifecycleScope.launch {
                      val (manual, cat) = readConfig()
                      val list = loadChannels(cat, manual)
                      b.progress.visibility = View.GONE
                      if (list.isEmpty()) {
                          b.error.text = getString(R.string.error_load)
                          b.error.visibility = View.VISIBLE; return@launch
                      }
                      b.recycler.visibility = View.VISIBLE
                      b.recycler.adapter = ChannelAdapter(list) { ch ->
                          startActivity(Intent(this@MainActivity, PlayerActivity::class.java)
                              .putExtra("url", ch.url).putExtra("name", ch.name))
                      }
                  }
              }
              private fun readConfig(): Pair<List<Channel>, String> {
                  val json = assets.open("vk_config.json").bufferedReader().use { it.readText() }
                  val o = JSONObject(json); val manual = mutableListOf<Channel>()
                  o.optJSONArray("channels")?.let { arr ->
                      for (i in 0 until arr.length()) {
                          val c = arr.getJSONObject(i)
                          manual.add(Channel(c.optString("name"), c.optString("url"),
                              c.optString("logo"), c.optString("group", "VK Video")))
                      }
                  }
                  val cats = o.optJSONArray("categories")
                  return manual to (if (cats != null && cats.length() > 0) cats.getString(0) else "")
              }
          }
          EOF

          cat > app/src/main/java/com/tvplayer/app/PlayerActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.os.Bundle
          import android.view.View
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.media3.common.MediaItem
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.hls.HlsMediaSource
          import com.tvplayer.app.databinding.ActivityPlayerBinding
          import kotlinx.coroutines.launch
          class PlayerActivity : AppCompatActivity() {
              private lateinit var b: ActivityPlayerBinding
              private var player: ExoPlayer? = null
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivityPlayerBinding.inflate(layoutInflater); setContentView(b.root)
                  val url = intent.getStringExtra("url").orEmpty()
                  b.progress.visibility = View.VISIBLE
                  lifecycleScope.launch {
                      val direct = StreamResolver.resolve(url)
                      if (direct == null) {
                          b.progress.visibility = View.GONE
                          b.error.text = getString(R.string.error_resolve)
                          b.error.visibility = View.VISIBLE; return@launch
                      }
                      play(direct)
                  }
              }
              private fun play(m3u8: String) {
                  val http = DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                              "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
                      .setDefaultRequestProperties(mapOf("Referer" to "https://vk.com/", "Origin" to "https://vk.com"))
                  player = ExoPlayer.Builder(this).build().apply {
                      setMediaSource(HlsMediaSource.Factory(http).createMediaSource(MediaItem.fromUri(m3u8)))
                      playWhenReady = true; prepare()
                  }
                  b.playerView.player = player; b.progress.visibility = View.GONE
              }
              override fun onDestroy() {
                  super.onDestroy(); player?.release(); player = null
                  finishAndRemoveTask()
              }
          }
          EOF

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "bootstrap: initial project files"
