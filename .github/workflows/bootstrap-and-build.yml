          package com.tvplayer.app

          import android.graphics.Color
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import coil.load

          class ChannelAdapter(
              private val rows: List<Row>,
              private val subtitleOf: (Channel) -> String?,
              private val onClick: (Channel) -> Unit,
              private val onLongClick: (Channel) -> Unit
          ) : RecyclerView.Adapter<RecyclerView.ViewHolder>() {

              sealed class Row {
                  class Header(val title: String) : Row()
                  class Item(val ch: Channel, val number: Int) : Row()
              }

              class HeaderVH(v: View) : RecyclerView.ViewHolder(v) {
                  val title: TextView = v.findViewById(R.id.headerTitle)
              }

              class ItemVH(v: View) : RecyclerView.ViewHolder(v) {
                  val number: TextView = v.findViewById(R.id.txtNumber)
                  val logo: ImageView = v.findViewById(R.id.logo)
                  val name: TextView = v.findViewById(R.id.name)
                  val subtitle: TextView = v.findViewById(R.id.subtitle)
                  val fav: ImageView = v.findViewById(R.id.btnFav)
              }

              override fun getItemViewType(position: Int) = if (rows[position] is Row.Header) 0 else 1

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {
                  val inf = LayoutInflater.from(parent.context)
                  return if (viewType == 0)
                      HeaderVH(inf.inflate(R.layout.item_channel_header, parent, false))
                  else ItemVH(inf.inflate(R.layout.item_channel, parent, false))
              }

              override fun onBindViewHolder(holder: RecyclerView.ViewHolder, position: Int) {
                  when (val row = rows[position]) {
                      is Row.Header -> (holder as HeaderVH).title.text = row.title
                      is Row.Item -> {
                          val h = holder as ItemVH
                          val ch = row.ch
                          h.number.text = row.number.toString()
                          h.name.text = ch.name
                          val sub = subtitleOf(ch)
                          if (sub.isNullOrBlank()) h.subtitle.visibility = View.GONE
                          else { h.subtitle.visibility = View.VISIBLE; h.subtitle.text = sub }
                          if (ch.logo.isNotBlank()) {
                              h.logo.load(ch.logo) {
                                  crossfade(true); size(144, 144)
                                  placeholder(android.R.color.darker_gray)
                                  error(android.R.color.darker_gray)
                              }
                          } else { h.logo.setImageDrawable(null) }
                          if (ch.isFavorite) {
                              h.fav.setImageResource(android.R.drawable.btn_star_big_on)
                              h.fav.setColorFilter(Color.YELLOW)
                          } else {
                              h.fav.setImageResource(android.R.drawable.btn_star_big_off)
                              h.fav.setColorFilter(Color.GRAY)
                          }
                          h.itemView.nextFocusUpId = R.id.btnFavFilter
                          h.itemView.setOnClickListener { onClick(ch) }
                          h.itemView.setOnLongClickListener { onLongClick(ch); true }
                      }
                  }
              }

              override fun getItemCount() = rows.size
          }
