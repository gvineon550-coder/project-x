          cat > $D/M3uRepository.kt << 'EOF'
          package com.tvplayer.app

          import android.content.Context
          import android.net.Uri
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.Request
          import java.io.File
          import java.io.InputStream

          object M3uRepository {
              private const val MAX_BYTES = 8L * 1024 * 1024
              const val MANUAL_ID = "manual"

              fun cacheFile(c: Context, id: String) = File(c.filesDir, "m3u_$id.json")

              fun loadCached(context: Context, p: Playlist): List<Channel> =
                  try { ChannelJson.load(cacheFile(context, p.id)) ?: emptyList() }
                  catch (e: Exception) { CrashLogger.error("M3U", "Кэш ${p.name}", e); emptyList() }

              fun loadAllCached(context: Context): List<Channel> =
                  PlaylistStore.all(context).flatMap { loadCached(context, it) }

              suspend fun refresh(context: Context, p: Playlist): List<Channel> = withContext(Dispatchers.IO) {
                  if (p.type == "manual") return@withContext loadCached(context, p)
                  try {
                      val bytes = when (p.type) {
                          "file" -> context.contentResolver.openInputStream(Uri.parse(p.location))
                              ?.use { readLimited(it) } ?: ByteArray(0)
                          else -> {
                              val req = Request.Builder().url(p.location)
                                  .header("User-Agent", HttpClientProvider.UA).build()
                              HttpClientProvider.get(context).newCall(req).execute().use { resp ->
                                  if (!resp.isSuccessful) throw IllegalStateException("HTTP ${resp.code}")
                                  resp.body?.byteStream()?.use { readLimited(it) } ?: ByteArray(0)
                              }
                          }
                      }
                      if (bytes.isEmpty()) return@withContext loadCached(context, p)
                      var text = String(bytes, Charsets.UTF_8)
                      if (!text.contains("#EXTM3U", true) && !text.contains("#EXTINF", true)) {
                          text = String(bytes, charset("windows-1251"))
                      }
                      val parsed = M3uParser.parse(text, p.id, p.name)
                      if (parsed.channels.isEmpty()) return@withContext loadCached(context, p)
                      ChannelJson.save(cacheFile(context, p.id), parsed.channels)
                      val epg = p.epgUrl.ifBlank { parsed.epgUrl }
                      PlaylistStore.update(context, p.id) {
                          it.copy(updatedAt = System.currentTimeMillis(),
                              channelCount = parsed.channels.size, epgUrl = epg)
                      }
                      CrashLogger.info("M3U", "${p.name}: обновлён, ${parsed.channels.size} каналов")
                      parsed.channels
                  } catch (e: Exception) {
                      CrashLogger.error("M3U", "Обновление ${p.name}", e)
                      loadCached(context, p)
                  }
              }

              private fun readLimited(input: InputStream): ByteArray {
                  val buf = java.io.ByteArrayOutputStream()
                  val chunk = ByteArray(16 * 1024)
                  var total = 0L
                  while (true) {
                      val n = input.read(chunk)
                      if (n <= 0) break
                      total += n
                      if (total > MAX_BYTES) {
                          CrashLogger.error("M3U", "Плейлист > 8 МБ — обрезан")
                          buf.write(chunk, 0, n); break
                      }
                      buf.write(chunk, 0, n)
                  }
                  return buf.toByteArray()
              }

              fun addManualChannel(context: Context, name: String, url: String) {
                  val existing = PlaylistStore.find(context, MANUAL_ID)
                  if (existing == null) {
                      PlaylistStore.add(context, Playlist(MANUAL_ID, "Мои каналы", "manual", ""))
                  }
                  val pl = PlaylistStore.find(context, MANUAL_ID) ?: return
                  val list = loadCached(context, pl).toMutableList()
                  list.add(Channel(name = name, url = url, group = "Мои каналы",
                      source = Channel.SOURCE_M3U, playlistId = MANUAL_ID, direct = !UrlUtils.isVk(url)))
                  ChannelJson.save(cacheFile(context, MANUAL_ID), list)
                  PlaylistStore.update(context, MANUAL_ID) {
                      it.copy(updatedAt = System.currentTimeMillis(), channelCount = list.size)
                  }
              }

              fun removeChannel(context: Context, channel: Channel) {
                  if (channel.playlistId.isBlank()) return
                  val pl = PlaylistStore.find(context, channel.playlistId) ?: return
                  val list = loadCached(context, pl).filterNot { it.url == channel.url }
                  ChannelJson.save(cacheFile(context, pl.id), list)
                  PlaylistStore.update(context, pl.id) { it.copy(channelCount = list.size) }
              }
          }
          EOF

          cat > $D/EpgStore.kt << 'EOF'
          package com.tvplayer.app

          import android.content.Context
          import android.util.Xml
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import java.io.BufferedInputStream
          import java.io.File
          import java.io.InputStreamReader
          import java.text.SimpleDateFormat
          import java.util.Locale
          import java.util.zip.GZIPInputStream

          object EpgStore {
              private const val TTL = 12 * 60 * 60 * 1000L
              private const val MAX_PROG = 6
              private const val MAX_CHANNELS = 4000
              private const val MAX_PROGRAMMES = 150_000

              data class Prog(val start: Long, val stop: Long, val title: String)

              private val mem = HashMap<String, HashMap<String, List<Prog>>>()
              private val names = HashMap<String, HashMap<String, String>>()

              fun file(c: Context, id: String) = File(c.filesDir, "epg_$id.json")

              fun clearMemory() { synchronized(mem) { mem.clear(); names.clear() } }

              fun clear(context: Context, id: String) {
                  synchronized(mem) { mem.remove(id); names.remove(id) }
                  try { file(context, id).delete() } catch (_: Exception) {}
              }

              fun isFresh(context: Context, id: String): Boolean {
                  val f = file(context, id)
                  if (!f.exists()) return false
                  return try {
                      System.currentTimeMillis() - JSONObject(f.readText()).optLong("ts") < TTL
                  } catch (_: Exception) { false }
              }

              suspend fun ensureLoaded(context: Context, id: String) = withContext(Dispatchers.IO) {
                  synchronized(mem) { if (mem.containsKey(id)) return@withContext }
                  val f = file(context, id)
                  if (!f.exists()) return@withContext
                  try {
                      val root = JSONObject(f.readText())
                      val ch = root.optJSONObject("ch") ?: JSONObject()
                      val map = HashMap<String, List<Prog>>()
                      for (key in ch.keys()) {
                          val arr = ch.optJSONArray(key) ?: continue
                          val list = ArrayList<Prog>(arr.length())
                          for (i in 0 until arr.length()) {
                              val p = arr.optJSONArray(i) ?: continue
                              list.add(Prog(p.optLong(0), p.optLong(1), p.optString(2)))
                          }
                          map[key] = list
                      }
                      val nm = HashMap<String, String>()
                      val n = root.optJSONObject("names") ?: JSONObject()
                      for (key in n.keys()) nm[key] = n.optString(key)
                      synchronized(mem) { mem[id] = map; names[id] = nm }
                      CrashLogger.info("EPG", "$id: загружено ${map.size} каналов в память")
                  } catch (e: Exception) { CrashLogger.error("EPG", "Чтение $id", e) }
              }

              fun nowNext(playlistId: String, tvgId: String, name: String): Pair<Prog?, Prog?> {
                  val map: HashMap<String, List<Prog>>
                  val nm: HashMap<String, String>
                  synchronized(mem) {
                      map = mem[playlistId] ?: return null to null
                      nm = names[playlistId] ?: HashMap()
                  }
                  val key = when {
                      tvgId.isNotBlank() && map.containsKey(tvgId) -> tvgId
                      else -> nm[normalize(name)] ?: return null to null
                  }
                  val list = map[key] ?: return null to null
                  val now = System.currentTimeMillis()
                  var cur: Prog? = null
                  var next: Prog? = null
                  for (p in list) {
                      if (now in p.start until p.stop) cur = p
                      else if (p.start > now && next == null) next = p
                  }
                  return cur to next
              }

              fun normalize(s: String): String =
                  s.lowercase().replace(Regex("[^a-zа-яё0-9]"), "")
                      .removeSuffix("hd").removeSuffix("fhd").removeSuffix("sd")

              suspend fun refresh(context: Context, playlist: Playlist): Boolean = withContext(Dispatchers.IO) {
                  if (playlist.epgUrl.isBlank()) return@withContext false
                  try {
                      val req = Request.Builder().url(playlist.epgUrl)
                          .header("User-Agent", HttpClientProvider.UA)
                          .header("Accept", "application/xml, text/xml, */*").build()
                      HttpClientProvider.download(context).newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) {
                              CrashLogger.error("EPG", "HTTP ${resp.code} для ${playlist.name}")
                              return@withContext false
                          }
                          val raw = resp.body?.byteStream() ?: return@withContext false
                          val buf = BufferedInputStream(raw, 8192)
                          buf.mark(2)
                          val b1 = buf.read(); val b2 = buf.read(); buf.reset()
                          val stream = if (b1 == 0x1f && b2 == 0x8b) GZIPInputStream(buf) else buf
                          parse(context, playlist.id, stream)
                      }
                  } catch (e: Exception) {
                      CrashLogger.error("EPG", "Обновление ${playlist.name}", e)
                      false
                  }
              }

              private fun parse(context: Context, id: String, input: java.io.InputStream): Boolean {
                  val now = System.currentTimeMillis()
                  val windowStart = now - 3 * 60 * 60 * 1000L
                  val windowEnd = now + 30 * 60 * 60 * 1000L
                  val data = HashMap<String, MutableList<Prog>>()
                  val nameIdx = HashMap<String, String>()
                  val withTz = SimpleDateFormat("yyyyMMddHHmmss Z", Locale.US)
                  val noTz = SimpleDateFormat("yyyyMMddHHmmss", Locale.US)

                  fun time(s: String?): Long {
                      if (s.isNullOrBlank()) return 0L
                      val v = s.trim()
                      return try { withTz.parse(v)?.time ?: 0L }
                      catch (_: Exception) { try { noTz.parse(v)?.time ?: 0L } catch (_: Exception) { 0L } }
                  }

                  var count = 0
                  try {
                      InputStreamReader(input, Charsets.UTF_8).use { reader ->
                          val p = Xml.newPullParser()
                          p.setFeature(XmlPullParser.FEATURE_PROCESS_NAMESPACES, false)
                          p.setInput(reader)
                          var ev = p.eventType
                          while (ev != XmlPullParser.END_DOCUMENT && count < MAX_PROGRAMMES) {
                              if (ev == XmlPullParser.START_TAG) {
                                  when (p.name) {
                                      "channel" -> {
                                          val cid = p.getAttributeValue(null, "id").orEmpty()
                                          var display = ""
                                          var e2 = p.next()
                                          while (!(e2 == XmlPullParser.END_TAG && p.name == "channel")) {
                                              if (e2 == XmlPullParser.START_TAG && p.name == "display-name" && display.isBlank())
                                                  display = p.nextText().orEmpty()
                                              if (e2 == XmlPullParser.END_DOCUMENT) break
                                              e2 = p.next()
                                          }
                                          if (cid.isNotBlank() && display.isNotBlank())
                                              nameIdx[normalize(display)] = cid
                                      }
                                      "programme" -> {
                                          val cid = p.getAttributeValue(null, "channel").orEmpty()
                                          val st = time(p.getAttributeValue(null, "start"))
                                          val sp = time(p.getAttributeValue(null, "stop"))
                                          var title = ""
                                          var e2 = p.next()
                                          while (!(e2 == XmlPullParser.END_TAG && p.name == "programme")) {
                                              if (e2 == XmlPullParser.START_TAG && p.name == "title" && title.isBlank())
                                                  title = p.nextText().orEmpty()
                                              if (e2 == XmlPullParser.END_DOCUMENT) break
                                              e2 = p.next()
                                          }
                                          count++
                                          if (cid.isNotBlank() && title.isNotBlank() &&
                                              sp > windowStart && st < windowEnd &&
                                              (data.containsKey(cid) || data.size < MAX_CHANNELS)) {
                                              val list = data.getOrPut(cid) { mutableListOf() }
                                              if (list.size < MAX_PROG) list.add(Prog(st, sp, title))
                                          }
                                      }
                                  }
                              }
                              ev = p.next()
                          }
                      }
                  } catch (e: Exception) {
                      CrashLogger.error("EPG", "Парсинг $id (${data.size} каналов успели)", e)
                      if (data.isEmpty()) return false
                  }
                  if (data.isEmpty()) return false

                  val ch = JSONObject()
                  data.forEach { (k, list) ->
                      val arr = JSONArray()
                      list.sortedBy { it.start }.forEach {
                          arr.put(JSONArray().put(it.start).put(it.stop).put(it.title))
                      }
                      ch.put(k, arr)
                  }
                  val nm = JSONObject()
                  nameIdx.forEach { (k, v) -> nm.put(k, v) }
                  file(context, id).writeText(JSONObject().apply {
                      put("ts", System.currentTimeMillis()); put("ch", ch); put("names", nm)
                  }.toString())
                  synchronized(mem) { mem.remove(id); names.remove(id) }
                  CrashLogger.info("EPG", "$id: ${data.size} каналов, $count передач обработано")
                  return true
              }
          }
          EOF
