          cat > $D/UrlUtils.kt << 'EOF'
          package com.tvplayer.app

          object UrlUtils {
              fun host(url: String): String =
                  try { java.net.URI(url).host?.lowercase().orEmpty() } catch (_: Exception) { "" }

              fun isHttp(url: String): Boolean =
                  url.startsWith("http://", true) || url.startsWith("https://", true)

              fun isVk(url: String): Boolean {
                  val h = host(url)
                  return h == "vk.com" || h.endsWith(".vk.com") ||
                          h == "vk.ru" || h.endsWith(".vk.ru") ||
                          h == "vkvideo.ru" || h.endsWith(".vkvideo.ru")
              }

              fun isHls(url: String): Boolean {
                  val l = url.lowercase()
                  return l.substringBefore('?').endsWith(".m3u8") ||
                          l.contains(".m3u8?") || l.contains("type=m3u8")
              }

              fun isDirect(url: String): Boolean = isHttp(url) && !isVk(url)
          }
