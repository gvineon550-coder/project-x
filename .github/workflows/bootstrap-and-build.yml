          package com.tvplayer.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          data class Playlist(
              val id: String,
              val name: String,
              val type: String,
              val location: String,
              val epgUrl: String = "",
              val updatedAt: Long = 0L,
              val channelCount: Int = 0
          )

          object PlaylistStore {
              private const val PREFS = "playlists"
              private const val KEY = "items"
              const val MAX_PLAYLISTS = 12

              private fun prefs(c: Context) = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun all(context: Context): List<Playlist> = try {
                  val arr = JSONArray(prefs(context).getString(KEY, "[]") ?: "[]")
                  (0 until arr.length()).mapNotNull { i ->
                      val o = arr.optJSONObject(i) ?: return@mapNotNull null
                      Playlist(
                          o.optString("id"), o.optString("name"), o.optString("type"),
                          o.optString("location"), o.optString("epgUrl"),
                          o.optLong("updatedAt"), o.optInt("channelCount")
                      )
                  }
              } catch (e: Exception) { CrashLogger.error("Playlists", "Чтение", e); emptyList() }

              private fun save(context: Context, list: List<Playlist>) {
                  val arr = JSONArray()
                  list.forEach {
                      arr.put(JSONObject().apply {
                          put("id", it.id); put("name", it.name); put("type", it.type)
                          put("location", it.location); put("epgUrl", it.epgUrl)
                          put("updatedAt", it.updatedAt); put("channelCount", it.channelCount)
                      })
                  }
                  prefs(context).edit().putString(KEY, arr.toString()).apply()
              }

              fun add(context: Context, p: Playlist): Boolean {
                  val list = all(context)
                  if (list.size >= MAX_PLAYLISTS) return false
                  save(context, list + p)
                  CrashLogger.info("Playlists", "Добавлен ${p.name} (${p.type})")
                  return true
              }

              fun update(context: Context, id: String, transform: (Playlist) -> Playlist) {
                  save(context, all(context).map { if (it.id == id) transform(it) else it })
              }

              fun find(context: Context, id: String): Playlist? = all(context).firstOrNull { it.id == id }

              fun remove(context: Context, id: String) {
                  save(context, all(context).filterNot { it.id == id })
                  try { File(context.filesDir, "m3u_$id.json").delete() } catch (_: Exception) {}
                  EpgStore.clear(context, id)
                  CrashLogger.info("Playlists", "Удалён $id")
              }

              fun clearAll(context: Context) {
                  all(context).forEach {
                      try { File(context.filesDir, "m3u_${it.id}.json").delete() } catch (_: Exception) {}
                      EpgStore.clear(context, it.id)
                  }
                  prefs(context).edit().clear().apply()
              }
          }
