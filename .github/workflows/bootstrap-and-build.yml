          cat > $D/StreamCache.kt << 'EOF'
          package com.tvplayer.app

          import android.content.Context

          object StreamCache {
              private const val PREFS = "stream_cache"
              private const val TTL = 2 * 60 * 60 * 1000L
              private const val MAX = 200

              private fun prefs(c: Context) = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun get(context: Context, key: String): String? {
                  val e = prefs(context).getString(key, null) ?: return null
                  val p = e.split("|")
                  if (p.size != 2) return null
                  val ts = p[1].toLongOrNull() ?: return null
                  if (System.currentTimeMillis() - ts > TTL) {
                      prefs(context).edit().remove(key).apply(); return null
                  }
                  return p[0]
              }

              fun put(context: Context, key: String, url: String) {
                  val p = prefs(context)
                  val all = p.all
                  if (all.size >= MAX) {
                      val victims = all.entries.filter { it.value is String }
                          .map { it.key to ((it.value as String).split("|").getOrNull(1)?.toLongOrNull() ?: 0L) }
                          .sortedBy { it.second }
                          .take(maxOf(1, MAX / 5))
                      val ed = p.edit()
                      victims.forEach { ed.remove(it.first) }
                      ed.apply()
                      CrashLogger.info("StreamCache", "Эвикция ${victims.size} старых")
                  }
                  p.edit().putString(key, "$url|${System.currentTimeMillis()}").apply()
              }

              fun invalidate(context: Context, key: String) { prefs(context).edit().remove(key).apply() }

              fun clearAll(context: Context) { prefs(context).edit().clear().apply() }

              fun cleanup(context: Context) {
                  val p = prefs(context)
                  val ed = p.edit()
                  var n = 0
                  val now = System.currentTimeMillis()
                  for ((k, v) in p.all) {
                      val s = v as? String
                      val ts = s?.split("|")?.getOrNull(1)?.toLongOrNull()
                      if (s == null || ts == null || now - ts > TTL) { ed.remove(k); n++ }
                  }
                  ed.apply()
                  if (n > 0) CrashLogger.info("StreamCache", "Очищено $n просроченных")
              }
          }
