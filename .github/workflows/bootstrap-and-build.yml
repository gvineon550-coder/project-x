          package com.tvplayer.app

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.File

          object UpdateChecker {
              data class UpdateInfo(val downloadUrl: String, val versionCode: Int, val changelog: String)

              suspend fun checkForUpdate(context: Context): UpdateInfo? = withContext(Dispatchers.IO) {
                  try {
                      val repo = BuildConfig.GITHUB_REPO
                      if (repo.isBlank() || repo.startsWith("user/")) return@withContext null
                      val req = Request.Builder()
                          .url("https://api.github.com/repos/$repo/releases/latest")
                          .header("Accept", "application/vnd.github+json")
                          .header("User-Agent", "TVPlayer").build()
                      HttpClientProvider.get(context).newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) return@withContext null
                          val body = resp.body?.string() ?: return@withContext null
                          val json = JSONObject(body)
                          val nv = json.optString("tag_name").removePrefix("v").toIntOrNull() ?: 0
                          if (nv <= BuildConfig.VERSION_CODE) return@withContext null
                          val assets = json.optJSONArray("assets") ?: return@withContext null
                          if (assets.length() == 0) return@withContext null
                          val url = assets.getJSONObject(0).optString("browser_download_url")
                          if (url.isBlank()) return@withContext null
                          CrashLogger.info("OTA", "🎉 Доступно v$nv")
                          UpdateInfo(url, nv, json.optString("body", "Новая версия"))
                      }
                  } catch (e: Exception) {
                      CrashLogger.error("OTA", "Ошибка проверки", e); null
                  }
              }

              suspend fun downloadApk(context: Context, url: String): File? = withContext(Dispatchers.IO) {
                  try {
                      val started = System.currentTimeMillis()
                      HttpClientProvider.download(context).newCall(Request.Builder().url(url).build())
                          .execute().use { resp ->
                              if (!resp.isSuccessful) return@withContext null
                              val file = File(context.cacheDir, "update.apk")
                              resp.body?.byteStream()?.use { input ->
                                  file.outputStream().use { out -> input.copyTo(out) }
                              }
                              val el = System.currentTimeMillis() - started
                              val kb = if (el > 0) (file.length() / 1024) * 1000 / el else 0
                              CrashLogger.info("OTA", "✓ APK ${file.length() / 1024 / 1024} МБ за ${el / 1000}с ($kb КБ/с)")
                              file
                          }
                  } catch (e: Exception) {
                      CrashLogger.error("OTA", "Ошибка скачивания", e); null
                  }
              }
          }
