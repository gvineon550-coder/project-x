          cat > app/src/main/java/com/tvplayer/app/MainActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.content.Intent
          import android.os.Bundle
          import android.view.View
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.disk.DiskCache
          import com.tvplayer.app.databinding.ActivityMainBinding
          import kotlinx.coroutines.launch
          import okhttp3.OkHttpClient
          import org.json.JSONObject

          class MainActivity : AppCompatActivity(), ImageLoaderFactory {
              private lateinit var b: ActivityMainBinding
              private var allChannels: List<Channel> = emptyList()
              private var showOnlyFavorites = false
              private val prefs by lazy { getSharedPreferences("tvplayer", MODE_PRIVATE) }
              private var backPressedTime: Long = 0
              private var lastRefreshTime: Long = 0

              override fun newImageLoader() = ImageLoader.Builder(this)
                  .okHttpClient(OkHttpClient.Builder().dns(DohProvider.createWithFallback(this)).build())
                  .diskCache { DiskCache.Builder().directory(cacheDir.resolve("image_cache")).maxSizeBytes(10L * 1024L * 1024L).build() }
                  .build()

              override fun onCreate(s: Bundle?) {
                  installSplashScreen()
                  super.onCreate(s)
                  b = ActivityMainBinding.inflate(layoutInflater); setContentView(b.root)
                  b.recycler.layoutManager = LinearLayoutManager(this)

                  b.btnRefresh.setOnClickListener {
                      val now = System.currentTimeMillis()
                      if (now - lastRefreshTime > 15000) {
                          lastRefreshTime = now
                          loadFromNetwork(true)
                      } else {
                          Toast.makeText(this, "Подождите перед повторным обновлением", Toast.LENGTH_SHORT).show()
                      }
                  }
                  b.btnFavFilter.setOnClickListener { showOnlyFavorites = !showOnlyFavorites; updateView(false) }
                  b.btnSettings.setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
                  b.btnCheckUpdates.setOnClickListener { manualCheckForUpdates() }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (System.currentTimeMillis() - backPressedTime < 3000) { finishAffinity(); android.os.Process.killProcess(android.os.Process.myPid()) }
                          else { Toast.makeText(this@MainActivity, "Ещё раз для выхода", Toast.LENGTH_SHORT).show(); backPressedTime = System.currentTimeMillis() }
                      }
                  })
                  loadInitial()
              }

              private fun loadInitial() {
                  val cached = ChannelCache.load(this)
                  if (!cached.isNullOrEmpty()) { allChannels = cached; updateView(true); if (!ChannelCache.isFresh(this)) loadFromNetwork(false) }
                  else { b.progress.visibility = View.VISIBLE; loadFromNetwork(false) }
              }

              private fun loadFromNetwork(force: Boolean) {
                  if (!NetworkUtils.isOnline(this)) { if (allChannels.isEmpty()) { b.progress.visibility = View.GONE; b.error.text = "Нет интернета"; b.error.visibility = View.VISIBLE }; return }
                  lifecycleScope.launch {
                      try {
                          val (manual, cat) = readConfig()
                          val fresh = loadChannels(this@MainActivity, cat, manual)
                          b.progress.visibility = View.GONE
                          if (fresh.isNotEmpty()) { allChannels = fresh; ChannelCache.save(this@MainActivity, fresh); updateView(force) }
                      } catch (_: Exception) { b.progress.visibility = View.GONE }
                  }
              }

              private fun manualCheckForUpdates() {
                  lifecycleScope.launch {
                      val info = UpdateChecker.checkForUpdate(this@MainActivity)
                      if (info == null) Toast.makeText(this@MainActivity, "✅ Актуальная версия", Toast.LENGTH_SHORT).show()
                      else UpdateDialog.show(this@MainActivity, info.versionCode, info.changelog) { startDownload(info.downloadUrl) }
                  }
              }

              private fun startDownload(url: String) {
                  lifecycleScope.launch {
                      val file = UpdateChecker.downloadApk(this@MainActivity, url) ?: return@launch
                      val uri = FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", file)
                      startActivity(Intent(Intent.ACTION_VIEW).setDataAndType(uri, "application/vnd.android.package-archive").addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK))
                  }
              }

              private fun updateView(scrollToLast: Boolean) {
                  if (allChannels.isEmpty()) return
                  b.progress.visibility = View.GONE; b.error.visibility = View.GONE
                  val favs = prefs.getStringSet("favorites", emptySet()) ?: emptySet()
                  allChannels.forEach { it.isFavorite = favs.contains(it.url) }
                  val displayed = (if (showOnlyFavorites) allChannels.filter { it.isFavorite } else allChannels).sortedByDescending { it.isFavorite }
                  b.txtTitle.text = if (showOnlyFavorites) "Избранное (${displayed.size})" else "Все каналы (${displayed.size})"
                  b.recycler.adapter = ChannelAdapter(displayed, { ch ->
                      val intent = Intent(this, PlayerActivity::class.java).putExtra("index", allChannels.indexOfFirst { it.url == ch.url })
                          .putStringArrayListExtra("names", ArrayList(allChannels.map { it.name })).putStringArrayListExtra("urls", ArrayList(allChannels.map { it.url }))
                      startActivity(intent)
                  }, { ch ->
                      val cur = prefs.getStringSet("favorites", emptySet())?.toMutableSet() ?: mutableSetOf()
                      if (cur.contains(ch.url)) cur.remove(ch.url) else cur.add(ch.url)
                      prefs.edit().putStringSet("favorites", cur).apply(); updateView(false)
                  })
              }

              private fun readConfig(): Pair<List<Channel>, String> {
                  val json = assets.open("vk_config.json").bufferedReader().use { it.readText() }
                  val o = JSONObject(json); val manual = mutableListOf<Channel>()
                  o.optJSONArray("channels")?.let { arr -> for (i in 0 until arr.length()) { val c = arr.getJSONObject(i); manual.add(Channel(c.optString("name"), c.optString("url"), c.optString("logo"), c.optString("group", "VK Video"))) } }
                  val cats = o.optJSONArray("categories")
                  return manual to (if (cats != null && cats.length() > 0) cats.getString(0) else "")
              }
          }
          EOF

      - name: "⚙ SettingsActivity"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/SettingsActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.graphics.Color
          import android.os.Bundle
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import coil.Coil
          import com.tvplayer.app.databinding.ActivitySettingsBinding
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class SettingsActivity : AppCompatActivity() {
              private lateinit var b: ActivitySettingsBinding

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivitySettingsBinding.inflate(layoutInflater); setContentView(b.root)
                  b.txtVersion.text = "TV Player v${BuildConfig.VERSION_CODE}"
                  updateDohToggleUI()
                  updateCacheStats()

                  b.btnBack.setOnClickListener { finish() }
                  b.btnToggleDoh.setOnClickListener {
                      val newState = !DohSettings.isEnabled(this)
                      DohSettings.setEnabled(this, newState)
                      updateDohToggleUI()
                      try { Coil.reset() } catch (_: Exception) {}
                  }
                  b.btnCheckDoh.setOnClickListener {
                      lifecycleScope.launch {
                          val report = withContext(Dispatchers.IO) { DohProvider.runFullDiagnostics(this@SettingsActivity) }
                          b.txtDohResult.text = report
                      }
                  }
                  b.btnClearCache.setOnClickListener {
                      StreamCache.clearAll(this)
                      Toast.makeText(this, "Кэш ссылок очищен", Toast.LENGTH_SHORT).show()
                      updateCacheStats()
                  }
                  b.btnFullReset.setOnClickListener {
                      StreamCache.clearAll(this)
                      ChannelCache.clear(this)
                      CrashLogger.clear(this)
                      getSharedPreferences("tvplayer", MODE_PRIVATE).edit().clear().apply()
                      Toast.makeText(this, "Полный сброс выполнен", Toast.LENGTH_SHORT).show()
                      updateCacheStats()
                  }
                  b.btnOpenLog.setOnClickListener {
                      b.txtAbout.text = CrashLogger.readAll(this)
                  }
                  b.btnShareLog.setOnClickListener {
                      CrashLogger.share(this)
                  }
                  b.btnExitApp.setOnClickListener {
                      finishAffinity()
                      android.os.Process.killProcess(android.os.Process.myPid())
                  }
              }

              private fun updateDohToggleUI() {
                  val enabled = DohSettings.isEnabled(this)
                  b.btnToggleDoh.text = if (enabled) "🟢 DoH: ВКЛ" else "🔴 DoH: ВЫКЛ"
                  b.btnToggleDoh.setTextColor(if (enabled) Color.parseColor("#FF4ADE80") else Color.parseColor("#FFFF6B6B"))
              }

              private fun updateCacheStats() {
                  val streamCacheSize = getSharedPreferences("stream_cache", MODE_PRIVATE).all.size
                  b.txtCacheStats.text = "Записей в StreamCache: $streamCacheSize / 50"
              }
          }
          EOF

      - name: "🎬 PlayerActivity (с Prefetch, Watchdog, Quality Picker и Режимом сна)"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/PlayerActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          import android.view.View
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.hls.HlsMediaSource
          import androidx.media3.datasource.okhttp.OkHttpDataSource
          import com.tvplayer.app.databinding.ActivityPlayerBinding
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import okhttp3.OkHttpClient

          class PlayerActivity : AppCompatActivity() {
              private lateinit var b: ActivityPlayerBinding
              private var player: ExoPlayer? = null
              private var names: List<String> = emptyList()
              private var urls: List<String> = emptyList()
              private var currentIndex: Int = 0
              private val handler = Handler(Looper.getMainLooper())

              private var sleepTimerActive = false
              private val sleepRunnable = Runnable { finish() }
              private val SLEEP_TIMEOUT_MS = 4 * 60 * 60 * 1000L

              private val inactivityRunnable = Runnable {
                  CrashLogger.info("Player", "Автовыключение по режиму сна (4 часа бездействия)")
                  finish()
              }

              private val hideControls = Runnable {
                  b.controlsOverlay.visibility = View.GONE
                  b.rightControls.visibility = View.GONE
                  b.btnSleepTimer.visibility = View.GONE
                  b.btnDnsStatus.visibility = View.GONE
                  b.txtReconnectStatus.visibility = View.GONE
                  b.leftControls.visibility = View.GONE
              }

              private val watchdogRunnable = object : Runnable {
                  override fun run() {
                      val p = player
                      if (p != null && p.playbackState == Player.STATE_BUFFERING && p.playWhenReady) {
                          CrashLogger.info("Watchdog", "Обнаружено зависание на буферизации, перезапуск потока...")
                          b.txtReconnectStatus.visibility = View.VISIBLE
                          handler.postDelayed({ b.txtReconnectStatus.visibility = View.GONE }, 3000)
                          startPlayback()
                      }
                      handler.postDelayed(this, 10000)
                  }
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivityPlayerBinding.inflate(layoutInflater); setContentView(b.root)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).let {
                      it.hide(WindowInsetsCompat.Type.systemBars())
                      it.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  names = intent.getStringArrayListExtra("names") ?: emptyList()
                  urls = intent.getStringArrayListExtra("urls") ?: emptyList()
                  currentIndex = intent.getIntExtra("index", 0)

                  startPlayback()
                  b.btnBack.setOnClickListener { finish() }
                  b.btnSleepTimer.setOnClickListener { toggleSleepTimer() }
                  b.btnQuality.setOnClickListener { cycleQuality() }

                  resetInactivityTimer()
                  handler.postDelayed(watchdogRunnable, 10000)
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  resetInactivityTimer()
                  if (b.controlsOverlay.visibility == View.VISIBLE && event.action == KeyEvent.ACTION_DOWN && event.keyCode == KeyEvent.KEYCODE_BACK) {
                      hideControls.run(); return true
                  }
                  if (event.action == KeyEvent.ACTION_DOWN) {
                      when (event.keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_CHANNEL_UP -> { switchChannel(-1); return true }
                          KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_CHANNEL_DOWN -> { switchChannel(1); return true }
                          KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> { showControls(); return true }
                          KeyEvent.KEYCODE_BACK -> { finish(); return true }
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun resetInactivityTimer() {
                  handler.removeCallbacks(inactivityRunnable)
                  handler.postDelayed(inactivityRunnable, SLEEP_TIMEOUT_MS)
              }

              private fun toggleSleepTimer() {
                  sleepTimerActive = !sleepTimerActive
                  if (sleepTimerActive) {
                      handler.postDelayed(sleepRunnable, SLEEP_TIMEOUT_MS)
                      b.btnSleepTimer.text = "Сон: 4ч"
                  } else {
                      handler.removeCallbacks(sleepRunnable)
                      b.btnSleepTimer.text = "Сон: Выкл"
                  }
              }

              private fun cycleQuality() {
                  val p = player ?: return
                  val currentParams = p.trackSelectionParameters
                  val currentMaxH = currentParams.maxVideoHeight
                  
                  val newMaxH = when (currentMaxH) {
                      Int.MAX_VALUE -> 720
                      720 -> 480
                      else -> Int.MAX_VALUE
                  }
                  
                  p.trackSelectionParameters = currentParams.buildUpon()
                      .setMaxVideoHeight(newMaxH)
                      .build()
                  
                  b.btnQuality.text = if (newMaxH == Int.MAX_VALUE) "Качество: Auto" else "Лимит: ${newMaxH}p"
                  showControls()
              }

              private fun switchChannel(dir: Int) {
                  val ni = currentIndex + dir
                  if (ni in urls.indices) { currentIndex = ni; startPlayback() }
              }

              private fun startPlayback() {
                  b.errorLayout.visibility = View.GONE
                  val url = urls.getOrNull(currentIndex) ?: return
                  val cached = StreamCache.get(this, url)
                  if (cached != null) {
                      play(cached)
                      prefetchNext()
                      return
                  }
                  lifecycleScope.launch {
                      val direct = StreamResolver.resolve(url)
                      if (direct.startsWith("ERROR")) {
                          b.errorText.text = direct
                          b.errorLayout.visibility = View.VISIBLE
                          return@launch
                      }
                      StreamCache.put(this@PlayerActivity, url, direct)
                      play(direct)
                      prefetchNext()
                  }
              }

              private fun prefetchNext() {
                  val nextIndex = currentIndex + 1
                  if (nextIndex in urls.indices) {
                      val nextUrl = urls[nextIndex]
                      if (StreamCache.get(this, nextUrl) == null) {
                          lifecycleScope.launch(Dispatchers.IO) {
                              val resolved = StreamResolver.resolve(nextUrl)
                              if (!resolved.startsWith("ERROR")) {
                                  StreamCache.put(this@PlayerActivity, nextUrl, resolved)
                              }
                          }
                      }
                  }
              }

              private fun play(m3u8: String) {
                  player?.release()
                  val okHttp = OkHttpClient.Builder().dns(DohProvider.createWithFallback(this)).build()
                  player = ExoPlayer.Builder(this).build().apply {
                      setMediaSource(HlsMediaSource.Factory(OkHttpDataSource.Factory(okHttp)).createMediaSource(MediaItem.fromUri(m3u8)))
                      playWhenReady = true; prepare()
                  }
                  b.playerView.player = player
                  showControls()
              }

              private fun showControls() {
                  b.controlsOverlay.visibility = View.VISIBLE
                  b.rightControls.visibility = View.VISIBLE
                  b.btnSleepTimer.visibility = View.VISIBLE
                  b.btnDnsStatus.visibility = View.VISIBLE
                  b.btnDnsStatus.text = "DNS: ${DohProvider.activeStatusLabel}"
                  b.leftControls.visibility = View.VISIBLE
                  handler.removeCallbacks(hideControls)
                  handler.postDelayed(hideControls, 5000)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null); player?.release(); player = null
              }
          }
          EOF

      - name: "📌 Git Commit & Push"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          RUN_NUMBER="${{ github.run_number }}"
          sed -i "s/versionCode = [0-9]*/versionCode = $RUN_NUMBER/" app/build.gradle
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "chore: auto-bump versionCode to $RUN_NUMBER & fix quality picker api" || echo "no changes to commit"
          git pull --rebase origin main || echo "rebase skipped"
          git push origin main || echo "push failed"

      - name: "🔨 Build APK"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: "📦 Prepare APK"
        if: steps.checkytdlp.outputs.skip != 'true'
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          RUN_NUMBER="${{ github.run_number }}"
          TAG="v${RUN_NUMBER}"
          FILE="TVPlayer_v${RUN_NUMBER}.apk"
          cp "$SRC" "$FILE"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: "🚀 Release"
        if: steps.checkytdlp.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: TV Player v${{ github.run_number }}
          body: |
            ## Сборка #${{ github.run_number }}
            ✨ Финальная сборка со всеми улучшениями:
            - Пул DoH с карантином и оверлеем DNS.
            - Фоновый Prefetch и Watchdog с индикатором реконнекта.
            - Лимит качества видео (Quality Picker).
            - Режим сна (4 часа) и оптимизация размера APK.
          files: ${{ steps.apk.outputs.file }}
          make_latest: true

