                  android:layout_height="wrap_content"
                  android:textColor="@color/text_dim"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="@id/recycler"
                  app:layout_constraintBottom_toBottomOf="@id/recycler"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          cat > app/src/main/res/layout/activity_settings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">
              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:orientation="horizontal"
                  android:background="#1A1A1A"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="16dp"
                  app:layout_constraintTop_toTopOf="parent">
                  <TextView
                      android:id="@+id/btnBack"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="← Назад"
                      android:textColor="@color/text"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:padding="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:background="?attr/selectableItemBackground" />
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Настройки"
                      android:textColor="@color/text"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:paddingStart="16dp" />
              </LinearLayout>
              <ScrollView
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:fillViewport="true"
                  app:layout_constraintTop_toBottomOf="@id/topBar"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="16dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:background="@drawable/card_bg"
                          android:padding="20dp"
                          android:layout_marginBottom="16dp">
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="ОБНОВЛЕНИЯ"
                              android:textColor="#FF8A8D93"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:letterSpacing="0.1"
                              android:paddingBottom="12dp" />
                          <TextView
                              android:id="@+id/txtVersion"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="TV Player"
                              android:textColor="@color/text"
                              android:textSize="20sp"
                              android:textStyle="bold" />
                          <TextView
                              android:id="@+id/txtStatus"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Проверка обновлений..."
                              android:textColor="#FF8A8D93"
                              android:textSize="14sp"
                              android:paddingTop="6dp"
                              android:paddingBottom="16dp" />
                          <TextView
                              android:id="@+id/btnCheckUpdate"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="🔄 Проверить обновления"
                              android:textColor="#FFFFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:gravity="center"
                              android:padding="16dp"
                              android:focusable="true"
                              android:clickable="true"
                              android:background="@drawable/button_accent_bg" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:background="@drawable/card_bg"
                          android:padding="20dp"
                          android:layout_marginBottom="16dp">
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="ПАМЯТЬ"
                              android:textColor="#FF8A8D93"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:letterSpacing="0.1"
                              android:paddingBottom="12dp" />
                          <TextView
                              android:id="@+id/btnClearCache"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="🗑 Очистить кэш"
                              android:textColor="@color/text"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:padding="16dp"
                              android:focusable="true"
                              android:clickable="true"
                              android:background="@drawable/tile_selector" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:background="@drawable/card_bg"
                          android:padding="20dp"
                          android:layout_marginBottom="16dp">
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="О ПРОГРАММЕ"
                              android:textColor="#FF8A8D93"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:letterSpacing="0.1"
                              android:paddingBottom="12dp" />
                          <TextView
                              android:id="@+id/txtAbout"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="@color/text"
                              android:textSize="14sp"
                              android:lineSpacingExtra="4dp" />
                      </LinearLayout>

                      <TextView
                          android:id="@+id/btnExitApp"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="✕ Выход из приложения"
                          android:textColor="#FFFF6B6B"
                          android:textSize="16sp"
                          android:textStyle="bold"
                          android:gravity="center"
                          android:padding="20dp"
                          android:focusable="true"
                          android:clickable="true"
                          android:background="@drawable/card_bg" />
                  </LinearLayout>
              </ScrollView>
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # =====================================================================
          # ПЛЕЕР: обычный PlayerView + оверлей с подсветкой кнопок при фокусе
          # =====================================================================
          cat > app/src/main/res/layout/activity_player.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:use_controller="false"
                  app:resize_mode="zoom"
                  android:keepScreenOn="true"
                  android:focusable="false" />

              <View
                  android:id="@+id/touchArea"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:focusable="false"
                  android:focusableInTouchMode="false" />

              <LinearLayout
                  android:id="@+id/channelListPanel"
                  android:layout_width="320dp"
                  android:layout_height="match_parent"
                  android:layout_gravity="start"
                  android:background="#EE111111"
                  android:visibility="gone"
                  android:orientation="vertical"
                  android:elevation="8dp">
