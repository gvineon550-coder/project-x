name: Build & Release TV Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ═══════════════════════════════════════════════════
      # ПОЛНЫЙ ПАТЧ (Исправлена ошибка с атрибутом плеера)
      # ═══════════════════════════════════════════════════
      - name: "🎨 Применение всех правок"
        run: |
          # 1. ИСПРАВЛЕННЫЙ resolver.py
          cat > app/src/main/python/resolver.py << 'EOF'
          import yt_dlp
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Referer": "https://vk.com/",
              "Origin":  "https://vk.com",
          }
          def resolve(url):
              try:
                  opts = {
                      "quiet": True, "no_warnings": True, "skip_download": True,
                      "http_headers": HEADERS,
                  }
                  with yt_dlp.YoutubeDL(opts) as ydl:
                      info = ydl.extract_info(url, download=False)
                  
                  if info.get("url") and ".m3u8" in info["url"]:
                      return info["url"]
                      
                  formats = info.get("formats", [])
                  for f in formats:
                      if f.get("protocol") == "m3u8":
                          u = f.get("url", "")
                          if "master" in u or "index.m3u8" in u:
                              return u
                              
                  best = None
                  max_h = -1
                  for f in formats:
                      if f.get("protocol") == "m3u8":
                          h = f.get("height") or 0
                          if h > max_h:
                              max_h = h
                              best = f
                  if best: return best["url"]
                  return info.get("url") or "ERROR: no m3u8 found"
              except Exception as e:
                  return "ERROR: " + str(e)
          EOF

          # 2. activity_player.xml (Убрали проблемный атрибут controller_show_timeout_ms)
          cat > app/src/main/res/layout/activity_player.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              
              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:show_buffering="when_playing"
                  app:use_controller="true"
                  app:resize_mode="zoom"
                  android:keepScreenOn="true" />
                  
              <TextView
                  android:id="@+id/btnQuality"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top|end"
                  android:layout_margin="24dp"
                  android:background="#AA000000"
                  android:paddingHorizontal="16dp"
                  android:paddingVertical="8dp"
                  android:text="Auto"
                  android:textColor="#FFFFFF"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  android:clickable="true"
                  android:focusable="true" />
                  
              <ProgressBar
                  android:id="@+id/progress"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center" />
                  
              <TextView
                  android:id="@+id/error"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:padding="24dp"
                  android:textColor="#FFAAAAAA"
                  android:visibility="gone" />
          </FrameLayout>
          EOF

          # 3. PlayerActivity.kt
          cat > app/src/main/java/com/tvplayer/app/PlayerActivity.kt << 'EOF'
          package com.tvplayer.app

          import android.app.AlertDialog
          import android.os.Bundle
          import android.view.View
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.common.Tracks
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.hls.HlsMediaSource
          import androidx.media3.exoplayer.trackselection.DefaultTrackSelector
          import com.tvplayer.app.databinding.ActivityPlayerBinding
          import kotlinx.coroutines.launch

          class PlayerActivity : AppCompatActivity() {
              private lateinit var b: ActivityPlayerBinding
              private var player: ExoPlayer? = null
              private lateinit var trackSelector: DefaultTrackSelector

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivityPlayerBinding.inflate(layoutInflater)
                  setContentView(b.root)
                  
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.hide(WindowInsetsCompat.Type.systemBars())
                  controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE

                  val url = intent.getStringExtra("url").orEmpty()
                  b.progress.visibility = View.VISIBLE

                  lifecycleScope.launch {
                      val direct = StreamResolver.resolve(url)
                      if (direct.startsWith("ERROR:")) {
                          b.progress.visibility = View.GONE
                          b.error.text = direct
                          b.error.visibility = View.VISIBLE
                          return@launch
                      }
                      play(direct)
                  }
              }

              private fun play(m3u8: String) {
                  val http = DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
                      .setDefaultRequestProperties(mapOf("Referer" to "https://vk.com/", "Origin" to "https://vk.com"))

                  trackSelector = DefaultTrackSelector(this)
                  player = ExoPlayer.Builder(this)
                      .setTrackSelector(trackSelector)
                      .build().apply {
                          setMediaSource(HlsMediaSource.Factory(http).createMediaSource(MediaItem.fromUri(m3u8)))
                          playWhenReady = true
                          prepare()
                          addListener(object : Player.Listener {
                              override fun onTracksChanged(tracks: Tracks) {
                                  updateQualityButton(tracks)
                              }
                          })
                      }
                  b.playerView.player = player
                  b.progress.visibility = View.GONE
                  b.btnQuality.setOnClickListener { showQualityDialog() }
              }

              private fun updateQualityButton(tracks: Tracks) {
                  val videoGroup = tracks.groups.firstOrNull { it.type == C.TRACK_TYPE_VIDEO } ?: return
                  val selectedIndex = (0 until videoGroup.length).firstOrNull { videoGroup.isTrackSelected(it) } ?: return
                  val format = videoGroup.getTrackFormat(selectedIndex)
                  b.btnQuality.text = if (format.height > 0) "${format.height}p" else "Auto"
              }

              private fun showQualityDialog() {
                  val p = player ?: return
                  val tracks = p.currentTracks
                  val videoGroup = tracks.groups.firstOrNull { it.type == C.TRACK_TYPE_VIDEO } ?: return
                  val qualities = mutableListOf<String>()
                  qualities.add("Авто (Auto)")
                  val formats = mutableListOf<androidx.media3.common.Format>()
                  for (i in 0 until videoGroup.length) {
                      val format = videoGroup.getTrackFormat(i)
                      val text = if (format.height > 0) "${format.height}p (${format.bitrate / 1000} kbps)" else "Track $i"
                      qualities.add(text)
                      formats.add(format)
                  }
                  AlertDialog.Builder(this).setTitle("Качество видео").setItems(qualities.toTypedArray()) { _, which ->
                      if (which == 0) {
                          trackSelector.parameters = trackSelector.buildUponParameters()
                              .clearOverridesOfType(C.TRACK_TYPE_VIDEO)
                              .setAllowVideoMixedMimeTypeAdaptiveness(true)
                              .build()
                      } else {
                          trackSelector.parameters = trackSelector.buildUponParameters()
                              .setOverrideForType(TrackSelectionOverride(videoGroup.getMediaTrackGroup(), which - 1))
                              .build()
                      }
                  }.show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
              }
          }
          EOF

          # 4. item_channel.xml
          cat > app/src/main/res/layout/item_channel.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="12dp"
              android:focusable="true"
              android:focusableInTouchMode="true"
              android:background="@drawable/tile_selector"
              android:clickable="true"
              android:layout_marginBottom="4dp">

              <ImageView
                  android:id="@+id/logo"
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:scaleType="centerCrop"
                  android:background="#222222" />

              <TextView
                  android:id="@+id/name"
                  android:layout_width="0dp"
                  android:layout_height="80dp"
                  android:layout_weight="1"
                  android:paddingStart="16dp"
                  android:paddingEnd="8dp"
                  android:gravity="center_vertical"
                  android:textColor="@color/text"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:maxLines="1"
                  android:ellipsize="end" />
          </LinearLayout>
          EOF

          # 5. activity_main.xml
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">

              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:orientation="horizontal"
                  android:background="#1A1A1A"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="16dp"
                  app:layout_constraintTop_toTopOf="parent">

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Все каналы"
                      android:textColor="@color/text"
                      android:textSize="22sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/btnRefresh"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Обновить"
                      android:textColor="@color/text_dim"
                      android:textSize="16sp"
                      android:padding="12dp"
                      android:background="?attr/selectableItemBackground" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/recycler"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:padding="8dp"
                  android:clipToPadding="false"
                  app:layout_constraintTop_toBottomOf="@id/topBar"
                  app:layout_constraintBottom_toTopOf="@id/btnExit"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <TextView
                  android:id="@+id/btnExit"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Выход"
                  android:textColor="@color/text_dim"
                  android:textSize="16sp"
                  android:gravity="center"
                  android:padding="20dp"
                  android:background="?attr/selectableItemBackground"
                  app:layout_constraintBottom_toBottomOf="parent" />

              <ProgressBar
                  android:id="@+id/progress"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  app:layout_constraintTop_toTopOf="@id/recycler"
                  app:layout_constraintBottom_toBottomOf="@id/recycler"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <TextView
                  android:id="@+id/error"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="@color/text_dim"
                  android:visibility="gone"
                  app:layout_constraintTop_toTopOf="@id/recycler"
                  app:layout_constraintBottom_toBottomOf="@id/recycler"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # 6. MainActivity.kt
          cat > app/src/main/java/com/tvplayer/app/MainActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.content.Intent
          import android.os.Bundle
          import android.view.View
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.tvplayer.app.databinding.ActivityMainBinding
          import kotlinx.coroutines.launch
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {
              private lateinit var b: ActivityMainBinding
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivityMainBinding.inflate(layoutInflater); setContentView(b.root)
                  b.recycler.layoutManager = LinearLayoutManager(this)
                  b.btnRefresh.setOnClickListener { load() }
                  b.btnExit.setOnClickListener { exitApp() }
                  load()
              }

              private fun exitApp() {
                  finishAndRemoveTask()
                  android.os.Process.killProcess(android.os.Process.myPid())
              }

              private fun load() {
                  b.progress.visibility = View.VISIBLE
                  b.error.visibility = View.GONE
                  b.recycler.visibility = View.GONE
                  lifecycleScope.launch {
                      val (manual, cat) = readConfig()
                      val list = loadChannels(cat, manual)
                      b.progress.visibility = View.GONE
                      if (list.isEmpty()) {
                          b.error.text = getString(R.string.error_load)
                          b.error.visibility = View.VISIBLE; return@launch
                      }
                      b.recycler.visibility = View.VISIBLE
                      b.recycler.adapter = ChannelAdapter(list) { ch ->
                          startActivity(Intent(this@MainActivity, PlayerActivity::class.java)
                              .putExtra("url", ch.url).putExtra("name", ch.name))
                      }
                      b.recycler.post {
                          b.recycler.findViewHolderForAdapterPosition(0)?.itemView?.requestFocus()
                      }
                  }
              }

              private fun readConfig(): Pair<List<Channel>, String> {
                  val json = assets.open("vk_config.json").bufferedReader().use { it.readText() }
                  val o = JSONObject(json); val manual = mutableListOf<Channel>()
                  o.optJSONArray("channels")?.let { arr ->
                      for (i in 0 until arr.length()) {
                          val c = arr.getJSONObject(i)
                          manual.add(Channel(c.optString("name"), c.optString("url"),
                              c.optString("logo"), c.optString("group", "VK Video")))
                      }
                  }
                  val cats = o.optJSONArray("categories")
                  return manual to (if (cats != null && cats.length() > 0) cats.getString(0) else "")
              }
          }
          EOF

          # 7. ChannelAdapter.kt
          cat > app/src/main/java/com/tvplayer/app/ChannelAdapter.kt << 'EOF'
          package com.tvplayer.app
          import android.view.*
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import coil.load

          class ChannelAdapter(private val items: List<Channel>, private val onClick: (Channel) -> Unit)
              : RecyclerView.Adapter<ChannelAdapter.VH>() {

              class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val logo: ImageView = v.findViewById(R.id.logo)
                  val name: TextView = v.findViewById(R.id.name)
              }

              override fun onCreateViewHolder(p: ViewGroup, t: Int): VH =
                  VH(LayoutInflater.from(p.context).inflate(R.layout.item_channel, p, false))

              override fun onBindViewHolder(h: VH, pos: Int) {
                  val ch = items[pos]
                  h.name.text = ch.name
                  if (ch.logo.isNotBlank()) {
                      h.logo.load(ch.logo) {
                          crossfade(true)
                          placeholder(android.R.color.darker_gray)
                          error(android.R.color.darker_gray)
                      }
                  } else {
                      h.logo.setImageResource(android.R.color.darker_gray)
                  }
                  h.itemView.setOnClickListener { onClick(ch) }
              }
              override fun getItemCount() = items.size
          }
          EOF

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "fix: removed invalid xml attribute, player ui and quality ready" || echo "no changes"
          git push || echo "push failed"

      # ═══════════════════════════════════════════════════
      # СБОРКА И РЕЛИЗ
      # ═══════════════════════════════════════════════════
      - name: "🔨 Build APK"
        id: build
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "─── Что упало ───"
            grep -A 20 "What went wrong" /tmp/gradle_build.log | head -25
            tail -50 /tmp/gradle_build.log
            exit 1
          fi
          echo "✅ Gradle OK"

      - name: "📦 Prepare APK"
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          V=$(grep 'versionName' app/build.gradle | head -1 | awk -F'"' '{print $2}')
          TAG="v${V}-$(date +%Y%m%d-%H%M)"
          FILE="TVPlayer_${TAG}.apk"
          cp "$SRC" "$FILE"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: "🚀 Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: TV Player ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
