name: Build & Release TV Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔍 Проверка версии yt-dlp"
        id: checkytdlp
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
          LAST_BUILT=$(cat .last_ytdlp_version 2>/dev/null || echo "none")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LATEST" = "$LAST_BUILT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$LATEST" > .last_ytdlp_version
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: "🌐 Pre-flight проверка DoH AdGuard"
        if: steps.checkytdlp.outputs.skip != 'true'
        continue-on-error: true
        run: |
          pip install --quiet dnspython==2.6.1 yt-dlp
          python3 - << 'PYEOF'
          import sys
          try:
              import yt_dlp
              import dns.message
              import dns.rdatatype
              print("✅ yt-dlp + dnspython импортируются без конфликтов")
          except Exception as e:
              print(f"❌ Конфликт зависимостей yt-dlp ↔ dnspython: {e}")
              sys.exit(1)

          try:
              import dns.message, dns.query, dns.rdatatype
          except ImportError as e:
              print(f"⚠️ dnspython не установлен: {e}")
              sys.exit(0)

          try:
              q = dns.message.make_query("wikipedia.org", dns.rdatatype.A)
              r = dns.query.https(q, "https://dns.adguard-dns.com/dns-query", timeout=10)
              if r.answer:
                  print(f"✅ DoH AdGuard работает (wikipedia.org → {r.answer[0][0]})")
              else:
                  print("⚠️ DoH AdGuard ответил, но без A-записей")
          except Exception as e:
              print(f"⚠️ DoH AdGuard недоступен из CI: {type(e).__name__}: {e}")
              print("   Это НЕ блокирует сборку — в приложении есть фолбэк")

          try:
              q2 = dns.message.make_query("doubleclick.net", dns.rdatatype.A)
              r2 = dns.query.https(q2, "https://dns.adguard-dns.com/dns-query", timeout=10)
              if r2.answer and any(str(rr) == "0.0.0.0" for rr in r2.answer[0]):
                  print("✅ DoH AdGuard блокирует рекламу (doubleclick.net → 0.0.0.0)")
              elif r2.answer:
                  print(f"ℹ️ DoH AdGuard резолвит doubleclick.net → {r2.answer[0][0]}")
              else:
                  print("ℹ️ DoH AdGuard вернул NXDOMAIN для doubleclick.net")
          except Exception as e:
              print(f"ℹ️ Проверка блокировки не удалась: {type(e).__name__}")
          PYEOF

      - name: "📦 Манифест, иконки, сплэш, фоны, layout"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          pip install --quiet Pillow

          python3 - << 'PYEOF'
          import re
          path = "app/build.gradle"
          with open(path) as f: txt = f.read()
          if "buildConfig = true" not in txt:
              txt = txt.replace("viewBinding = true", "viewBinding = true\n        buildConfig = true")
          if "GITHUB_REPO" not in txt:
              txt = txt.replace(
                  'versionName = "1.0"',
                  'versionName = "1.0"\n        buildConfigField "String", "GITHUB_REPO", "\\"${System.getenv(\'GITHUB_REPOSITORY\') ?: \'user/tvplayer\'}\\""'
              )
          if "core-splashscreen" not in txt:
              txt = txt.replace(
                  'implementation("androidx.lifecycle:lifecycle-service:2.8.3")',
                  'implementation("androidx.lifecycle:lifecycle-service:2.8.3")\n    implementation("androidx.core:core-splashscreen:1.0.1")'
              )
          if "okhttp-dnsoverhttps" not in txt or "media3-datasource-okhttp" not in txt:
              deps = []
              if "okhttp-dnsoverhttps" not in txt:
                  deps.append('    implementation("com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0")')
              if "media3-datasource-okhttp" not in txt:
                  deps.append('    implementation("androidx.media3:media3-datasource-okhttp:1.4.1")')
              txt = txt.replace(
                  'implementation("com.squareup.okhttp3:okhttp:4.12.0")',
                  'implementation("com.squareup.okhttp3:okhttp:4.12.0")\n' + "\n".join(deps)
              )
          chaquopy_match = re.search(r'^chaquopy\s*\{', txt, re.MULTILINE)
          if chaquopy_match:
              start = chaquopy_match.start()
              brace_pos = txt.find('{', start)
              depth = 0
              end = -1
              for i in range(brace_pos, len(txt)):
                  if txt[i] == '{':
                      depth += 1
                  elif txt[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end != -1:
                  while end < len(txt) and txt[end] == '\n':
                      end += 1
                  txt = txt[:start] + txt[end:]
          chaquopy_block = '\n'.join([
              'chaquopy {',
              '    defaultConfig {',
              '        version = "3.11"',
              '        pip {',
              '            install("yt-dlp")',
              '            install("dnspython==2.6.1")',
              '        }',
              '    }',
              '}',
              '',
              '',
          ])
          txt = txt.replace('dependencies {', chaquopy_block + 'dependencies {', 1)
          with open(path, "w") as f: f.write(txt)
          PYEOF

          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw
          import os
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for dpi, size in sizes.items():
              folder = f'app/src/main/res/mipmap-{dpi}'
              os.makedirs(folder, exist_ok=True)
              img = Image.new('RGBA', (size, size), (15, 17, 21, 255))
              draw = ImageDraw.Draw(img)
              margin = size // 8
              draw.ellipse([margin, margin, size-margin, size-margin], fill=(37, 99, 235, 255))
              tx = size // 2 - size // 12
              ty = size // 2 - size // 6
              draw.polygon([(tx, ty), (tx, ty + size // 3), (tx + size // 3, size // 2)], fill=(255, 255, 255, 255))
              img.save(f'{folder}/ic_launcher.png')
              img.save(f'{folder}/ic_launcher_round.png')
          PYEOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#2563EB"
                  android:pathData="M54,20 C72.78,20 88,35.22 88,54 C88,72.78 72.78,88 54,88 C35.22,88 20,72.78 20,54 C20,35.22 35.22,20 54,20 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L48,66 L68,54 Z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/splash_logo.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="200dp" android:height="200dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2563EB"
                  android:pathData="M54,20 C72.78,20 88,35.22 88,54 C88,72.78 72.78,88 54,88 C35.22,88 20,72.78 20,54 C20,35.22 35.22,20 54,20 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L48,66 L68,54 Z" />
          </vector>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.TVPlayer" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:textColor">@color/text</item>
              </style>
              <style name="Theme.TVPlayer.Splash" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">@color/bg</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>
                  <item name="postSplashScreenTheme">@style/Theme.TVPlayer</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:name=".TVPlayerApp"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.TVPlayer">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@style/Theme.TVPlayer.Splash"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity" android:exported="false"
                      android:screenOrientation="unspecified" />
                  <activity android:name=".PlayerActivity" android:exported="false"
                      android:screenOrientation="sensorLandscape" />
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          cat > app/src/main/res/drawable/button_focus_bg.xml << 'EOF'
