          cat > app/src/main/java/com/tvplayer/app/MainActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.core.content.FileProvider
          import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import coil.Coil
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.disk.DiskCache
          import coil.memory.MemoryCache
          import com.tvplayer.app.databinding.ActivityMainBinding
          import kotlinx.coroutines.launch
          import okhttp3.OkHttpClient
          import org.json.JSONObject
          import java.io.File
          import java.util.Calendar
          import java.util.concurrent.TimeUnit

          class MainActivity : BaseActivity(), ImageLoaderFactory {
              private lateinit var b: ActivityMainBinding
              private var allChannels: List<Channel> = emptyList()
              private var showOnlyFavorites = false
              private val prefs by lazy { getSharedPreferences("tvplayer", MODE_PRIVATE) }
              private var backPressedTime: Long = 0
              private var needScrollOnResume = false
              private val clockHandler = Handler(Looper.getMainLooper())
              private val clockRunnable = object : Runnable {
                  override fun run() {
                      val cal = Calendar.getInstance()
                      b.txtClock.text = String.format("%02d:%02d", cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE))
                      clockHandler.postDelayed(this, 1000)
                  }
              }

              override fun newImageLoader(): ImageLoader {
                  val dohOkHttp = OkHttpClient.Builder()
                      .connectTimeout(10, TimeUnit.SECONDS)
                      .readTimeout(20, TimeUnit.SECONDS)
                      .dns(DohProvider.createWithFallback(this))
                      .build()
                  return ImageLoader.Builder(this)
                      .okHttpClient(dohOkHttp)
                      .diskCache {
                          DiskCache.Builder()
                              .directory(cacheDir.resolve("image_cache"))
                              .maxSizeBytes(3L * 1024L * 1024L) // Уменьшено до 3 МБ
                              .build()
                      }
                      .memoryCache {
                          MemoryCache.Builder(this)
                              .maxSizeBytes(4 * 1024 * 1024) // Уменьшено до 4 МБ
                              .build()
                      }
                      .build()
              }

              override fun onCreate(s: Bundle?) {
                  installSplashScreen()
                  super.onCreate(s)
                  b = ActivityMainBinding.inflate(layoutInflater); setContentView(b.root)
                  b.recycler.layoutManager = LinearLayoutManager(this)

                  // Принудительно чистим старый раздутый кэш картинок при старте
                  val imageCacheDir = cacheDir.resolve("image_cache")
                  var currentCacheSize = 0L
                  if (imageCacheDir.exists()) {
                      currentCacheSize = imageCacheDir.walkTopDown().filter { it.isFile }.sumOf { it.length() }
                  }
                  if (currentCacheSize > 5 * 1024 * 1024) {
                      try {
                          Coil.imageLoader(this).diskCache?.clear()
                          imageCacheDir.deleteRecursively()
                          CrashLogger.info("Cleanup", "Принудительно очищен раздутый кэш картинок ($currentCacheSize байт)")
                      } catch (_: Exception) {}
                  }

                  // Очистка только 1 раз при старте главного экрана
                  CacheManager.maybeCleanup(this)

                  b.btnRefresh.setOnClickListener {
                      CrashLogger.info("UI", "Кнопка Обновить")
                      b.progress.visibility = View.VISIBLE
                      b.errorLayout.visibility = View.GONE
                      loadFromNetwork(forceRefresh = true)
                  }
                  b.btnFavFilter.setOnClickListener { showOnlyFavorites = !showOnlyFavorites; updateView(scrollToLast = false) }
                  b.btnSettings.setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
                  b.btnCheckUpdates.setOnClickListener { manualCheckForUpdates() }
                  b.btnRetryMain.setOnClickListener {
                      b.errorLayout.visibility = View.GONE
                      b.progress.visibility = View.VISIBLE
                      loadFromNetwork(forceRefresh = true)
                  }

                  b.btnFavFilter.nextFocusDownId = R.id.recycler
                  b.btnRefresh.nextFocusDownId = R.id.recycler
                  b.btnCheckUpdates.nextFocusDownId = R.id.recycler
                  b.btnSettings.nextFocusDownId = R.id.recycler

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (System.currentTimeMillis() - backPressedTime < 3000) {
                              CrashLogger.info("Lifecycle", "Полный выход (двойной BACK)")
                              exitApp()
                          } else {
                              Toast.makeText(this@MainActivity, "Нажмите «Назад» ещё раз для выхода", Toast.LENGTH_SHORT).show()
                              backPressedTime = System.currentTimeMillis()
                          }
                      }
                  })

                  loadInitial()
                  clockHandler.post(clockRunnable)
              }

              override fun onResume() {
                  super.onResume()
                  if (needScrollOnResume && allChannels.isNotEmpty()) {
                      needScrollOnResume = false
                      b.recycler.postDelayed({ scrollToLastChannel() }, 200)
                  }
              }

              override fun onDestroy() {
                  clockHandler.removeCallbacks(clockRunnable)
                  super.onDestroy()
              }

              private fun humanError(code: String, detail: String): String {
                  return when {
                      code.contains("NO_NETWORK") -> "📡 Нет подключения к интернету"
                      code.contains("TIMEOUT") -> "⏱ Сервер VK не отвечает"
                      code.contains("HTTP_403") -> "🚫 Канал недоступен (VK: 403)"
                      code.contains("HTTP_404") -> "🚫 Канал не найден (VK: 404)"
                      code.contains("NO_M3U8") -> "🔍 Не удалось найти поток"
                      code.contains("PARSE_ERROR") -> "📄 VK вернул некорректный ответ"
                      code.contains("VK_OFFLINE") -> "📺 Канал сейчас не транслируется"
                      else -> detail
                  }
              }

              private fun scrollToLastChannel() {
                  val lastIndex = prefs.getInt("last_channel", 0)
                  if (lastIndex in allChannels.indices) {
                      (b.recycler.layoutManager as LinearLayoutManager).scrollToPositionWithOffset(lastIndex, 0)
                      b.recycler.postDelayed({
                          b.recycler.findViewHolderForAdapterPosition(lastIndex)?.itemView?.requestFocus()
                      }, 100)
                  }
              }

              private fun loadInitial() {
                  val cached = ChannelCache.load(this)
                  if (cached != null && cached.isNotEmpty()) {
                      allChannels = cached
                      updateView(scrollToLast = true)
                      if (ChannelCache.isFresh(this)) {
                          CrashLogger.info("MainActivity", "Кэш свежий (<24ч), VK не дёргаем")
                          return
                      }
                      CrashLogger.info("MainActivity", "Кэш устарел — обновление в фоне")
                      loadFromNetwork(forceRefresh = false)
                  } else {
                      CrashLogger.info("MainActivity", "Кэш пуст — полная загрузка")
                      b.progress.visibility = View.VISIBLE
                      loadFromNetwork(forceRefresh = false)
                  }
              }

              private fun loadFromNetwork(forceRefresh: Boolean) {
                  if (!NetworkUtils.isOnline(this)) {
                      CrashLogger.info("MainActivity", "Нет интернета — отмена")
                      b.progress.visibility = View.GONE
                      if (allChannels.isEmpty()) {
                          b.recycler.visibility = View.GONE
                          b.error.text = humanError("NO_NETWORK", "Нет подключения к интернету.")
                          b.errorLayout.visibility = View.VISIBLE
                      }
                      return
                  }
                  lifecycleScope.launch {
                      try {
                          val (manual, cat) = readConfig()
                          val manualWithLogos = manual.map { ch ->
                              if (ch.logo.isBlank()) {
                                  val cached = ThumbCache.get(this@MainActivity, ch.url)
                                  if (cached != null) ch.copy(logo = cached)
                                  else {
                                      val thumb = StreamResolver.getThumbnail(ch.url)
                                      if (thumb.isNotBlank()) {
                                          ThumbCache.put(this@MainActivity, ch.url, thumb)
                                          ch.copy(logo = thumb)
                                      } else ch
                                  }
                              } else ch
                          }
                          val fresh = if (cat.isBlank() && manualWithLogos.isNotEmpty()) {
                              CrashLogger.info("MainActivity", "categoryId пустой — только ручные каналы")
                              manualWithLogos
                          } else {
                              loadChannels(this@MainActivity, cat, manualWithLogos)
                          }
                          b.progress.visibility = View.GONE
                          if (fresh.isNotEmpty()) {
                              val changed = fresh.size != allChannels.size || fresh.zip(allChannels).any { it.first.url != it.second.url }
                              allChannels = fresh
                              ChannelCache.save(this@MainActivity, fresh)

                              val currentFavs = prefs.getStringSet("favorites", emptySet())?.toMutableSet() ?: mutableSetOf()
                              val actualUrls = fresh.map { it.url }.toSet()
                              val before = currentFavs.size
                              currentFavs.retainAll(actualUrls)
                              if (currentFavs.size < before) {
                                  prefs.edit().putStringSet("favorites", currentFavs).apply()
                                  CrashLogger.info("Favorites", "Удалено ${before - currentFavs.size} мёртвых записей")
                              }

                              if (changed || forceRefresh || b.recycler.adapter == null) {
                                  updateView(scrollToLast = forceRefresh)
                              }
                          } else {
                              b.error.text = "Не удалось загрузить каналы."
                              b.errorLayout.visibility = View.VISIBLE
                              CrashLogger.error("MainActivity", "Пустой список каналов")
                          }
                      } catch (e: Exception) {
                          b.progress.visibility = View.GONE
                          b.error.text = "Ошибка загрузки:\n${e.javaClass.simpleName}: ${e.message}"
                          b.errorLayout.visibility = View.VISIBLE
                          CrashLogger.error("MainActivity", "Исключение при загрузке", e)
                      }
                  }
              }

              private fun manualCheckForUpdates() {
                  CrashLogger.info("OTA", "Ручная проверка (кнопка ⬇️)")
                  if (!NetworkUtils.isOnline(this)) {
                      Toast.makeText(this, "Нет подключения к интернету", Toast.LENGTH_SHORT).show()
                      return
                  }
                  Toast.makeText(this, "Проверка обновлений...", Toast.LENGTH_SHORT).show()
                  lifecycleScope.launch {
                      val info = UpdateChecker.checkForUpdate(this@MainActivity)
                      if (info == null) {
                          Toast.makeText(this@MainActivity, "✅ Последняя версия (v${BuildConfig.VERSION_CODE})", Toast.LENGTH_LONG).show()
                      } else {
                          UpdateDialog.show(this@MainActivity, info.versionCode, info.changelog) { startUpdateDownload(info.downloadUrl) }
                      }
                  }
              }

              private fun showLogDialog() {
                  val log = CrashLogger.readAll(this)
                  AlertDialog.Builder(this)
                      .setTitle("Лог приложения")
                      .setMessage(log.takeLast(3000))
                      .setPositiveButton("Отправить") { _, _ -> CrashLogger.share(this) }
                      .setNegativeButton("Скопировать") { _, _ ->
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("log", log))
                          Toast.makeText(this, "Лог скопирован", Toast.LENGTH_SHORT).show()
                      }
                      .setNeutralButton("Закрыть", null)
                      .show()
              }

              private fun startUpdateDownload(url: String) {
                  Toast.makeText(this, "Загрузка обновления...", Toast.LENGTH_LONG).show()
                  lifecycleScope.launch {
                      val file = UpdateChecker.downloadApk(this@MainActivity, url)
                      if (file == null) {
                          Toast.makeText(this@MainActivity, "Не удалось скачать", Toast.LENGTH_LONG).show()
                          return@launch
                      }
                      installApk(file)
                  }
              }

              private fun installApk(file: File) {
                  if (!packageManager.canRequestPackageInstalls()) {
                      Toast.makeText(this, "Разрешите установку", Toast.LENGTH_LONG).show()
                      try {
                          startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                      } catch (_: Exception) {}
                      return
                  }
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                      CrashLogger.info("OTA", "Установка запущена (update.apk удалится при старте новой версии)")
                  } catch (e: Exception) {
                      CrashLogger.error("OTA", "Ошибка установки", e)
                      Toast.makeText(this, "Ошибка: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun updateView(scrollToLast: Boolean = false) {
                  if (allChannels.isEmpty()) return
                  b.progress.visibility = View.GONE
                  b.errorLayout.visibility = View.GONE
                  val favs = prefs.getStringSet("favorites", emptySet()) ?: emptySet()
                  allChannels.forEach { it.isFavorite = favs.contains(it.url) }
                  val sorted = allChannels.sortedByDescending { it.isFavorite }
                  val displayed = if (showOnlyFavorites) sorted.filter { it.isFavorite } else sorted
                  b.txtTitle.text = if (showOnlyFavorites) "Избранное (${displayed.size})" else "Все каналы (${displayed.size})"
                  b.btnFavFilter.text = if (showOnlyFavorites) "★ Избранное" else "☆ Избранное"
                  b.btnFavFilter.setTextColor(if (showOnlyFavorites) Color.parseColor("#FFEB3B") else Color.parseColor("#FF8A8D93"))
                  b.recycler.visibility = View.VISIBLE
                  b.recycler.adapter = ChannelAdapter(displayed, { ch ->
                      needScrollOnResume = true
                      CrashLogger.info("UI", "Открытие: ${ch.name}")
                      val intent = Intent(this@MainActivity, PlayerActivity::class.java)
                      intent.putExtra("index", allChannels.indexOfFirst { it.url == ch.url })
                      intent.putStringArrayListExtra("names", ArrayList(allChannels.map { it.name }))
                      intent.putStringArrayListExtra("urls", ArrayList(allChannels.map { it.url }))
                      startActivity(intent)
                  }, { ch ->
                      val currentFavs = prefs.getStringSet("favorites", emptySet())?.toMutableSet() ?: mutableSetOf()
                      if (currentFavs.contains(ch.url)) currentFavs.remove(ch.url) else currentFavs.add(ch.url)
                      prefs.edit().putStringSet("favorites", currentFavs).apply()
                      updateView(scrollToLast = false)
                  })

                  b.recycler.post {
                      if (scrollToLast) scrollToLastChannel()
                      else b.recycler.getChildAt(0)?.requestFocus()
                  }
              }

              private fun readConfig(): Pair<List<Channel>, String> {
                  return try {
                      val json = assets.open("vk_config.json").bufferedReader().use { it.readText() }
                      val o = JSONObject(json); val manual = mutableListOf<Channel>()
                      o.optJSONArray("channels")?.let { arr ->
                          for (i in 0 until arr.length()) {
                              val c = arr.getJSONObject(i)
                              manual.add(Channel(c.optString("name"), c.optString("url"), c.optString("logo"), c.optString("group", "VK Video")))
                          }
                      }
                      val cats = o.optJSONArray("categories")
                      manual to (if (cats != null && cats.length() > 0) cats.getString(0) else "")
                  } catch (e: Exception) {
                      CrashLogger.error("MainActivity", "Ошибка чтения vk_config.json", e)
                      emptyList<Channel>() to ""
                  }
              }
          }
          EOF

      - name: "⚙ SettingsActivity (тумблер DoH)"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/SettingsActivity.kt << 'EOF'
          package com.tvplayer.app
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.core.content.FileProvider
          import androidx.lifecycle.lifecycleScope
          import coil.Coil
          import com.tvplayer.app.databinding.ActivitySettingsBinding
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class SettingsActivity : BaseActivity() {
              private lateinit var b: ActivitySettingsBinding

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivitySettingsBinding.inflate(layoutInflater); setContentView(b.root)

                  b.txtVersion.text = "TV Player v${BuildConfig.VERSION_NAME} (${BuildConfig.VERSION_CODE})"
                  b.txtAbout.text = """
                      Лёгкое и быстрое приложение для просмотра телеканалов VK Live.

                      🎯 ВОЗМОЖНОСТИ:
                      • Просмотр VK Live в высоком качестве
                      • Автоподгрузка списка каналов
                      • Выбор качества и формата экрана
                      • Избранное (долгое нажатие ОК)
                      • Переключение пультом вверх/вниз
                      • Панель каналов в плеере (ОК)
                      • Таймер сна (5м – 5ч)
                      • Автовыключение через 4ч без активности
                      • Умное кэширование + автоочистка (3ч / >15МБ)
                      • DNS-over-HTTPS (AdGuard) — ВСЕ запросы
                      • Тумблер DoH + диагностика
                      • Кнопка 🐛 в плеере (навигация пультом)
                      • Индикатор буферизации + часы на оверлее
                      • Подробный лог

                      ⚙️ ТЕХНОЛОГИИ:
                      • Резолвер: yt-dlp (Python + Chaquopy)
                      • Плеер: Media3 (ExoPlayer)
                      • Сборка: GitHub Actions

                      ❤️ Сделано для семьи и друзей.
                  """.trimIndent()

                  updateCacheInfo()
                  updateDohToggleUI()

                  b.btnBack.setOnClickListener { finish() }
                  b.btnCheckUpdate.setOnClickListener { checkUpdate() }
                  b.btnCheckDoh.setOnClickListener { runDohDiagnostics() }
                  b.btnToggleDoh.setOnClickListener { toggleDoh() }

                  b.btnClearCache.setOnClickListener {
                      val imageLoader = Coil.imageLoader(this)
                      imageLoader.diskCache?.clear()
                      imageLoader.memoryCache?.clear()
                      StreamCache.clearAll(this)
                      ChannelCache.clear(this)
                      ThumbCache.clear(this)
                      File(cacheDir, "image_cache").deleteRecursively()
                      File(cacheDir, "doh_cache").deleteRecursively()
                      File(cacheDir, "ytdlp_tmp").deleteRecursively()
                      File(cacheDir, "update.apk").delete()
                      Toast.makeText(this, "Кэш очищен", Toast.LENGTH_SHORT).show()
                      updateCacheInfo()
                      CrashLogger.info("Settings", "Кэш очищен вручную")
                  }

                  b.btnFullReset.setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("Полный сброс")
                          .setMessage("Будут удалены:\n\n• Избранное\n• Последний канал\n• Все кэши\n• Лог\n• Настройка DoH (вернётся ВКЛ)\n\nПриложение не удалится. Продолжить?")
                          .setPositiveButton("Сбросить") { _, _ -> performFullReset() }
                          .setNegativeButton("Отмена", null)
                          .show()
                  }

                  b.btnOpenLog.setOnClickListener {
                      val log = CrashLogger.readAll(this)
                      AlertDialog.Builder(this)
                          .setTitle("Лог приложения")
                          .setMessage(log.takeLast(3000))
                          .setPositiveButton("Скопировать") { _, _ ->
                              val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              clipboard.setPrimaryClip(ClipData.newPlainText("log", log))
                              Toast.makeText(this, "Лог скопирован", Toast.LENGTH_SHORT).show()
                          }
                          .setNegativeButton("Закрыть", null)
                          .show()
                  }

                  b.btnShareLog.setOnClickListener { CrashLogger.share(this) }

                  b.btnExitApp.setOnClickListener {
                      CrashLogger.info("Settings", "Полный выход")
                      exitApp()
                  }
              }

              private fun updateDohToggleUI() {
                  val enabled = DohSettings.isEnabled(this)
                  if (enabled) {
                      b.btnToggleDoh.text = "🟢 AdGuard DoH: ВКЛ"
                      b.btnToggleDoh.setTextColor(Color.parseColor("#FF4ADE80"))
                  } else {
                      b.btnToggleDoh.text = "🔴 AdGuard DoH: ВЫКЛ"
                      b.btnToggleDoh.setTextColor(Color.parseColor("#FFFF6B6B"))
                  }
              }

              private fun toggleDoh() {
                  val newState = !DohSettings.isEnabled(this)
                  b.btnToggleDoh.isEnabled = false
                  b.btnToggleDoh.text = "⏳ Применение..."
                  b.btnToggleDoh.setTextColor(Color.parseColor("#FF8A8D93"))

                  lifecycleScope.launch {
                      DohSettings.setEnabled(this@SettingsActivity, newState)
                      val pyOk = withContext(Dispatchers.IO) { syncPythonDohFlag(newState) }

                      try {
                          Coil.reset()
                          CrashLogger.info("DoH", "Coil.reset() — ImageLoader пересоздан с новым состоянием")
                      } catch (e: Exception) {
                          CrashLogger.error("DoH", "Coil.reset() не удался", e)
                      }

                      if (!pyOk) {
                          DohSettings.setEnabled(this@SettingsActivity, !newState)
                          if (!newState) DohProvider.invalidate()
                          try { Coil.reset() } catch (_: Exception) {}
                          updateDohToggleUI()
                          Toast.makeText(
                              this@SettingsActivity,
                              "❌ Python не ответил. Состояние не изменено.",
                              Toast.LENGTH_LONG
                          ).show()
                          CrashLogger.error("DoH", "Откат: синхронизация с Python провалена")
                      } else {
                          updateDohToggleUI()
                          Toast.makeText(
                              this@SettingsActivity,
                              if (newState) "🟢 AdGuard DoH включён везде — HTTPS" else "🔴 AdGuard DoH выключен везде — системный DNS",
                              Toast.LENGTH_LONG
                          ).show()
                          CrashLogger.info("DoH", "Тумблер применён: enabled=$newState")
                      }
                      b.btnToggleDoh.isEnabled = true
                  }
              }

              private fun syncPythonDohFlag(enabled: Boolean): Boolean {
                  for (attempt in 0 until 3) {
                      try {
                          val m = com.chaquo.python.Python.getInstance().getModule("resolver")
                          m.callAttr("set_doh_enabled", enabled)
                          val health = m.callAttr("doh_health").toString()
                          val pyEnabled = Regex("'enabled':\\s*(True|False)").find(health)?.groupValues?.get(1) == "True"
                          if (pyEnabled == enabled) {
                              CrashLogger.info("DoH", "✅ Python применён: enabled=$enabled (попытка ${attempt + 1})")
                              return true
                          }
                          CrashLogger.info("DoH", "Python-флаг не совпал (попытка ${attempt + 1}): ожидали $enabled")
                      } catch (e: Exception) {
                          CrashLogger.error("DoH", "Ошибка синхронизации Python (попытка ${attempt + 1})", e)
                      }
                      try { Thread.sleep(200) } catch (_: InterruptedException) {}
                  }
                  CrashLogger.error("DoH", "❌ Python НЕ применён после 3 попыток")
                  return false
              }

              private fun runDohDiagnostics() {
                  b.txtDohResult.text = "⏳ Проверка DoH, подождите..."
                  b.btnCheckDoh.isEnabled = false
                  lifecycleScope.launch {
                      val report = withContext(Dispatchers.IO) {
                          try {
                              DohProvider.runFullDiagnostics(this@SettingsActivity)
                          } catch (e: Exception) {
                              CrashLogger.error("DoH", "Ошибка диагностики", e)
                              "❌ Ошибка диагностики:\n${e.javaClass.simpleName}: ${e.message}"
                          }
                      }
                      b.txtDohResult.text = report
                      b.btnCheckDoh.isEnabled = true
                  }
              }

              private fun performFullReset() {
                  try {
                      getSharedPreferences("tvplayer", MODE_PRIVATE).edit().clear().apply()
                      getSharedPreferences("stream_cache", MODE_PRIVATE).edit().clear().apply()
                      getSharedPreferences("doh_settings", MODE_PRIVATE).edit().clear().apply()
                      ChannelCache.clear(this)
                      ThumbCache.clear(this)
                      CrashLogger.clear(this)
                      val il = Coil.imageLoader(this)
                      il.diskCache?.clear()
                      il.memoryCache?.clear()
                      File(cacheDir, "image_cache").deleteRecursively()
                      File(cacheDir, "doh_cache").deleteRecursively()
                      File(cacheDir, "ytdlp_tmp").deleteRecursively()
                      File(cacheDir, "update.apk").delete()
                      DohProvider.invalidate()
                      try { Coil.reset() } catch (_: Exception) {}
                      lifecycleScope.launch(Dispatchers.IO) { syncPythonDohFlag(true) }
                      updateDohToggleUI()
                      Toast.makeText(this, "Полный сброс выполнен (DoH включён)", Toast.LENGTH_SHORT).show()
                      CrashLogger.info("Settings", "Полный сброс: всё очищено, DoH в default=true")
                      updateCacheInfo()
                  } catch (e: Exception) {
                      CrashLogger.error("Settings", "Ошибка полного сброса", e)
                      Toast.makeText(this, "Ошибка: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun checkUpdate() {
                  b.txtStatus.text = "⏳ Проверка обновлений..."
                  b.txtStatus.setTextColor(Color.parseColor("#FF8A8D93"))
                  lifecycleScope.launch {
                      val info = UpdateChecker.checkForUpdate(this@SettingsActivity)
                      if (info == null) {
                          b.txtStatus.text = "✅ У вас актуальная версия"
                          b.txtStatus.setTextColor(Color.parseColor("#FF4ADE80"))
                      } else {
                          b.txtStatus.text = "🎉 Доступно обновление v${info.versionCode}!"
                          b.txtStatus.setTextColor(Color.parseColor("#FFFACC15"))
                          UpdateDialog.show(this@SettingsActivity, info.versionCode, info.changelog) { startUpdateDownload(info.downloadUrl) }
                      }
                  }
              }

              private fun updateCacheInfo() {
                  try {
                      val imageCacheSize = File(cacheDir, "image_cache").walkTopDown().filter { it.isFile }.sumOf { it.length() }
                      val channelsCacheFile = File(filesDir, "channels_cache.json")
                      val channelsCacheSize = if (channelsCacheFile.exists()) channelsCacheFile.length() else 0L
                      val logFile = File(filesDir, "app.log")
                      val logSize = if (logFile.exists()) logFile.length() else 0L
                      val streamPrefs = getSharedPreferences("stream_cache", MODE_PRIVATE)
                      val streamSize = streamPrefs.all.values.sumOf { ((it as? String)?.length ?: 0).toLong() }
                      val totalCache = cacheDir.walkTopDown().filter { it.isFile }.sumOf { it.length() }
                      val totalFiles = filesDir.walkTopDown().filter { it.isFile }.sumOf { it.length() }
                      val pythonSize = totalFiles - channelsCacheSize - logSize

                      val stats = buildString {
                          appendLine("🖼 Кэш картинок: ${formatSize(imageCacheSize)} / 3 МБ")
                          appendLine("📋 Кэш списка: ${formatSize(channelsCacheSize)}")
                          appendLine("🔗 Кэш ссылок: ${formatSize(streamSize)} (${streamPrefs.all.size}/120)")
                          appendLine("📝 Лог: ${formatSize(logSize)} / 200 КБ")
                          appendLine("🐍 Python: ${formatSize(pythonSize)}")
                          appendLine("📦 Cache всего: ${formatSize(totalCache)}")
                          append("💾 Files всего: ${formatSize(totalFiles)} / 30 МБ")
                      }
                      b.txtCacheStats.text = stats
                      b.btnClearCache.text = String.format("🗑 Очистить кэш (%s)", formatSize(totalCache))
                  } catch (e: Exception) {
                      b.txtCacheStats.text = "Не удалось посчитать: ${e.message}"
                  }
              }

              private fun formatSize(bytes: Long): String = when {
                  bytes < 1024 -> "$bytes Б"
                  bytes < 1024 * 1024 -> "${bytes / 1024} КБ"
                  else -> String.format("%.1f МБ", bytes / 1024f / 1024f)
              }

              private fun startUpdateDownload(url: String) {
                  Toast.makeText(this, "Загрузка обновления...", Toast.LENGTH_LONG).show()
                  lifecycleScope.launch {
                      val file = UpdateChecker.downloadApk(this@SettingsActivity, url)
                      if (file == null) {
                          Toast.makeText(this@SettingsActivity, "Не удалось скачать", Toast.LENGTH_LONG).show()
                          return@launch
                      }
                      installApk(file)
                  }
              }

              private fun installApk(file: File) {
                  if (!packageManager.canRequestPackageInstalls()) {
                      Toast.makeText(this, "Разрешите установку", Toast.LENGTH_LONG).show()
                      try {
                          startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                      } catch (_: Exception) {}
                      return
                  }
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                      CrashLogger.info("OTA", "Установка запущена (update.apk удалится при старте новой версии)")
                  } catch (e: Exception) {
                      CrashLogger.error("OTA", "Ошибка установки", e)
                      Toast.makeText(this, "Ошибка: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

