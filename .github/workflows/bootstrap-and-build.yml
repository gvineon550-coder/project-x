name: Build & Release TV Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ═══ Патчи (применяются и коммитятся один раз) ═══
      - name: Patch files
        run: |
          # 1) Снимаем фиксацию версии yt-dlp — ставим самую свежую
          sed -i 's/install("yt-dlp==[^"]*")/install("yt-dlp")/' app/build.gradle
          sed -i 's/yt-dlp==[0-9.]*/yt-dlp/' app/src/main/assets/requirements.txt 2>/dev/null || true

          # 2) Подробный resolver.py: пробует несколько форматов, возвращает полную ошибку
          cat > app/src/main/python/resolver.py << 'PYEOF'
          import yt_dlp

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Referer": "https://vk.com/",
              "Origin":  "https://vk.com",
          }

          def resolve(url):
              errors = []
              for fmt in ["best[protocol^=m3u8]/best", "best", "all"]:
                  try:
                      opts = {
                          "quiet": True, "no_warnings": True, "skip_download": True,
                          "format": fmt, "http_headers": HEADERS,
                      }
                      with yt_dlp.YoutubeDL(opts) as ydl:
                          info = ydl.extract_info(url, download=False)
                      for f in info.get("formats", []):
                          proto = f.get("protocol", "") or ""
                          if proto.startswith("m3u8") and f.get("url"):
                              return f["url"]
                      if info.get("url"):
                          return info["url"]
                      protocols = [f.get("protocol") for f in info.get("formats", [])]
                      errors.append(f"{fmt}: url пустой, protocols={protocols}")
                  except Exception as e:
                      errors.append(f"{fmt}: {e}")
              return "ERROR: " + " || ".join(errors)
          PYEOF

          # 3) StreamResolver: пропускает ошибку наружу
          cat > app/src/main/java/com/tvplayer/app/StreamResolver.kt << 'KTEOF'
          package com.tvplayer.app

          import com.chaquo.python.Python
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          object StreamResolver {
              suspend fun resolve(url: String): String = withContext(Dispatchers.IO) {
                  try {
                      val m = Python.getInstance().getModule("resolver")
                      m.callAttr("resolve", url).toString()
                  } catch (e: Exception) {
                      "ERROR: " + (e.message ?: e.toString())
                  }
              }
          }
          KTEOF

          # 4) PlayerActivity: показывает текст ошибки в UI
          cat > app/src/main/java/com/tvplayer/app/PlayerActivity.kt << 'KTEOF'
          package com.tvplayer.app

          import android.os.Bundle
          import android.view.View
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.media3.common.MediaItem
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.hls.HlsMediaSource
          import com.tvplayer.app.databinding.ActivityPlayerBinding
          import kotlinx.coroutines.launch

          class PlayerActivity : AppCompatActivity() {
              private lateinit var b: ActivityPlayerBinding
              private var player: ExoPlayer? = null

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivityPlayerBinding.inflate(layoutInflater)
                  setContentView(b.root)
                  val url = intent.getStringExtra("url").orEmpty()
                  b.progress.visibility = View.VISIBLE
                  lifecycleScope.launch {
                      val direct = StreamResolver.resolve(url)
                      if (direct.startsWith("ERROR:")) {
                          b.progress.visibility = View.GONE
                          b.error.text = direct
                          b.error.visibility = View.VISIBLE
                          return@launch
                      }
                      play(direct)
                  }
              }

              private fun play(m3u8: String) {
                  val http = DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                              "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
                      .setDefaultRequestProperties(mapOf(
                          "Referer" to "https://vk.com/",
                          "Origin" to "https://vk.com"))
                  player = ExoPlayer.Builder(this).build().apply {
                      setMediaSource(HlsMediaSource.Factory(http)
                          .createMediaSource(MediaItem.fromUri(m3u8)))
                      playWhenReady = true
                      prepare()
                  }
                  b.playerView.player = player
                  b.progress.visibility = View.GONE
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
                  finishAndRemoveTask()
              }
          }
          KTEOF

          # Коммитим патчи, чтобы не применять каждый раз
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Патчи уже применены"
          else
            git commit -m "fix: update yt-dlp, add error reporting"
            git push
            echo "✅ Патчи применены и закоммичены"
          fi

      # ═══ Сборка ═══
      - name: "🔨 Build APK"
        id: build
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "─── Что упало ───"
            grep -A 20 "What went wrong" /tmp/gradle_build.log | head -25
            tail -50 /tmp/gradle_build.log
            {
              echo "### ❌ Сборка упала"
              echo '```'
              grep -A 15 "What went wrong" /tmp/gradle_build.log | head -20
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Gradle OK"

      - name: "📦 Prepare APK"
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          V=$(grep 'versionName' app/build.gradle | head -1 | awk -F'"' '{print $2}')
          TAG="v${V}-$(date +%Y%m%d-%H%M)"
          FILE="TVPlayer_${TAG}.apk"
          cp "$SRC" "$FILE"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "✅ $FILE ($(du -h "$FILE" | cut -f1))"

      - name: "🚀 Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: TV Player ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
