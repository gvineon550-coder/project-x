          package com.tvplayer.app

          import android.content.Context
          import com.chaquo.python.Python
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull

          object StreamResolver {
              private const val TIMEOUT = 30_000L
              private const val RETRIES = 2
              private const val RETRY_DELAY = 1000L

              private val gate = Mutex()

              suspend fun resolve(url: String): String {
                  if (!UrlUtils.isVk(url)) {
                      CrashLogger.info("StreamResolver", "Прямой поток, yt-dlp не нужен")
                      return url
                  }
                  var last = "ERROR: не удалось получить ссылку"
                  var success: String? = null
                  gate.withLock {
                      for (attempt in 0..RETRIES) {
                          val t = System.currentTimeMillis()
                          val res = withContext(Dispatchers.IO) {
                              withTimeoutOrNull(TIMEOUT) { callPython(url) }
                          } ?: "ERROR[Timeout]: резолвер не ответил за ${TIMEOUT / 1000}с"
                          val el = System.currentTimeMillis() - t
                          if (res.isNotBlank() && !res.startsWith("ERROR")) {
                              CrashLogger.info("StreamResolver", "✓ ${el}мс → ${res.take(80)}")
                              success = res
                              break
                          }
                          last = res
                          CrashLogger.error("StreamResolver", "✗ попытка ${attempt + 1}/${RETRIES + 1} за ${el}мс: $res")
                          if (attempt < RETRIES) delay(RETRY_DELAY)
                      }
                  }
                  return success ?: last
              }

              private fun callPython(url: String): String = try {
                  if (!Python.isStarted()) "ERROR[Python]: интерпретатор не запущен"
                  else Python.getInstance().getModule("resolver").callAttr("resolve", url).toString()
              } catch (e: Exception) {
                  "ERROR[${e.javaClass.simpleName}]: ${e.message ?: "unknown"}"
              }

              suspend fun getThumbnail(context: Context, url: String): String {
                  ThumbCache.get(context, url)?.let { return it }
                  val thumb = withContext(Dispatchers.IO) {
                      withTimeoutOrNull(20_000L) {
                          try {
                              if (!Python.isStarted()) return@withTimeoutOrNull ""
                              Python.getInstance().getModule("resolver").callAttr("get_thumbnail", url).toString()
                          } catch (_: Exception) { "" }
                      } ?: ""
                  }
                  ThumbCache.put(context, url, thumb)
                  return thumb
              }
          }
