name: Build & Release TV Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'   # Каждый понедельник в 03:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ═══════════════════════════════════════════════════
      # ПРОВЕРКА: нужно ли собирать APK?
      # (при плановом запуске — только если yt-dlp обновился)
      # ═══════════════════════════════════════════════════
      - name: "🔍 Проверка версии yt-dlp"
        id: checkytdlp
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
          LAST_BUILT=$(cat .last_ytdlp_version 2>/dev/null || echo "none")
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "PyPI (свежая):       $LATEST"
          echo "Вшита в APK:         $LAST_BUILT"
          echo "Триггер:             ${{ github.event_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LATEST" = "$LAST_BUILT" ]; then
            echo "ℹ️  Плановый запуск, yt-dlp не обновился — пропускаем сборку."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$LATEST" > .last_ytdlp_version
            echo "✅ Собираем новый APK"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ═══════════════════════════════════════════════════
      # ШАГ 1: Манифест, build.gradle (buildConfig), XML
      # ═══════════════════════════════════════════════════
      - name: "📦 Генерация манифеста и верстки"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          python3 - << 'PYEOF'
          import re
          path = "app/build.gradle"
          with open(path) as f: txt = f.read()
          if "buildConfig = true" not in txt:
              txt = txt.replace("viewBinding = true", "viewBinding = true\n        buildConfig = true")
          if "GITHUB_REPO" not in txt:
              txt = txt.replace(
                  'versionName = "1.0"',
                  'versionName = "1.0"\n        buildConfigField "String", "GITHUB_REPO", "\\"${System.getenv(\'GITHUB_REPOSITORY\') ?: \'user/tvplayer\'}\\""'
              )
          with open(path, "w") as f: f.write(txt)
          PYEOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:name="com.chaquo.python.android.PyApplication"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.TVPlayer">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
