          cat > app/src/main/java/com/tvplayer/app/DohProvider.kt << 'EOF'
          package com.tvplayer.app
          import android.content.Context
          import okhttp3.Dns
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.dnsoverhttps.DnsOverHttps
          import java.net.InetAddress
          import java.net.UnknownHostException
          import java.util.concurrent.TimeUnit

          object DohProvider {
              private val PROVIDERS = listOf(
                  "AdGuard" to "https://dns.adguard-dns.com/dns-query",
                  "AdGuard Raw" to "https://unfiltered.adguard-dns.com/dns-query",
                  "Quad9" to "https://dns.quad9.net/dns-query"
              )
              private const val TEST_DOMAIN = "wikipedia.org"

              @Volatile private var currentProviderIndex = 0
              @Volatile var activeStatusLabel: String = "AdGuard"
                  private set

              private val cooldownUntil = LongArray(PROVIDERS.size) { 0L }
              private const val COOLDOWN_MS = 10 * 60 * 1000L

              @Volatile private var cached: Dns? = null
              @Volatile private var cachedContext: Context? = null

              fun createWithFallback(context: Context): Dns {
                  val appCtx = context.applicationContext
                  cached?.let { if (cachedContext === appCtx) return it }
                  synchronized(this) {
                      cached?.let { if (cachedContext === appCtx) return it }
                      val created = build(appCtx)
                      cached = created
                      cachedContext = appCtx
                      return created
                  }
              }

              fun invalidate() {
                  synchronized(this) { cached = null; cachedContext = null }
              }

              private fun build(context: Context): Dns {
                  return object : Dns {
                      override fun lookup(hostname: String): List<InetAddress> {
                          if (!DohSettings.isEnabled(context)) {
                              activeStatusLabel = "System DNS"
                              return Dns.SYSTEM.lookup(hostname)
                          }
                          val now = System.currentTimeMillis()
                          for (i in PROVIDERS.indices) {
                              val index = (currentProviderIndex + i) % PROVIDERS.size
                              if (now < cooldownUntil[index]) continue
                              val (name, url) = PROVIDERS[index]
                              try {
                                  val client = OkHttpClient.Builder().connectTimeout(1500, TimeUnit.MILLISECONDS).readTimeout(1500, TimeUnit.MILLISECONDS).build()
                                  val doh = DnsOverHttps.Builder().client(client).url(url.toHttpUrl()).includeIPv6(false).build()
                                  val result = doh.lookup(hostname)
                                  if (result.isNotEmpty()) {
                                      if (index != currentProviderIndex) currentProviderIndex = index
                                      activeStatusLabel = name
                                      return result
                                  }
                              } catch (e: Exception) {
                                  cooldownUntil[index] = now + COOLDOWN_MS
                              }
                          }
                          activeStatusLabel = "System (Fallback)"
                          return try { Dns.SYSTEM.lookup(hostname) } catch (e: UnknownHostException) { throw e }
                      }
                  }
              }

              fun testDoh(context: Context): Boolean {
                  if (!DohSettings.isEnabled(context.applicationContext)) return false
                  return try {
                      val client = OkHttpClient.Builder().build()
                      val doh = DnsOverHttps.Builder().client(client).url(PROVIDERS[0].second.toHttpUrl()).includeIPv6(false).build()
                      doh.lookup(TEST_DOMAIN).isNotEmpty()
                  } catch (_: Exception) { false }
              }

              fun runFullDiagnostics(context: Context): String {
                  val enabled = DohSettings.isEnabled(context)
                  return if (enabled) "🟢 DoH: ВКЛ\nАктивен: $activeStatusLabel" else "🔴 DoH: ВЫКЛ"
              }
          }
          EOF

          cat > app/src/main/java/com/tvplayer/app/VkApi.kt << 'EOF'
          package com.tvplayer.app
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.util.UUID
          import java.util.concurrent.TimeUnit

          data class Channel(val name: String, val url: String, val logo: String, val group: String = "VK Live", var isFavorite: Boolean = false)

          private fun buildClient(context: android.content.Context) = OkHttpClient.Builder().connectTimeout(10, TimeUnit.SECONDS).readTimeout(20, TimeUnit.SECONDS).dns(DohProvider.createWithFallback(context)).build()
          private val UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          suspend fun loadChannels(context: android.content.Context, categoryId: String, manual: List<Channel>): List<Channel> = withContext(Dispatchers.IO) {
              val result = mutableListOf<Channel>()
              try {
                  val url = "https://api.live.vkvideo.ru/v1/catalog/public_video_streams/category/$categoryId/stream/?limit=100"
                  val req = Request.Builder().url(url).header("User-Agent", UA).header("Accept", "application/json").header("X-App", "streams_web").header("X-From-Id", UUID.randomUUID().toString()).header("Referer", "https://vk.com/").header("Origin", "https://vk.com").build()
                  buildClient(context).newCall(req).execute().use { resp ->
                      val body = resp.body?.string().orEmpty()
                      if (resp.isSuccessful && body.isNotBlank()) {
                          val streams = JSONObject(body).optJSONObject("data")?.optJSONArray("streamBlogs")
                          if (streams != null) for (i in 0 until streams.length()) {
                              val item = streams.optJSONObject(i) ?: continue
                              if (!item.optBoolean("is_online", true)) continue
                              val blog = item.optJSONObject("blog") ?: continue
                              val blogUrl = blog.optString("blogUrl"); if (blogUrl.isBlank()) continue
                              val raw = blog.optString("title").ifBlank { blog.optJSONObject("owner")?.optString("displayName").orEmpty() }.ifBlank { blogUrl }
                              val name = if (raw.length > 60) raw.take(60) + "…" else raw
                              val logo = blog.optJSONObject("owner")?.optString("avatarUrl")?.ifBlank { null } ?: blog.optString("coverUrl")
                              result.add(Channel(name, "https://live.vkvideo.ru/$blogUrl", logo))
                          }
                      }
                  }
              } catch (e: Exception) { CrashLogger.error("VkApi", "Ошибка", e) }
              result + manual
          }
