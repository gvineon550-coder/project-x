          package com.tvplayer.app

          object M3uParser {
              private const val MAX_CHANNELS = 5000
              private val ATTR = Regex("""([A-Za-z0-9_-]+)="([^"]*)"""")

              data class Result(val channels: List<Channel>, val epgUrl: String)

              fun parse(text: String, playlistId: String, playlistName: String): Result {
                  val out = ArrayList<Channel>()
                  var epgUrl = ""
                  var name = ""
                  var logo = ""
                  var group = ""
                  var tvgId = ""
                  var pendingGroup = ""

                  for (rawLine in text.lineSequence()) {
                      val line = rawLine.trim()
                      if (line.isEmpty()) continue
                      when {
                          line.startsWith("#EXTM3U", true) -> {
                              ATTR.findAll(line).forEach { m ->
                                  val k = m.groupValues[1].lowercase()
                                  if (k == "x-tvg-url" || k == "url-tvg") {
                                      if (epgUrl.isBlank()) epgUrl = m.groupValues[2].split(",").first().trim()
                                  }
                              }
                          }
                          line.startsWith("#EXTINF", true) -> {
                              val attrs = ATTR.findAll(line).associate {
                                  it.groupValues[1].lowercase() to it.groupValues[2]
                              }
                              tvgId = attrs["tvg-id"].orEmpty()
                              logo = attrs["tvg-logo"].orEmpty().ifBlank { attrs["logo"].orEmpty() }
                              group = attrs["group-title"].orEmpty().ifBlank { pendingGroup }
                              name = displayName(line).ifBlank { attrs["tvg-name"].orEmpty() }
                          }
                          line.startsWith("#EXTGRP:", true) -> {
                              pendingGroup = line.substringAfter(':').trim()
                              if (group.isBlank()) group = pendingGroup
                          }
                          line.startsWith("#") -> { }
                          else -> {
                              if (UrlUtils.isHttp(line) && out.size < MAX_CHANNELS) {
                                  val finalName = name.ifBlank { UrlUtils.host(line).ifBlank { "Канал ${out.size + 1}" } }
                                  out.add(
                                      Channel(
                                          name = if (finalName.length > 70) finalName.take(70) + "…" else finalName,
                                          url = line,
                                          logo = logo,
                                          group = group.ifBlank { playlistName },
                                          source = Channel.SOURCE_M3U,
                                          tvgId = tvgId,
                                          playlistId = playlistId,
                                          direct = !UrlUtils.isVk(line)
                                      )
                                  )
                              }
                              name = ""; logo = ""; group = ""; tvgId = ""
                          }
                      }
                  }
                  CrashLogger.info("M3uParser", "$playlistName: ${out.size} каналов, EPG=${epgUrl.isNotBlank()}")
                  return Result(out, epgUrl)
              }

              private fun displayName(line: String): String {
                  var quoted = false
                  for (i in line.indices) {
                      val c = line[i]
                      if (c == '"') quoted = !quoted
                      else if (c == ',' && !quoted) return line.substring(i + 1).trim()
                  }
                  return ""
              }
          }
          EOF

