              private fun bootstrap() {
                  if (channels.isNotEmpty()) {
                      currentIndex = currentIndex.coerceIn(0, channels.size - 1)
                      startPlayback()
                      return
                  }
                  val url = intent.getStringExtra("url").orEmpty()
                  lifecycleScope.launch {
                      val restored = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                          (ChannelCache.load(this@PlayerActivity) ?: emptyList()) +
                                  M3uRepository.loadAllCached(this@PlayerActivity)
                      }
                      if (restored.isEmpty()) {
                          Toast.makeText(this@PlayerActivity, "Список каналов пуст", Toast.LENGTH_LONG).show()
                          finish(); return@launch
                      }
                      channels = restored
                      applyFavorites()
                      currentIndex = restored.indexOfFirst { it.url == url }.takeIf { it >= 0 } ?: 0
                      startPlayback()
