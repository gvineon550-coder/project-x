name: Build & Release TV Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔍 Проверка версии yt-dlp"
        id: checkytdlp
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
          LAST_BUILT=$(cat .last_ytdlp_version 2>/dev/null || echo "none")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LATEST" = "$LAST_BUILT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$LATEST" > .last_ytdlp_version
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: "🌐 Pre-flight проверка DoH AdGuard"
        if: steps.checkytdlp.outputs.skip != 'true'
        continue-on-error: true
        run: |
          pip install --quiet dnspython==2.6.1 yt-dlp
          python3 - << 'PYEOF'
          import sys
          try:
              import yt_dlp, dns.message, dns.rdatatype
              print("✅ yt-dlp + dnspython импортируются без конфликтов")
          except Exception as e:
              print(f"❌ Конфликт зависимостей: {e}")
              sys.exit(1)
          try:
              import dns.query
              q = dns.message.make_query("wikipedia.org", dns.rdatatype.A)
              r = dns.query.https(q, "https://dns.adguard-dns.com/dns-query", timeout=10)
              print(f"✅ DoH AdGuard работает: {r.answer[0][0]}" if r.answer else "⚠️ DoH без A-записей")
          except Exception as e:
              print(f"⚠️ DoH недоступен из CI: {type(e).__name__}: {e} (в приложении есть фолбэк)")
          PYEOF

      - name: "📦 Патч build.gradle"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          mkdir -p app/src/main/python app/src/main/assets
          mkdir -p app/src/main/res/{layout,values,xml,drawable,mipmap-anydpi-v26,mipmap-mdpi,mipmap-hdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}
          mkdir -p app/src/main/java/com/tvplayer/app
          python3 - << 'PYEOF'
          import re
          path = "app/build.gradle"
          txt = open(path).read()

          def block_end(s, start):
              i = s.index('{', start); depth = 0
              for j in range(i, len(s)):
                  if s[j] == '{': depth += 1
                  elif s[j] == '}':
                      depth -= 1
                      if depth == 0: return j
              return -1

          m = re.search(r'^chaquopy\s*\{', txt, re.M)
          if m:
              e = block_end(txt, m.start())
              if e != -1:
                  while e + 1 < len(txt) and txt[e+1] == '\n': e += 1
                  txt = txt[:m.start()] + txt[e+1:]

          if 'buildFeatures' not in txt:
              m = re.search(r'android\s*\{', txt)
              i = m.end()
              txt = txt[:i] + '\n    buildFeatures {\n        viewBinding = true\n        buildConfig = true\n    }\n' + txt[i:]
          else:
              m = re.search(r'buildFeatures\s*\{', txt)
              e = block_end(txt, m.start())
              inner = txt[m.end():e]
              add = ''
              if 'viewBinding' not in inner: add += '\n        viewBinding = true'
              if 'buildConfig' not in inner: add += '\n        buildConfig = true'
              if add: txt = txt[:e] + add + '\n    ' + txt[e:]
              txt = re.sub(r'viewBinding\s*=\s*false', 'viewBinding = true', txt)
              txt = re.sub(r'buildConfig\s*=\s*false', 'buildConfig = true', txt)

          if 'GITHUB_REPO' not in txt:
              m = re.search(r'defaultConfig\s*\{', txt)
              i = m.end()
              line = r'''
                      buildConfigField "String", "GITHUB_REPO", "\"${System.getenv('GITHUB_REPOSITORY') ?: 'user/tvplayer'}\""'''
              txt = txt[:i] + line + txt[i:]

          deps = [
              "androidx.core:core-ktx:1.13.1",
              "androidx.appcompat:appcompat:1.7.0",
              "androidx.constraintlayout:constraintlayout:2.1.4",
              "androidx.recyclerview:recyclerview:1.3.2",
              "androidx.lifecycle:lifecycle-runtime-ktx:2.8.3",
              "androidx.lifecycle:lifecycle-service:2.8.3",
              "androidx.core:core-splashscreen:1.0.1",
              "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1",
              "com.squareup.okhttp3:okhttp:4.12.0",
              "com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0",
              "io.coil-kt:coil:2.6.0",
              "androidx.media3:media3-exoplayer:1.4.1",
              "androidx.media3:media3-exoplayer-hls:1.4.1",
              "androidx.media3:media3-ui:1.4.1",
              "androidx.media3:media3-datasource-okhttp:1.4.1",
          ]
          di = txt.index("dependencies {") + len("dependencies {")
          ins = ""
          for d in deps:
              artifact = d.rsplit(":", 1)[0] + ":"
              if artifact not in txt:
                  ins += '\n    implementation("%s")' % d
          if ins:
              txt = txt[:di] + ins + txt[di:]

          chaquopy = (
              'chaquopy {\n'
              '    defaultConfig {\n'
              '        version = "3.11"\n'
              '        pip {\n'
              '            install("yt-dlp")\n'
              '            install("dnspython==2.6.1")\n'
              '        }\n'
              '    }\n'
              '}\n\n'
          )
          txt = txt.replace('dependencies {', chaquopy + 'dependencies {', 1)

          if 'com.chaquo.python' not in txt:
              print("⚠️ ВНИМАНИЕ: плагин com.chaquo.python не найден")
          open(path, "w").write(txt)
          print("✅ build.gradle обновлён")
          PYEOF

      - name: "🎨 Иконки, темы, drawable"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          pip install --quiet Pillow
          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw
          import os
          for dpi, size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              folder = f'app/src/main/res/mipmap-{dpi}'
              os.makedirs(folder, exist_ok=True)
              img = Image.new('RGBA', (size, size), (15, 17, 21, 255))
              d = ImageDraw.Draw(img)
              m = size // 8
              d.ellipse([m, m, size-m, size-m], fill=(37, 99, 235, 255))
              tx = size//2 - size//12; ty = size//2 - size//6
              d.polygon([(tx, ty), (tx, ty + size//3), (tx + size//3, size//2)], fill=(255,255,255,255))
              img.save(f'{folder}/ic_launcher.png')
              img.save(f'{folder}/ic_launcher_round.png')
          PYEOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="bg">#FF0F1115</color>
              <color name="text">#FFFFFFFF</color>
              <color name="text_dim">#FF8A8D93</color>
              <color name="accent">#FF2563EB</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">TV Player</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.TVPlayer" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:textColor">@color/text</item>
              </style>
              <style name="Theme.TVPlayer.Splash" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">@color/bg</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>
                  <item name="postSplashScreenTheme">@style/Theme.TVPlayer</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2563EB"
                  android:pathData="M54,20 C72.78,20 88,35.22 88,54 C88,72.78 72.78,88 54,88 C35.22,88 20,72.78 20,54 C20,35.22 35.22,20 54,20 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L48,66 L68,54 Z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/splash_logo.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="200dp" android:height="200dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2563EB"
                  android:pathData="M54,20 C72.78,20 88,35.22 88,54 C88,72.78 72.78,88 54,88 C35.22,88 20,72.78 20,54 C20,35.22 35.22,20 54,20 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L48,66 L68,54 Z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/tile_selector.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FF22262F" />
                      <stroke android:width="3dp" android:color="#FF2563EB" />
                      <corners android:radius="10dp" />
                  </shape>
              </item>
              <item android:state_selected="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FF1C1F26" />
                      <stroke android:width="2dp" android:color="#FF2563EB" />
                      <corners android:radius="10dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#FF15171C" />
                      <corners android:radius="10dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/button_focus_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FFFFFFFF" />
                      <stroke android:width="3dp" android:color="#FF2563EB" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#AA000000" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/btn_play_pause_focus.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="oval">
                      <solid android:color="#FF2563EB" />
                      <stroke android:width="3dp" android:color="#FFFFFFFF" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="oval">
                      <solid android:color="#00000000" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/card_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FF1C1F26" />
                      <stroke android:width="2dp" android:color="#FFFFFFFF" />
                      <corners android:radius="14dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#FF1C1F26" />
                      <corners android:radius="14dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/button_accent_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FF3B82F6" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#FF2563EB" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/panel_item_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FF2563EB" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#00000000" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          cat > app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      - name: "📐 Манифест"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:name=".TVPlayerApp"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.TVPlayer">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@style/Theme.TVPlayer.Splash"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".PlaylistsActivity" android:exported="false"
                      android:screenOrientation="unspecified" />
                  <activity android:name=".SettingsActivity" android:exported="false"
                      android:screenOrientation="unspecified" />
                  <activity android:name=".PlayerActivity" android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="sensorLandscape" />
                  <service android:name=".PlaybackService" android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: "🖼 Layout: main (с вкладками VK/Плейлисты)"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">
              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:orientation="horizontal"
                  android:background="#1A1A1A"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="12dp"
                  app:layout_constraintTop_toTopOf="parent">
                  <TextView
                      android:id="@+id/btnTabVk"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="VK Live"
                      android:textColor="@color/text"
                      android:textSize="17sp"
                      android:textStyle="bold"
                      android:padding="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:background="@drawable/tile_selector" />
                  <TextView
                      android:id="@+id/btnTabM3u"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="6dp"
                      android:text="Плейлисты"
                      android:textColor="@color/text_dim"
                      android:textSize="17sp"
                      android:textStyle="bold"
                      android:padding="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:background="@drawable/tile_selector" />
                  <TextView
                      android:id="@+id/txtTitle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:paddingStart="14dp"
                      android:text=""
                      android:textColor="@color/text_dim"
                      android:textSize="15sp"
                      android:maxLines="1"
                      android:ellipsize="end" />
                  <TextView
                      android:id="@+id/btnGroups"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Группы"
                      android:textColor="@color/text_dim"
                      android:textSize="15sp"
                      android:padding="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:visibility="gone"
                      android:background="?attr/selectableItemBackground" />
                  <TextView
                      android:id="@+id/btnPlaylists"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📺"
                      android:textSize="20sp"
                      android:paddingHorizontal="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:visibility="gone"
                      android:contentDescription="Мои плейлисты"
                      android:background="?attr/selectableItemBackground" />
                  <TextView
                      android:id="@+id/btnFavFilter"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="★"
                      android:textColor="#FFEB3B"
                      android:textSize="22sp"
                      android:paddingHorizontal="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:contentDescription="Избранное"
                      android:background="?attr/selectableItemBackground" />
                  <TextView
                      android:id="@+id/btnRefresh"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⟳"
                      android:textColor="@color/text_dim"
                      android:textSize="22sp"
                      android:paddingHorizontal="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:contentDescription="Обновить"
                      android:background="?attr/selectableItemBackground" />
                  <TextView
                      android:id="@+id/btnCheckUpdates"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⬇️"
                      android:textSize="20sp"
                      android:paddingHorizontal="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:contentDescription="Проверить обновления"
                      android:background="?attr/selectableItemBackground" />
                  <TextView
                      android:id="@+id/btnSettings"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⚙"
                      android:textColor="@color/text_dim"
                      android:textSize="22sp"
                      android:paddingHorizontal="12dp"
                      android:focusable="true"
                      android:clickable="true"
                      android:contentDescription="Настройки"
                      android:background="?attr/selectableItemBackground" />
              </LinearLayout>
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/recycler"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:padding="8dp"
                  android:clipToPadding="false"
                  app:layout_constraintTop_toBottomOf="@id/topBar"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />
              <ProgressBar
