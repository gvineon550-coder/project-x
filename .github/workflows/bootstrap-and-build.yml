          package com.tvplayer.app

          import android.content.Context
          import okhttp3.ConnectionPool
          import okhttp3.OkHttpClient
          import java.util.concurrent.TimeUnit

          object HttpClientProvider {
              const val UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                      "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

              @Volatile private var base: OkHttpClient? = null

              fun get(context: Context): OkHttpClient {
                  base?.let { return it }
                  return synchronized(this) {
                      base ?: OkHttpClient.Builder()
                          .connectTimeout(10, TimeUnit.SECONDS)
                          .readTimeout(20, TimeUnit.SECONDS)
                          .retryOnConnectionFailure(true)
                          .connectionPool(ConnectionPool(4, 5, TimeUnit.MINUTES))
                          .dns(DohProvider.createWithFallback(context.applicationContext))
                          .build()
                          .also { base = it }
                  }
              }

              fun media(context: Context): OkHttpClient =
                  get(context).newBuilder().readTimeout(30, TimeUnit.SECONDS).build()

              fun download(context: Context): OkHttpClient =
                  get(context).newBuilder()
                      .connectTimeout(30, TimeUnit.SECONDS)
                      .readTimeout(120, TimeUnit.SECONDS)
                      .build()

              fun reset() = synchronized(this) { base = null }
          }
