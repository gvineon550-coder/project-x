                              android:letterSpacing="0.1"
                              android:paddingBottom="12dp" />
                          <TextView
                              android:id="@+id/txtVersion"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="TV Player"
                              android:textColor="@color/text"
                              android:textSize="20sp"
                              android:textStyle="bold" />
                          <TextView
                              android:id="@+id/txtStatus"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Проверка обновлений..."
                              android:textColor="#FF8A8D93"
                              android:textSize="14sp"
                              android:paddingTop="6dp"
                              android:paddingBottom="16dp" />
                          <TextView
                              android:id="@+id/btnCheckUpdate"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="🔄 Проверить обновления"
                              android:textColor="#FFFFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:gravity="center"
                              android:padding="16dp"
                              android:focusable="true"
                              android:clickable="true"
                              android:background="@drawable/button_accent_bg" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:background="@drawable/card_bg"
                          android:padding="20dp"
                          android:layout_marginBottom="16dp">
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="ПАМЯТЬ"
                              android:textColor="#FF8A8D93"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:letterSpacing="0.1"
                              android:paddingBottom="12dp" />
                          <TextView
                              android:id="@+id/btnClearCache"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="🗑 Очистить кэш"
                              android:textColor="@color/text"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:padding="16dp"
                              android:focusable="true"
                              android:clickable="true"
                              android:background="@drawable/tile_selector"
                              android:layout_marginBottom="8dp" />
                          <TextView
                              android:id="@+id/btnOpenLog"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="📋 Открыть лог"
                              android:textColor="@color/text"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:padding="16dp"
                              android:focusable="true"
                              android:clickable="true"
                              android:background="@drawable/tile_selector"
                              android:layout_marginBottom="8dp" />
                          <TextView
                              android:id="@+id/btnShareLog"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="📤 Отправить лог"
                              android:textColor="@color/text"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:padding="16dp"
                              android:focusable="true"
                              android:clickable="true"
                              android:background="@drawable/tile_selector" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:background="@drawable/card_bg"
                          android:padding="20dp"
                          android:layout_marginBottom="16dp">
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="О ПРОГРАММЕ"
                              android:textColor="#FF8A8D93"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:letterSpacing="0.1"
                              android:paddingBottom="12dp" />
                          <TextView
                              android:id="@+id/txtAbout"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="@color/text"
                              android:textSize="14sp"
                              android:lineSpacingExtra="4dp" />
                      </LinearLayout>

                      <TextView
                          android:id="@+id/btnExitApp"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="✕ Выход из приложения"
                          android:textColor="#FFFF6B6B"
                          android:textSize="16sp"
                          android:textStyle="bold"
                          android:gravity="center"
                          android:padding="20dp"
                          android:focusable="true"
                          android:clickable="true"
                          android:background="@drawable/card_bg" />
                  </LinearLayout>
              </ScrollView>
