        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/MainActivity.kt << 'EOF'
          package com.tvplayer.app

          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.StatFs
          import android.provider.Settings
          import android.view.View
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.disk.DiskCache
          import com.tvplayer.app.databinding.ActivityMainBinding
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.File

          class MainActivity : AppCompatActivity(), ImageLoaderFactory {

              private lateinit var b: ActivityMainBinding
              private val prefs by lazy { getSharedPreferences("tvplayer", MODE_PRIVATE) }

              private var tab = "vk"
              private var vkChannels: List<Channel> = emptyList()
              private var m3uChannels: List<Channel> = emptyList()
              private var showOnlyFavorites = false
              private var groupFilter: String? = null
              private var rows: List<ChannelAdapter.Row> = emptyList()
              private var displayed: List<Channel> = emptyList()
              private var backPressedTime = 0L
              private var loading = false

              override fun newImageLoader(): ImageLoader =
                  ImageLoader.Builder(this)
                      .okHttpClient(HttpClientProvider.get(this))
                      .diskCache {
                          DiskCache.Builder()
                              .directory(cacheDir.resolve("image_cache"))
                              .maxSizeBytes(5L * 1024L * 1024L)
                              .build()
                      }
                      .build()

              override fun onCreate(s: Bundle?) {
                  installSplashScreen()
                  super.onCreate(s)
                  b = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(b.root)
                  b.recycler.layoutManager = LinearLayoutManager(this)
                  performStartupCleanup()

                  tab = prefs.getString("last_tab", "vk") ?: "vk"

                  b.btnTabVk.setOnClickListener { switchTab("vk") }
                  b.btnTabM3u.setOnClickListener { switchTab("m3u") }
                  b.btnRefresh.setOnClickListener { refreshCurrent(force = true) }
                  b.btnFavFilter.setOnClickListener {
                      showOnlyFavorites = !showOnlyFavorites
                      updateView(scrollToLast = false)
                  }
                  b.btnGroups.setOnClickListener { showGroupDialog() }
                  b.btnPlaylists.setOnClickListener { startActivity(Intent(this, PlaylistsActivity::class.java)) }
                  b.btnSettings.setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
                  b.btnCheckUpdates.setOnClickListener { manualCheckForUpdates() }
                  b.error.setOnClickListener { showLogDialog() }

                  listOf(b.btnTabVk, b.btnTabM3u, b.btnGroups, b.btnPlaylists,
                      b.btnFavFilter, b.btnRefresh, b.btnCheckUpdates, b.btnSettings)
                      .forEach { it.nextFocusDownId = R.id.recycler }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (System.currentTimeMillis() - backPressedTime < 3000) finishAffinity()
                          else {
                              Toast.makeText(this@MainActivity, "Нажмите «Назад» ещё раз для выхода", Toast.LENGTH_SHORT).show()
                              backPressedTime = System.currentTimeMillis()
                          }
                      }
                  })

                  applyTabUi()
                  loadInitial()
              }

              override fun onResume() {
                  super.onResume()
                  applyFavorites()
                  if (tab == "m3u") refreshM3u(force = false) else updateView(scrollToLast = true)
              }

              private fun switchTab(newTab: String) {
                  if (tab == newTab) return
                  tab = newTab
                  groupFilter = null
                  prefs.edit().putString("last_tab", tab).apply()
                  if (tab == "vk") EpgStore.clearMemory()
                  applyTabUi()
                  updateView(scrollToLast = true)
                  if (tab == "m3u" && m3uChannels.isEmpty()) refreshM3u(force = false)
              }

              private fun applyTabUi() {
                  val vkActive = tab == "vk"
                  b.btnTabVk.setTextColor(if (vkActive) Color.WHITE else Color.parseColor("#FF8A8D93"))
                  b.btnTabM3u.setTextColor(if (!vkActive) Color.WHITE else Color.parseColor("#FF8A8D93"))
                  b.btnGroups.visibility = if (vkActive) View.GONE else View.VISIBLE
                  b.btnPlaylists.visibility = if (vkActive) View.GONE else View.VISIBLE
              }

              private fun applyFavorites() {
                  val favs = prefs.getStringSet("favorites", emptySet()) ?: emptySet()
                  vkChannels.forEach { it.isFavorite = favs.contains(it.url) }
                  m3uChannels.forEach { it.isFavorite = favs.contains(it.url) }
              }

              private fun loadInitial() {
                  vkChannels = ChannelCache.load(this) ?: emptyList()
                  m3uChannels = M3uRepository.loadAllCached(this)
                  applyFavorites()
                  updateView(scrollToLast = true)
                  if (tab == "vk") {
                      if (ChannelCache.isFresh(this)) CrashLogger.info("Main", "VK кэш свежий")
                      else refreshVk(force = false)
                  } else refreshM3u(force = false)
              }

              private fun refreshCurrent(force: Boolean) {
                  if (tab == "vk") refreshVk(force) else refreshM3u(force)
              }

              private fun offlineNotice(): String? =
                  if (!NetworkUtils.isOnline(this)) "📴 Офлайн" else null

              private fun refreshVk(force: Boolean) {
                  if (loading) return
                  if (!NetworkUtils.isOnline(this)) {
                      if (vkChannels.isEmpty()) showError("Нет подключения к интернету.\nНажмите для подробностей.")
                      else updateView(scrollToLast = false)
                      return
                  }
                  loading = true
                  if (vkChannels.isEmpty()) b.progress.visibility = View.VISIBLE
                  lifecycleScope.launch {
                      try {
                          val (manual, cat) = withContext(Dispatchers.IO) { readConfig() }
                          val manualWithLogos = manual.map { ch ->
                              if (ch.logo.isBlank()) {
                                  val t = StreamResolver.getThumbnail(this@MainActivity, ch.url)
                                  if (t.isNotBlank()) ch.copy(logo = t) else ch
                              } else ch
                          }
                          val fresh = VkApi.loadChannels(this@MainActivity, cat, manualWithLogos)
                          b.progress.visibility = View.GONE
                          if (fresh.isNotEmpty()) {
                              vkChannels = fresh
                              ChannelCache.save(this@MainActivity, fresh)
                              pruneFavorites(fresh.map { it.url }.toSet(), vk = true)
                              applyFavorites()
                              if (tab == "vk") updateView(scrollToLast = force)
                          } else if (vkChannels.isEmpty()) {
                              showError("Не удалось загрузить каналы VK.\nНажмите для подробностей.")
                          }
                      } catch (e: Exception) {
                          b.progress.visibility = View.GONE
                          CrashLogger.error("Main", "Загрузка VK", e)
                          if (vkChannels.isEmpty()) showError("Ошибка загрузки:\n${e.javaClass.simpleName}: ${e.message}")
                      } finally { loading = false }
                  }
              }

              private fun refreshM3u(force: Boolean) {
                  if (loading) return
                  val playlists = PlaylistStore.all(this)
                  if (playlists.isEmpty()) {
                      m3uChannels = emptyList()
                      if (tab == "m3u") showError("Плейлисты не добавлены.\nНажмите 📺 вверху, чтобы добавить M3U/M3U8.")
                      return
                  }
                  loading = true
                  if (m3uChannels.isEmpty()) b.progress.visibility = View.VISIBLE
                  lifecycleScope.launch {
                      try {
                          val online = NetworkUtils.isOnline(this@MainActivity)
                          val all = mutableListOf<Channel>()
                          for (pl in playlists) {
                              val cached = withContext(Dispatchers.IO) { M3uRepository.loadCached(this@MainActivity, pl) }
                              val stale = System.currentTimeMillis() - pl.updatedAt > 6 * 60 * 60 * 1000L
                              val list = if (pl.type != "manual" && online && (force || stale || cached.isEmpty()))
                                  M3uRepository.refresh(this@MainActivity, pl) else cached
                              all += list
                              val meta = PlaylistStore.find(this@MainActivity, pl.id) ?: pl
                              if (online && meta.epgUrl.isNotBlank() && (force || !EpgStore.isFresh(this@MainActivity, pl.id))) {
                                  EpgStore.refresh(this@MainActivity, meta)
                              }
                              EpgStore.ensureLoaded(this@MainActivity, pl.id)
                          }
                          m3uChannels = all
                          b.progress.visibility = View.GONE
                          if (all.isNotEmpty()) {
                              pruneFavorites(all.map { it.url }.toSet(), vk = false)
                              applyFavorites()
                              if (tab == "m3u") updateView(scrollToLast = force)
                          } else if (tab == "m3u") {
                              showError("Плейлисты пусты или недоступны.\nНажмите 📺 → обновить.")
                          }
                      } catch (e: Exception) {
                          b.progress.visibility = View.GONE
                          CrashLogger.error("Main", "Загрузка M3U", e)
                      } finally { loading = false }
                  }
              }

              private fun pruneFavorites(actual: Set<String>, vk: Boolean) {
                  val favs = prefs.getStringSet("favorites", emptySet())?.toMutableSet() ?: return
                  val before = favs.size
                  favs.removeAll { url -> if (vk) UrlUtils.isVk(url) && url !in actual else !UrlUtils.isVk(url) && url !in actual }
                  if (favs.size < before) {
                      prefs.edit().putStringSet("favorites", favs).apply()
                      CrashLogger.info("Favorites", "Удалено ${before - favs.size} мёртвых записей")
                  }
              }

              private fun showError(text: String) {
                  b.progress.visibility = View.GONE
                  b.error.text = text
                  b.error.visibility = View.VISIBLE
              }

              private fun updateView(scrollToLast: Boolean) {
                  applyFavorites()
                  val source = if (tab == "vk") vkChannels else m3uChannels
                  var list = if (showOnlyFavorites) source.filter { it.isFavorite } else source
                  if (tab == "m3u" && groupFilter != null) list = list.filter { it.group == groupFilter }
                  displayed = list

                  val suffix = offlineNotice()?.let { " · $it" } ?: ""
                  b.txtTitle.text = "${list.size} каналов$suffix"
                  b.btnFavFilter.setTextColor(if (showOnlyFavorites) Color.WHITE else Color.parseColor("#FFEB3B"))
                  b.btnGroups.text = groupFilter ?: "Группы"

                  if (list.isEmpty()) {
                      b.recycler.adapter = null
                      if (tab == "m3u" && PlaylistStore.all(this).isEmpty())
                          showError("Плейлисты не добавлены.\nНажмите 📺 вверху, чтобы добавить M3U/M3U8.")
                      else if (showOnlyFavorites) showError("В избранном пока пусто.\nДолгое нажатие ОК на канале — добавить ★")
                      return
                  }

                  b.error.visibility = View.GONE
                  val newRows = mutableListOf<ChannelAdapter.Row>()
                  var n = 1
                  val favs = list.filter { it.isFavorite }
                  val rest = list.filter { !it.isFavorite }
                  if (favs.isNotEmpty() && !showOnlyFavorites) {
                      newRows.add(ChannelAdapter.Row.Header("★ ИЗБРАННОЕ (${favs.size})"))
                      favs.forEach { newRows.add(ChannelAdapter.Row.Item(it, n++)) }
                  }
                  if (tab == "m3u") {
                      rest.groupBy { it.group.ifBlank { "Без группы" } }.toSortedMap().forEach { (g, items) ->
                          newRows.add(ChannelAdapter.Row.Header("${g.uppercase()} (${items.size})"))
                          items.forEach { newRows.add(ChannelAdapter.Row.Item(it, n++)) }
                      }
                  } else {
                      if (favs.isNotEmpty() && !showOnlyFavorites && rest.isNotEmpty())
                          newRows.add(ChannelAdapter.Row.Header("ВСЕ КАНАЛЫ (${rest.size})"))
                      rest.forEach { newRows.add(ChannelAdapter.Row.Item(it, n++)) }
                  }
                  rows = newRows

                  b.recycler.visibility = View.VISIBLE
                  b.recycler.adapter = ChannelAdapter(rows, { ch ->
                      if (ch.source == Channel.SOURCE_M3U && ch.playlistId.isNotBlank()) {
                          val (now, _) = EpgStore.nowNext(ch.playlistId, ch.tvgId, ch.name)
                          now?.let { "Сейчас: ${it.title}" } ?: ch.group
                      } else ch.group
                  }, { ch ->
                      val idx = displayed.indexOfFirst { it.url == ch.url }.coerceAtLeast(0)
                      PlaybackQueue.set(displayed, idx)
                      prefs.edit().putString("last_channel_url", ch.url).apply()
                      startActivity(Intent(this, PlayerActivity::class.java)
                          .putExtra("index", idx)
                          .putExtra("url", ch.url))
                  }, { ch -> toggleFavorite(ch) })

                  b.recycler.post {
                      if (scrollToLast) scrollToLastChannel() else b.recycler.getChildAt(0)?.requestFocus()
                  }
              }

              private fun toggleFavorite(ch: Channel) {
                  val favs = prefs.getStringSet("favorites", emptySet())?.toMutableSet() ?: mutableSetOf()
                  if (favs.contains(ch.url)) favs.remove(ch.url) else favs.add(ch.url)
                  prefs.edit().putStringSet("favorites", favs).apply()
                  updateView(scrollToLast = false)
              }

              private fun scrollToLastChannel() {
                  val url = prefs.getString("last_channel_url", null) ?: return
                  val pos = rows.indexOfFirst { it is ChannelAdapter.Row.Item && it.ch.url == url }
                  if (pos < 0) return
                  (b.recycler.layoutManager as LinearLayoutManager).scrollToPositionWithOffset(pos, 0)
                  b.recycler.postDelayed({
                      b.recycler.findViewHolderForAdapterPosition(pos)?.itemView?.requestFocus()
                  }, 120)
              }

              private fun showGroupDialog() {
                  val groups = m3uChannels.map { it.group.ifBlank { "Без группы" } }.distinct().sorted()
                  if (groups.isEmpty()) { Toast.makeText(this, "Групп пока нет", Toast.LENGTH_SHORT).show(); return }
                  val items = arrayOf("Все группы") + groups.toTypedArray()
                  AlertDialog.Builder(this).setTitle("Группа каналов").setItems(items) { _, w ->
                      groupFilter = if (w == 0) null else groups[w - 1]
                      updateView(scrollToLast = false)
                  }.show()
              }

              private fun readConfig(): Pair<List<Channel>, String> = try {
                  val json = assets.open("vk_config.json").bufferedReader().use { it.readText() }
                  val o = JSONObject(json)
                  val manual = mutableListOf<Channel>()
                  o.optJSONArray("channels")?.let { arr ->
                      for (i in 0 until arr.length()) {
                          val c = arr.optJSONObject(i) ?: continue
                          val url = c.optString("url")
                          if (url.isBlank()) continue
                          manual.add(Channel(
                              name = c.optString("name", "Канал"),
                              url = url, logo = c.optString("logo"),
                              group = c.optString("group", "VK Video"),
                              source = Channel.SOURCE_VK
                          ))
                      }
                  }
                  val cats = o.optJSONArray("categories")
                  manual to (if (cats != null && cats.length() > 0) cats.getString(0) else "")
              } catch (e: Exception) {
                  CrashLogger.info("Main", "vk_config.json недоступен (${e.javaClass.simpleName}) — работаем без него")
                  emptyList<Channel>() to ""
              }

              private fun performStartupCleanup() {
                  try {
                      File(cacheDir, "update.apk").takeIf { it.exists() }?.delete()
                      StreamCache.cleanup(this)
                      val protectedDirs = setOf("image_cache", "doh_cache")
                      val week = 7L * 24 * 60 * 60 * 1000
                      val now = System.currentTimeMillis()
                      var removed = 0
                      cacheDir.listFiles()?.forEach { f ->
                          if (f.isFile && now - f.lastModified() > week) { if (f.delete()) removed++ }
                          else if (f.isDirectory && f.name !in protectedDirs) {
                              f.listFiles()?.forEach { inner ->
                                  if (inner.isFile && now - inner.lastModified() > week) { if (inner.delete()) removed++ }
                              }
                          }
                      }
                      if (removed > 0) CrashLogger.info("Cleanup", "Удалено $removed старых файлов")
                      val cacheSize = cacheDir.walkTopDown().filter { it.isFile }.sumOf { it.length() }
                      if (cacheSize > 20L * 1024 * 1024) {
                          cacheDir.listFiles()?.forEach { it.deleteRecursively() }
                          CrashLogger.info("Cleanup", "cacheDir превысил 20 МБ — очищен")
                      }
                      val filesSize = filesDir.walkTopDown().filter { it.isFile }.sumOf { it.length() }
                      if (filesSize > 60L * 1024 * 1024) {
                          CrashLogger.error("Cleanup", "filesDir=${filesSize / 1024 / 1024}МБ — аварийная очистка кэшей")
                          ChannelCache.clear(this); ThumbCache.clearAll(this); StreamCache.clearAll(this)
                      }
                      val free = StatFs(filesDir.path).availableBytes / 1024 / 1024
                      CrashLogger.info("Cleanup", "files=${filesSize / 1024}КБ cache=${cacheSize / 1024}КБ free=${free}МБ")
                  } catch (e: Exception) { CrashLogger.error("Cleanup", "Автоочистка", e) }
              }

              private fun manualCheckForUpdates() {
                  if (!NetworkUtils.isOnline(this)) {
                      Toast.makeText(this, "Нет подключения к интернету", Toast.LENGTH_SHORT).show(); return
                  }
                  Toast.makeText(this, "Проверка обновлений...", Toast.LENGTH_SHORT).show()
                  lifecycleScope.launch {
                      val info = UpdateChecker.checkForUpdate(this@MainActivity)
                      if (info == null) Toast.makeText(this@MainActivity,
                          "✅ Последняя версия (v${BuildConfig.VERSION_CODE})", Toast.LENGTH_LONG).show()
                      else UpdateDialog.show(this@MainActivity, info.versionCode, info.changelog) {
                          startUpdateDownload(info.downloadUrl)
                      }
                  }
              }

              private fun startUpdateDownload(url: String) {
                  Toast.makeText(this, "Загрузка обновления...", Toast.LENGTH_LONG).show()
                  lifecycleScope.launch {
                      val file = UpdateChecker.downloadApk(this@MainActivity, url)
                      if (file == null) Toast.makeText(this@MainActivity, "Не удалось скачать", Toast.LENGTH_LONG).show()
                      else installApk(file)
                  }
              }

              private fun installApk(file: File) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                      Toast.makeText(this, "Разрешите установку", Toast.LENGTH_LONG).show()
                      try {
                          startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                      } catch (_: Exception) {}
                      return
                  }
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      startActivity(Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      })
                  } catch (e: Exception) {
                      CrashLogger.error("OTA", "Установка", e)
                      Toast.makeText(this, "Ошибка: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun showLogDialog() {
                  val log = CrashLogger.readAll(this)
                  AlertDialog.Builder(this)
                      .setTitle("Лог приложения")
                      .setMessage(log.takeLast(3000))
                      .setPositiveButton("Отправить") { _, _ -> CrashLogger.share(this) }
                      .setNegativeButton("Скопировать") { _, _ ->
                          (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager)
                              .setPrimaryClip(ClipData.newPlainText("log", log))
                          Toast.makeText(this, "Лог скопирован", Toast.LENGTH_SHORT).show()
                      }
                      .setNeutralButton("Закрыть", null).show()
              }
          }
          EOF

      - name: "📺 PlaylistsActivity"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/PlaylistsActivity.kt << 'EOF'
          package com.tvplayer.app

          import android.app.AlertDialog
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.LayoutInflater
          import android.view.View
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.tvplayer.app.databinding.ActivityPlaylistsBinding
          import kotlinx.coroutines.launch
          import java.util.UUID

          class PlaylistsActivity : AppCompatActivity() {

              private lateinit var b: ActivityPlaylistsBinding

              private val pickFile = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri == null) return@registerForActivityResult
                  try {
                      contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  } catch (_: Exception) {}
                  val name = displayName(uri) ?: "Плейлист"
                  addPlaylist(Playlist(UUID.randomUUID().toString().take(8), name, "file", uri.toString()))
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  b = ActivityPlaylistsBinding.inflate(layoutInflater)
                  setContentView(b.root)
                  b.recycler.layoutManager = LinearLayoutManager(this)
                  b.btnBack.setOnClickListener { finish() }
                  b.btnAdd.setOnClickListener { showAddDialog() }
                  b.btnRefreshAll.setOnClickListener { refreshAll() }
                  render()
              }

              override fun onResume() { super.onResume(); render() }

              private fun displayName(uri: Uri): String? = try {
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (i >= 0 && c.moveToFirst()) c.getString(i) else null
                  }
              } catch (_: Exception) { null }

              private fun render() {
                  val items = PlaylistStore.all(this)
                  b.recycler.adapter = PlaylistAdapter(items) { showActions(it) }
                  b.empty.visibility = if (items.isEmpty()) View.VISIBLE else View.GONE
                  b.empty.text = "Плейлистов пока нет.\n\n" +
                          "Нажмите «＋ Добавить» и выберите:\n" +
                          "📁 файл .m3u / .m3u8 с устройства\n" +
                          "🔗 ссылку на плейлист (автообновление раз в 6 ч)\n" +
                          "✏️ один канал вручную (имя + ссылка)\n\n" +
                          "EPG подхватывается из x-tvg-url автоматически,\nлибо задаётся вручную в свойствах плейлиста."
              }

              private fun showAddDialog() {
                  val options = arrayOf("📁 Из файла", "🔗 По ссылке", "✏️ Канал вручную")
                  AlertDialog.Builder(this).setTitle("Добавить плейлист").setItems(options) { _, w ->
                      when (w) {
                          0 -> try { pickFile.launch(arrayOf("*/*")) }
                               catch (e: Exception) { Toast.makeText(this, "Файловый менеджер недоступен", Toast.LENGTH_LONG).show() }
                          1 -> inputDialog("Ссылка на M3U", "https://example.com/list.m3u8", "") { url ->
                              if (!UrlUtils.isHttp(url)) { toast("Нужна ссылка http/https"); return@inputDialog }
                              val name = UrlUtils.host(url).ifBlank { "Плейлист" }
                              addPlaylist(Playlist(UUID.randomUUID().toString().take(8), name, "url", url))
                          }
                          2 -> inputDialog("Название канала", "Например: Первый канал", "") { name ->
                              inputDialog("Ссылка на поток", "https://... .m3u8", "") { url ->
                                  if (!UrlUtils.isHttp(url)) { toast("Нужна ссылка http/https"); return@inputDialog }
                                  M3uRepository.addManualChannel(this, name.ifBlank { "Канал" }, url)
                                  toast("Канал добавлен")
                                  render()
                              }
                          }
                      }
                  }.show()
              }

              private fun showActions(p: Playlist) {
                  val options = arrayOf("🔄 Обновить", "📡 Ссылка EPG (XMLTV)", "✏️ Переименовать", "🗑 Удалить")
                  AlertDialog.Builder(this).setTitle(p.name).setItems(options) { _, w ->
                      when (w) {
                          0 -> refreshOne(p)
                          1 -> inputDialog("EPG XMLTV (.xml или .xml.gz)", "https://.../epg.xml.gz", p.epgUrl) { url ->
                              PlaylistStore.update(this, p.id) { it.copy(epgUrl = url.trim()) }
                              val updated = PlaylistStore.find(this, p.id)
                              if (updated != null && updated.epgUrl.isNotBlank()) {
                                  b.progress.visibility = View.VISIBLE
                                  lifecycleScope.launch {
                                      val ok = EpgStore.refresh(this@PlaylistsActivity, updated)
                                      EpgStore.ensureLoaded(this@PlaylistsActivity, updated.id)
                                      b.progress.visibility = View.GONE
                                      toast(if (ok) "EPG загружен" else "EPG не удалось загрузить")
                                      render()
                                  }
                              } else { EpgStore.clear(this, p.id); render() }
                          }
                          2 -> inputDialog("Название плейлиста", "", p.name) { name ->
                              PlaylistStore.update(this, p.id) { it.copy(name = name.ifBlank { it.name } ) }
                              render()
                          }
                          3 -> AlertDialog.Builder(this)
                              .setTitle("Удалить «${p.name}»?")
                              .setMessage("Каналы и EPG этого плейлиста будут удалены из приложения.")
                              .setPositiveButton("Удалить") { _, _ ->
                                  PlaylistStore.remove(this, p.id); render()
                              }.setNegativeButton("Отмена", null).show()
                      }
                  }.show()
              }

              private fun addPlaylist(p: Playlist) {
                  if (!PlaylistStore.add(this, p)) {
                      toast("Достигнут лимит плейлистов (${PlaylistStore.MAX_PLAYLISTS})"); return
                  }
                  render()
                  refreshOne(p)
              }

              private fun refreshOne(p: Playlist) {
                  if (p.type != "manual" && !NetworkUtils.isOnline(this)) { toast("Нет интернета"); return }
                  b.progress.visibility = View.VISIBLE
                  lifecycleScope.launch {
                      val list = M3uRepository.refresh(this@PlaylistsActivity, p)
                      val meta = PlaylistStore.find(this@PlaylistsActivity, p.id) ?: p
                      if (meta.epgUrl.isNotBlank() && NetworkUtils.isOnline(this@PlaylistsActivity))
                          EpgStore.refresh(this@PlaylistsActivity, meta)
                      EpgStore.ensureLoaded(this@PlaylistsActivity, p.id)
                      b.progress.visibility = View.GONE
                      toast("${p.name}: ${list.size} каналов")
                      render()
                  }
              }

              private fun refreshAll() {
                  val items = PlaylistStore.all(this)
                  if (items.isEmpty()) { toast("Плейлистов нет"); return }
                  b.progress.visibility = View.VISIBLE
                  lifecycleScope.launch {
                      var total = 0
                      items.forEach { p ->
                          total += M3uRepository.refresh(this@PlaylistsActivity, p).size
                          val meta = PlaylistStore.find(this@PlaylistsActivity, p.id) ?: p
                          if (meta.epgUrl.isNotBlank() && NetworkUtils.isOnline(this@PlaylistsActivity))
                              EpgStore.refresh(this@PlaylistsActivity, meta)
                      }
                      b.progress.visibility = View.GONE
                      toast("Обновлено: $total каналов")
                      render()
                  }
              }

              private fun inputDialog(title: String, hint: String, value: String, onOk: (String) -> Unit) {
                  val view = LayoutInflater.from(this).inflate(R.layout.dialog_input, null)
                  view.findViewById<TextView>(R.id.inputHint).text = hint
                  val field = view.findViewById<EditText>(R.id.inputField)
                  field.setText(value)
                  AlertDialog.Builder(this).setTitle(title).setView(view)
                      .setPositiveButton("ОК") { _, _ -> onOk(field.text.toString().trim()) }
                      .setNegativeButton("Отмена", null).show()
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
          EOF
