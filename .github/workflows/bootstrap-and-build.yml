      # ── 3. Keystore: генерируем и коммитим один раз ──
      - name: Ensure keystore
        run: |
          if [ ! -f "keystore.jks" ]; then
            keytool -genkey -v -keystore keystore.jks \
              -alias tvplayer -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tvplayer123 -keypass tvplayer123 \
              -dname "CN=TVPlayer, OU=Dev, O=Dev, L=City, S=State, C=RU"
            git add keystore.jks
            git commit -m "add keystore"
            git push
          fi

      # ── 4. Сборка ──
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # ── 5. Переименование с версией и датой ──
      - name: Prepare APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then echo "::error::APK не найден"; exit 1; fi
          V=$(grep 'versionName' app/build.gradle | head -1 | awk -F'"' '{print $2}')
          TAG="v${V}-$(date +%Y%m%d-%H%M)"
          FILE="TVPlayer_${TAG}.apk"
          cp "$SRC" "$FILE"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Размер: $(du -h "$FILE" | cut -f1)"

      # ── 6. Публикуем в Releases ──
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: TV Player ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: false
          make_latest: true
