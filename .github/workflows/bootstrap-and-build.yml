        run: |
          cat > app/src/main/python/resolver.py << 'EOF'
          import yt_dlp
          import urllib.request
          import re
          import socket
          socket.setdefaulttimeout(15)
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Referer": "https://vk.com/",
              "Origin":  "https://vk.com",
          }
          def resolve(url):
              try:
                  opts = {"quiet": True, "no_warnings": True, "skip_download": True,
                          "http_headers": HEADERS, "socket_timeout": 15}
                  with yt_dlp.YoutubeDL(opts) as ydl:
                      info = ydl.extract_info(url, download=False)
                  if info.get("url") and ".m3u8" in info["url"]:
                      return info["url"]
                  formats = info.get("formats", [])
                  for f in formats:
                      if f.get("protocol") == "m3u8":
                          u = f.get("url", "")
                          if "master" in u or "index.m3u8" in u:
                              return u
                  best = None; max_h = -1
                  for f in formats:
                      if f.get("protocol") == "m3u8":
                          h = f.get("height") or 0
                          if h > max_h: max_h = h; best = f
                  if best: return best["url"]
                  return info.get("url") or "ERROR: no m3u8 found"
              except Exception as e:
                  return "ERROR: " + str(e)
          def get_thumbnail(url):
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=15) as response:
                      html = response.read().decode('utf-8', errors='ignore')
                      match = re.search(r'<meta property="og:image" content="([^"]+)"', html)
                      if match:
                          return match.group(1)
              except Exception:
                  pass
              try:
                  with yt_dlp.YoutubeDL({"quiet": True, "skip_download": True,
                                         "http_headers": HEADERS, "socket_timeout": 15}) as ydl:
                      info = ydl.extract_info(url, download=False)
                      return info.get("thumbnail", "")
              except Exception:
                  return ""
          EOF

      # ═══════════════════════════════════════════════════
      # ШАГ 3: Kotlin Core
      # ═══════════════════════════════════════════════════
      - name: "🧠 Kotlin Core"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/java/com/tvplayer/app/VkApi.kt << 'EOF'
          package com.tvplayer.app
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.util.UUID
          import java.util.concurrent.TimeUnit
          data class Channel(val name: String, val url: String, val logo: String, val group: String = "VK Live", var isFavorite: Boolean = false)
          private val client = OkHttpClient.Builder().connectTimeout(10, TimeUnit.SECONDS).readTimeout(20, TimeUnit.SECONDS).build()
          private val UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          suspend fun loadChannels(categoryId: String, manual: List<Channel>): List<Channel> =
              withContext(Dispatchers.IO) {
                  val result = mutableListOf<Channel>()
                  try {
                      val url = "https://api.live.vkvideo.ru/v1/catalog/public_video_streams/category/$categoryId/stream/?limit=100"
                      val req = Request.Builder().url(url)
                          .header("User-Agent", UA).header("Accept", "application/json, text/plain, */*")
                          .header("Origin", "https://live.vkvideo.ru").header("Referer", "https://live.vkvideo.ru/")
                          .header("X-App", "streams_web").header("X-From-Id", UUID.randomUUID().toString()).build()
                      client.newCall(req).execute().use { resp ->
                          val body = resp.body?.string().orEmpty()
                          if (resp.isSuccessful && body.isNotBlank()) {
                              val streams = JSONObject(body).optJSONObject("data")?.optJSONArray("streamBlogs")
                              if (streams != null) for (i in 0 until streams.length()) {
                                  val item = streams.optJSONObject(i) ?: continue
                                  if (!item.optBoolean("is_online", true)) continue
                                  val blog = item.optJSONObject("blog") ?: continue
                                  val blogUrl = blog.optString("blogUrl"); if (blogUrl.isBlank()) continue
                                  val raw = blog.optString("title").ifBlank { blog.optJSONObject("owner")?.optString("displayName").orEmpty() }.ifBlank { blogUrl }
                                  val name = if (raw.length > 60) raw.take(60) + "…" else raw
                                  val logo = blog.optJSONObject("owner")?.optString("avatarUrl")?.ifBlank { null } ?: blog.optString("coverUrl")
                                  result.add(Channel(name, "https://live.vkvideo.ru/$blogUrl", logo))
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  result + manual
              }
          EOF

          cat > app/src/main/java/com/tvplayer/app/NetworkUtils.kt << 'EOF'
          package com.tvplayer.app
          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          object NetworkUtils {
              fun isOnline(context: Context): Boolean {
                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val network = cm.activeNetwork ?: return false
                  val capabilities = cm.getNetworkCapabilities(network) ?: return false
                  return capabilities.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) &&
                         capabilities.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)
              }
          }
          EOF

          cat > app/src/main/java/com/tvplayer/app/StreamResolver.kt << 'EOF'
          package com.tvplayer.app
          import com.chaquo.python.Python
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          object StreamResolver {
              suspend fun resolve(url: String): String = withContext(Dispatchers.IO) {
                  try {
                      val m = Python.getInstance().getModule("resolver")
                      m.callAttr("resolve", url).toString()
                  } catch (e: Exception) { "ERROR: " + (e.message ?: e.toString()) }
              }
              suspend fun getThumbnail(url: String): String = withContext(Dispatchers.IO) {
                  try {
                      val m = Python.getInstance().getModule("resolver")
                      m.callAttr("get_thumbnail", url).toString()
                  } catch (_: Exception) { "" }
              }
          }
          EOF

          cat > app/src/main/java/com/tvplayer/app/StreamCache.kt << 'EOF'
          package com.tvplayer.app
          import android.content.Context
          object StreamCache {
              private const val PREFS = "stream_cache"
              private const val TTL_MS = 60 * 60 * 1000L
              fun get(context: Context, channelUrl: String): String? {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val entry = prefs.getString(channelUrl, null) ?: return null
                  val parts = entry.split("|")
                  if (parts.size != 2) return null
                  val url = parts[0]
                  val ts = parts[1].toLongOrNull() ?: return null
                  if (System.currentTimeMillis() - ts > TTL_MS) {
                      prefs.edit().remove(channelUrl).apply()
                      return null
                  }
                  return url
              }
              fun put(context: Context, channelUrl: String, m3u8: String) {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  prefs.edit().putString(channelUrl, "$m3u8|${System.currentTimeMillis()}").apply()
              }
              fun invalidate(context: Context, channelUrl: String) {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  prefs.edit().remove(channelUrl).apply()
              }
              fun clearAll(context: Context) {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  prefs.edit().clear().apply()
              }
          }
          EOF

