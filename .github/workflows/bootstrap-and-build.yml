          - name: "🐍 Python resolver (стелс + строгий DoH)"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          cat > app/src/main/python/resolver.py << 'EOF'
          import socket
          import time
          import random
          import threading
          import urllib.request
          import re

          DOH_URL = "https://dns.adguard-dns.com/dns-query"
          DOH_HOSTS = {"dns.adguard-dns.com", "dns.google", "cloudflare-dns.com", "dns.quad9.net"}
          DOH_TIMEOUT = 1.5
          DOH_SLOW_THRESHOLD = 1.2
          DNS_TTL = 300
          DNS_CACHE = {}
          DNS_CACHE_MAX = 512

          _lock = threading.Lock()
          _doh_fail_until = 0.0
          _doh_consecutive_fails = 0
          _DOH_MAX_FAILS = 3
          _DOH_COOLDOWN = 60
          _doh_enabled = True
          _doh_slow_count = 0
          _doh_resolved_count = 0
          _system_fallback_count = 0

          try:
              import dns.message
              import dns.rdatatype
              _DNS_AVAILABLE = True
          except Exception:
              _DNS_AVAILABLE = False

          _orig_getaddrinfo = socket.getaddrinfo


          def set_doh_enabled(enabled):
              global _doh_enabled, _doh_slow_count, _doh_consecutive_fails, _doh_fail_until
              with _lock:
                  _doh_enabled = bool(enabled)
                  DNS_CACHE.clear()
                  _doh_slow_count = 0
                  _doh_consecutive_fails = 0
                  _doh_fail_until = 0.0


          def _doh_lookup(host, timeout=DOH_TIMEOUT):
              q = dns.message.make_query(host, dns.rdatatype.A)
              req = urllib.request.Request(
                  DOH_URL,
                  data=q.to_wire(),
                  headers={
                      "Content-Type": "application/dns-message",
                      "Accept": "application/dns-message",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  msg = dns.message.from_wire(resp.read())
              ips = []
              for rrset in msg.answer or []:
                  for rr in rrset:
                      if rr.rdtype == dns.rdatatype.A:
                          ips.append(str(rr))
              return ips


          def _fallback(host, port, family, type_, proto, flags):
              global _system_fallback_count
              with _lock:
                  _system_fallback_count += 1
              return _orig_getaddrinfo(host, port, family, type_, proto, flags)


          def _doh_getaddrinfo(host, port, family=0, type=0, proto=0, flags=0):
              global _doh_fail_until, _doh_consecutive_fails, _doh_slow_count
              global _doh_resolved_count

              if not _doh_enabled or not _DNS_AVAILABLE or host in DOH_HOSTS:
                  return _fallback(host, port, family, type, proto, flags)
              if family not in (0, socket.AF_INET):
                  return _orig_getaddrinfo(host, port, family, type, proto, flags)
              if time.time() < _doh_fail_until:
                  return _fallback(host, port, family, type, proto, flags)

              now = time.time()
              with _lock:
                  cached = DNS_CACHE.get(host)
              if cached and (now - cached[1]) < DNS_TTL:
                  ips = cached[0]
              else:
                  try:
                      started = time.time()
                      ips = _doh_lookup(host)
                      elapsed = time.time() - started
                      with _lock:
                          if elapsed > DOH_SLOW_THRESHOLD:
                              _doh_slow_count += 1
                              if _doh_slow_count >= 3:
                                  _doh_fail_until = time.time() + _DOH_COOLDOWN
                          else:
                              _doh_slow_count = 0
                      if not ips:
                          with _lock:
                              _doh_consecutive_fails = 0
                          return _fallback(host, port, family, type, proto, flags)
                      with _lock:
                          if len(DNS_CACHE) >= DNS_CACHE_MAX:
                              for k in sorted(DNS_CACHE, key=lambda x: DNS_CACHE[x][1])[:DNS_CACHE_MAX // 5]:
                                  DNS_CACHE.pop(k, None)
                          DNS_CACHE[host] = (ips, now)
                          _doh_consecutive_fails = 0
                          _doh_resolved_count += 1
                  except Exception:
                      with _lock:
                          _doh_consecutive_fails += 1
                          if _doh_consecutive_fails >= _DOH_MAX_FAILS:
                              _doh_fail_until = time.time() + _DOH_COOLDOWN
                      return _fallback(host, port, family, type, proto, flags)

              result = []
              for ip in ips:
                  try:
                      result.append((socket.AF_INET, socket.SOCK_STREAM, 6, "", (ip, port)))
                  except Exception:
                      pass
              if not result:
                  return _fallback(host, port, family, type, proto, flags)
              return result


          socket.getaddrinfo = _doh_getaddrinfo


          def doh_health():
              with _lock:
                  return {
                      "available": _DNS_AVAILABLE,
                      "enabled": _doh_enabled,
                      "consecutive_fails": _doh_consecutive_fails,
                      "cooldown_active": time.time() < _doh_fail_until,
                      "cooldown_remaining": max(0, int(_doh_fail_until - time.time())),
                      "cache_size": len(DNS_CACHE),
                      "doh_resolved": _doh_resolved_count,
                      "system_fallback": _system_fallback_count,
                      "slow_count": _doh_slow_count,
                  }


          import yt_dlp

          socket.setdefaulttimeout(15)

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Referer": "https://vk.com/",
              "Origin": "https://vk.com",
          }

          _VK_RE = re.compile(r"^https?://([^/]+\.)?(vk\.com|vk\.ru|vkvideo\.ru)/", re.I)


          def _is_vk(url):
              return bool(_VK_RE.match(url or ""))


          def _jitter():
              time.sleep(random.uniform(0.2, 0.5))


          def resolve(url):
              try:
                  if not _is_vk(url):
                      return url
                  _jitter()
                  opts = {
                      "quiet": True,
                      "no_warnings": True,
                      "skip_download": True,
                      "http_headers": HEADERS,
                      "socket_timeout": 15,
                      "retries": 2,
                      "noplaylist": True,
                  }
                  with yt_dlp.YoutubeDL(opts) as ydl:
                      info = ydl.extract_info(url, download=False)

                  formats = info.get("formats") or []
                  hls = [f for f in formats
                         if f.get("url") and (
                             f.get("protocol") in ("m3u8", "m3u8_native")
                             or ".m3u8" in f["url"])]
                  if hls:
                      master = [f for f in hls
                                if "master" in f["url"] or "index.m3u8" in f["url"]]
                      if master:
                          return master[0]["url"]
                      best = max(hls, key=lambda f: (f.get("height") or 0))
                      return best["url"]

                  direct = info.get("url") or ""
                  if direct:
                      return direct
                  return "ERROR[NoStream]: поток не найден"
              except Exception as e:
                  return "ERROR[" + type(e).__name__ + "]: " + str(e)


          def get_thumbnail(url):
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=10) as response:
                      html = response.read(400000).decode("utf-8", errors="ignore")
                  m = re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']', html)
                  if not m:
                      m = re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']', html)
                  if m:
                      return m.group(1)
              except Exception:
                  pass
              if not _is_vk(url):
                  return ""
              try:
                  _jitter()
                  with yt_dlp.YoutubeDL({
                      "quiet": True, "no_warnings": True, "skip_download": True,
                      "http_headers": HEADERS, "socket_timeout": 15, "noplaylist": True,
                  }) as ydl:
                      info = ydl.extract_info(url, download=False)
                      return info.get("thumbnail", "") or ""
              except Exception:
                  return ""
          EOF

