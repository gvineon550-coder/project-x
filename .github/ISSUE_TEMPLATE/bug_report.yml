name: 🐛 Сообщить об ошибке
description: Зафиксировать баг или сбой в работе приложения
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему, чтобы её было проще воспроизвести и исправить.

  - type: input
    id: app-version
    attributes:
      label: Версия приложения (APK)
      description: Какая версия установлена сейчас?
      placeholder: например, v1.0.2
    validations:
      required: true

  - type: dropdown
    id: android-version
    attributes:
      label: Версия Android
      options:
        - Android 15 / 16
        - Android 14
        - Android 13
        - Android 12 или старше
        - Не знаю
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло?
      description: Кратко опишите суть ошибки и что вы ожидали увидеть.
      placeholder: При нажатии на кнопку обновления приложение закрывается...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести ошибку?
      description: Пошаговые действия, которые приводят к сбою.
      value: |
        1. Открыть приложение
        2. Перейти в раздел...
        3. Нажать на...
    validations:
      required: false
