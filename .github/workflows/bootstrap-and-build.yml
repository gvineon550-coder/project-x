              }

              private fun updateDohToggleUI() {
                  val enabled = DohSettings.isEnabled(this)
                  b.btnToggleDoh.text = if (enabled) "🟢 AdGuard DoH: ВКЛ" else "🔴 AdGuard DoH: ВЫКЛ"
                  b.btnToggleDoh.setTextColor(Color.parseColor(if (enabled) "#FF4ADE80" else "#FFFF6B6B"))
              }

              private fun toggleDoh() {
                  val newState = !DohSettings.isEnabled(this)
                  b.btnToggleDoh.isEnabled = false
                  b.btnToggleDoh.text = "⏳ Применение..."
                  b.btnToggleDoh.setTextColor(Color.parseColor("#FF8A8D93"))
                  lifecycleScope.launch {
                      DohSettings.setEnabled(this@SettingsActivity, newState)
                      val pyOk = withContext(Dispatchers.IO) { syncPythonDohFlag(newState) }
                      try { Coil.reset() } catch (_: Exception) {}
                      HttpClientProvider.reset()
                      if (!pyOk) {
                          DohSettings.setEnabled(this@SettingsActivity, !newState)
                          DohProvider.invalidate()
                          try { Coil.reset() } catch (_: Exception) {}
                          Toast.makeText(this@SettingsActivity,
                              "❌ Python не ответил. Состояние не изменено.", Toast.LENGTH_LONG).show()
                      } else {
                          Toast.makeText(this@SettingsActivity,
                              if (newState) "🟢 DoH включён везде" else "🔴 DoH выключен везде",
                              Toast.LENGTH_LONG).show()
                      }
                      updateDohToggleUI()
                      b.btnToggleDoh.isEnabled = true
                  }
              }

              private fun syncPythonDohFlag(enabled: Boolean): Boolean {
                  if (!Python.isStarted()) {
                      CrashLogger.info("DoH", "Python не запущен — флаг применится при старте резолвера")
                      return true
                  }
                  for (attempt in 0 until 3) {
                      try {
                          val m = Python.getInstance().getModule("resolver")
                          m.callAttr("set_doh_enabled", enabled)
                          val h = m.callAttr("doh_health").toString()
                          val py = Regex("'enabled':\\s*(True|False)").find(h)?.groupValues?.get(1) == "True"
                          if (py == enabled) {
                              CrashLogger.info("DoH", "✅ Python: enabled=$enabled (попытка ${attempt + 1})")
                              return true
                          }
                      } catch (e: Exception) {
                          CrashLogger.error("DoH", "Синхронизация (попытка ${attempt + 1})", e)
                      }
                      try { Thread.sleep(200) } catch (_: InterruptedException) {
                          Thread.currentThread().interrupt(); return false
                      }
                  }
                  return false
              }

              private fun runDohDiagnostics() {
                  b.txtDohResult.text = "⏳ Проверка DoH..."
                  b.btnCheckDoh.isEnabled = false
                  lifecycleScope.launch {
                      val report = withContext(Dispatchers.IO) {
                          try { DohProvider.runFullDiagnostics(this@SettingsActivity) }
                          catch (e: Exception) { "❌ Ошибка: ${e.message}" }
                      }
                      b.txtDohResult.text = report
                      b.btnCheckDoh.isEnabled = true
                  }
              }

              private fun performFullReset() {
                  try {
                      getSharedPreferences("tvplayer", MODE_PRIVATE).edit().clear().apply()
                      getSharedPreferences("stream_cache", MODE_PRIVATE).edit().clear().apply()
                      getSharedPreferences("thumb_cache", MODE_PRIVATE).edit().clear().apply()
                      getSharedPreferences("quality_prefs", MODE_PRIVATE).edit().clear().apply()
                      getSharedPreferences("doh_settings", MODE_PRIVATE).edit().clear().apply()
                      PlaylistStore.clearAll(this)
                      ChannelCache.clear(this)
                      CrashLogger.clear(this)
                      EpgStore.clearMemory()
                      PlaybackQueue.clear()
                      try {
                          val il = Coil.imageLoader(this)
                          il.diskCache?.clear(); il.memoryCache?.clear()
                      } catch (_: Exception) {}
                      cacheDir.listFiles()?.forEach { it.deleteRecursively() }
                      DohProvider.invalidate()
                      HttpClientProvider.reset()
                      try { Coil.reset() } catch (_: Exception) {}
                      lifecycleScope.launch(Dispatchers.IO) { syncPythonDohFlag(true) }
                      updateDohToggleUI()
                      updateCacheInfo()
                      Toast.makeText(this, "Полный сброс выполнен", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      CrashLogger.error("Settings", "Полный сброс", e)
                      Toast.makeText(this, "Ошибка: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun checkUpdate() {
                  b.txtStatus.text = "⏳ Проверка обновлений..."
                  b.txtStatus.setTextColor(Color.parseColor("#FF8A8D93"))
                  lifecycleScope.launch {
                      val info = UpdateChecker.checkForUpdate(this@SettingsActivity)
                      if (info == null) {
                          b.txtStatus.text = "✅ У вас актуальная версия"
                          b.txtStatus.setTextColor(Color.parseColor("#FF4ADE80"))
                      } else {
                          b.txtStatus.text = "🎉 Доступно обновление v${info.versionCode}!"
                          b.txtStatus.setTextColor(Color.parseColor("#FFFACC15"))
                          UpdateDialog.show(this@SettingsActivity, info.versionCode, info.changelog) {
                              startUpdateDownload(info.downloadUrl)
                          }
                      }
                  }
              }

              private fun updateCacheInfo() {
                  try {
                      val img = File(cacheDir, "image_cache").walkTopDown().filter { it.isFile }.sumOf { it.length() }
                      val vk = File(filesDir, "channels_cache.json").let { if (it.exists()) it.length() else 0L }
                      val m3u = filesDir.listFiles()?.filter { it.name.startsWith("m3u_") }?.sumOf { it.length() } ?: 0L
                      val epg = filesDir.listFiles()?.filter { it.name.startsWith("epg_") }?.sumOf { it.length() } ?: 0L
                      val log = File(filesDir, "app.log").let { if (it.exists()) it.length() else 0L }
                      val stream = getSharedPreferences("stream_cache", MODE_PRIVATE).all.values
                          .sumOf { ((it as? String)?.length ?: 0).toLong() }
                      val thumbs = getSharedPreferences("thumb_cache", MODE_PRIVATE).all.values
                          .sumOf { ((it as? String)?.length ?: 0).toLong() }
                      val totalCache = cacheDir.walkTopDown().filter { it.isFile }.sumOf { it.length() }
                      val totalFiles = filesDir.walkTopDown().filter { it.isFile }.sumOf { it.length() }
                      b.txtCacheStats.text = buildString {
                          appendLine("🖼 Картинки: ${fmt(img)}")
                          appendLine("📋 VK список: ${fmt(vk)}")
                          appendLine("📺 Плейлисты: ${fmt(m3u)}")
                          appendLine("📡 EPG: ${fmt(epg)}")
                          appendLine("🔗 Ссылки: ${fmt(stream)}")
                          appendLine("🖇 Превью: ${fmt(thumbs)}")
                          appendLine("📝 Лог: ${fmt(log)}")
                          appendLine("📦 Cache: ${fmt(totalCache)}")
                          append("💾 Files: ${fmt(totalFiles)}")
                      }
                      b.btnClearCache.text = "🗑 Очистить кэш (${fmt(totalCache)})"
                  } catch (e: Exception) {
                      b.txtCacheStats.text = "Не удалось посчитать: ${e.message}"
                  }
              }

              private fun fmt(bytes: Long): String = when {
                  bytes < 1024 -> "$bytes Б"
                  bytes < 1024 * 1024 -> "${bytes / 1024} КБ"
                  else -> String.format("%.1f МБ", bytes / 1024f / 1024f)
              }

              private fun startUpdateDownload(url: String) {
                  Toast.makeText(this, "Загрузка обновления...", Toast.LENGTH_LONG).show()
                  lifecycleScope.launch {
                      val file = UpdateChecker.downloadApk(this@SettingsActivity, url)
                      if (file == null) Toast.makeText(this@SettingsActivity, "Не удалось скачать", Toast.LENGTH_LONG).show()
                      else installApk(file)
                  }
              }

              private fun installApk(file: File) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                      Toast.makeText(this, "Разрешите установку", Toast.LENGTH_LONG).show()
                      try {
                          startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                      } catch (_: Exception) {}
                      return
                  }
                  try {
                      val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      startActivity(Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      })
                  } catch (e: Exception) {
                      CrashLogger.error("OTA", "Установка", e)
                      Toast.makeText(this, "Ошибка: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }
          }
