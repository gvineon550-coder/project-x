name: Build & Release TV Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3

      # ── 1. Определяем, есть ли уже проект ──
      - name: Detect project
        id: detect
        run: |
          if [ -f "app/build.gradle" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ── 2. Генерируем все файлы проекта (первый запуск) ──
      - name: Generate project
        if: steps.detect.outputs.exists == 'false'
        run: |
          set -e
          mkdir -p .github/workflows \
                   app/src/main/java/com/tvplayer/app \
                   app/src/main/python \
                   app/src/main/assets \
                   app/src/main/res/{layout,values,xml,drawable,mipmap-anydpi-v26}

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TVPlayer"
          include(":app")
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "15.0.1" apply false
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.tvplayer.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.tvplayer.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("${rootDir}/keystore.jks")
                      storePassword = "tvplayer123"
                      keyAlias = "tvplayer"
                      keyPassword = "tvplayer123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
              buildFeatures { viewBinding = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              sourceSets {
                  getByName("main") { python.srcDirs("src/main/python") }
              }
          }

          chaquopy {
              defaultConfig {
                  version = "3.11"
                  pip { install("yt-dlp") }
              }
          }

          dependencies {
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("io.coil-kt:coil:2.6.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.lifecycle:lifecycle-service:2.8.3")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
