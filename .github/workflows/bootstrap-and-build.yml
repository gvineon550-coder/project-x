name: Build & Release TV Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔍 Проверка версии yt-dlp"
        id: checkytdlp
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['version'])")
          LAST_BUILT=$(cat .last_ytdlp_version 2>/dev/null || echo "none")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LATEST" = "$LAST_BUILT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$LATEST" > .last_ytdlp_version
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ═══════════════════════════════════════════════════
      # ШАГ 1: Манифест, build.gradle, XML, иконки, сплэш
      # ═══════════════════════════════════════════════════
      - name: "📦 Манифест, иконки, сплэш, фоны кнопок"
        if: steps.checkytdlp.outputs.skip != 'true'
        run: |
          pip install --quiet Pillow

          python3 - << 'PYEOF'
          path = "app/build.gradle"
          with open(path) as f: txt = f.read()
          if "buildConfig = true" not in txt:
              txt = txt.replace("viewBinding = true", "viewBinding = true\n        buildConfig = true")
          if "GITHUB_REPO" not in txt:
              txt = txt.replace(
                  'versionName = "1.0"',
                  'versionName = "1.0"\n        buildConfigField "String", "GITHUB_REPO", "\\"${System.getenv(\'GITHUB_REPOSITORY\') ?: \'user/tvplayer\'}\\""'
              )
          if "core-splashscreen" not in txt:
              txt = txt.replace(
                  'implementation("androidx.lifecycle:lifecycle-service:2.8.3")',
                  'implementation("androidx.lifecycle:lifecycle-service:2.8.3")\n    implementation("androidx.core:core-splashscreen:1.0.1")'
              )
          with open(path, "w") as f: f.write(txt)
          PYEOF

          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw
          import os
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for dpi, size in sizes.items():
              folder = f'app/src/main/res/mipmap-{dpi}'
              os.makedirs(folder, exist_ok=True)
              img = Image.new('RGBA', (size, size), (15, 17, 21, 255))
              draw = ImageDraw.Draw(img)
              margin = size // 8
              draw.ellipse([margin, margin, size-margin, size-margin], fill=(37, 99, 235, 255))
              tx = size // 2 - size // 12
              ty = size // 2 - size // 6
              draw.polygon([(tx, ty), (tx, ty + size // 3), (tx + size // 3, size // 2)], fill=(255, 255, 255, 255))
              img.save(f'{folder}/ic_launcher.png')
              img.save(f'{folder}/ic_launcher_round.png')
          print("✅ PNG-иконки сгенерированы")
          PYEOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#2563EB"
                  android:pathData="M54,20 C72.78,20 88,35.22 88,54 C88,72.78 72.78,88 54,88 C35.22,88 20,72.78 20,54 C20,35.22 35.22,20 54,20 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L48,66 L68,54 Z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/splash_logo.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="200dp" android:height="200dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2563EB"
                  android:pathData="M54,20 C72.78,20 88,35.22 88,54 C88,72.78 72.78,88 54,88 C35.22,88 20,72.78 20,54 C20,35.22 35.22,20 54,20 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M48,42 L48,66 L68,54 Z" />
          </vector>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.TVPlayer" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:textColor">@color/text</item>
              </style>
              <style name="Theme.TVPlayer.Splash" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">@color/bg</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>
                  <item name="postSplashScreenTheme">@style/Theme.TVPlayer</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:name="com.chaquo.python.android.PyApplication"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.TVPlayer">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@style/Theme.TVPlayer.Splash"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity" android:exported="false"
                      android:screenOrientation="unspecified" />
                  <activity android:name=".PlayerActivity" android:exported="false"
                      android:screenOrientation="sensorLandscape" />
                  <service android:name=".PlaybackService" android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
          </paths>
          EOF

          # ═══ ФОНЫ КНОПОК С ПОДСВЕТКОЙ ПРИ ФОКУСЕ ═══

          # Для текстовых кнопок: чёрный → белый + синяя обводка
          cat > app/src/main/res/drawable/button_focus_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FFFFFFFF" />
                      <stroke android:width="3dp" android:color="#FF2563EB" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#AA000000" />
                      <corners android:radius="8dp" />
                  </shape>
              </item>
          </selector>
          EOF

          # Для Play/Pause: чёрный → синий (белая иконка остаётся видимой)
          cat > app/src/main/res/drawable/btn_play_pause_focus.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="oval">
                      <solid android:color="#FF2563EB" />
                      <stroke android:width="3dp" android:color="#FFFFFFFF" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="oval">
                      <solid android:color="#00000000" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/card_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FF1C1F26" />
                      <stroke android:width="2dp" android:color="#FFFFFFFF" />
                      <corners android:radius="14dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#FF1C1F26" />
                      <corners android:radius="14dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/button_accent_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FF3B82F6" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#FF2563EB" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/layout/item_channel.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="12dp"
              android:focusable="true"
              android:focusableInTouchMode="true"
              android:background="@drawable/tile_selector"
              android:clickable="true"
              android:layout_marginBottom="4dp"
              android:gravity="center_vertical">
              <TextView
                  android:id="@+id/txtNumber"
                  android:layout_width="40dp"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:textColor="@color/text_dim"
                  android:textSize="16sp"
                  android:textStyle="bold" />
              <ImageView
                  android:id="@+id/logo"
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:scaleType="centerCrop"
                  android:background="#222222" />
              <TextView
                  android:id="@+id/name"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:paddingStart="16dp"
                  android:paddingEnd="8dp"
                  android:gravity="center_vertical"
                  android:textColor="@color/text"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:maxLines="2"
                  android:ellipsize="end" />
              <ImageView
                  android:id="@+id/btnFav"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:padding="8dp"
                  android:src="@android:drawable/btn_star_big_off"
                  android:focusable="false"
                  android:clickable="false" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">
              <LinearLayout
